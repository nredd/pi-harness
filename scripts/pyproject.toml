# Tooling config only: scripts/ is not an installable project. The root Makefile runs these checks
# with the pinned ruff/ty/pytest from the `integration` uv environment.
[tool.ruff]
line-length = 110
target-version = "py313"
per-file-target-version = { "ci_paths.py" = "py312", "install_gh_linux.py" = "py312", "install_wsl_owned_tools.py" = "py312", "wsl2_exec.py" = "py312", "wsl2_run.py" = "py312" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "PT", "C4", "PTH", "RET"]
ignore = [
    # Test tables and git helpers legitimately take several parameters.
    "PLR0913",
    # Magic values are the point of assertion tables.
    "PLR2004",
]
# Tests set `sys.path` explicitly before importing the script under test.
per-file-ignores = { "tests/**" = ["E402"] }

[tool.ty.environment]
python-version = "3.13"
# `package_contracts.py` imports `harness` from the source tree; see its `sys.path` entry.
root = [".", "../integration"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
# CLI tests spawn `sys.executable`; measure those child processes so `main()` counts like any other code.
patch = ["subprocess"]
