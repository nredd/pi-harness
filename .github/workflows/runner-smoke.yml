# Proves each self-hosted runner pool is up and isolated. See docs/self-hosted-runners.md.
name: Runner smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/runner-smoke.yml
      - docs/self-hosted-runners.md
      - scripts/wsl2_smoke.sh

permissions:
  contents: read

jobs:
  pi-linux:
    # Same-repo only: a fork PR could rewrite `runs-on`, so this guard is NOT the security boundary.
    # The boundary is fork-PR approval, repo-scoped JIT runners and the per-VM firewall.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: smoke (pi-linux)
    runs-on: [self-hosted, pi-linux]
    timeout-minutes: 10
    steps:
      - name: Identify the runner
        run: |
          uname -a
          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
          nproc
          free -g | head -2
      - name: Public internet reachable
        run: curl -fsS --max-time 10 -o /dev/null https://api.github.com
      - name: Private networks unreachable
        env:
          SMOKE_EXTRA_TARGETS: ${{ vars.SMOKE_EXTRA_TARGETS }}
        run: |
          fail=0
          set -f
          [ -z "$SMOKE_EXTRA_TARGETS" ] && echo "note: SMOKE_EXTRA_TARGETS is empty, only the neutral targets are probed"
          for target in 10.0.0.1:80 172.16.0.1:80 192.168.0.1:80 192.168.255.254:22 100.64.0.1:22 100.100.100.100:22 169.254.169.254:80 $SMOKE_EXTRA_TARGETS; do
            if ! [[ "$target" =~ ^[A-Za-z0-9._-]+:[0-9]+$ ]]; then
              echo "::error::malformed target (want host:port): $target"; fail=1; continue
            fi
            if timeout 5 bash -c "exec 3<>/dev/tcp/${target%:*}/${target#*:}" 2>/dev/null; then
              echo "::error::reachable: $target"; fail=1
            else
              echo "blocked: $target"
            fi
          done
          exit $fail

  pi-macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: smoke (pi-macos)
    runs-on: [self-hosted, pi-macos]
    timeout-minutes: 10
    steps:
      - name: Identify the runner
        run: |
          uname -a
          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH user=$(id -un)"
          sw_vers -productVersion
      - name: Public internet reachable
        run: curl -fsS --max-time 10 -o /dev/null https://api.github.com
      - name: Private networks unreachable
        env:
          SMOKE_EXTRA_TARGETS: ${{ vars.SMOKE_EXTRA_TARGETS }}
        run: |
          fail=0
          set -f
          [ -z "$SMOKE_EXTRA_TARGETS" ] && echo "note: SMOKE_EXTRA_TARGETS is empty, only the neutral targets are probed"
          for target in 10.0.0.1:80 172.16.0.1:80 192.168.0.1:80 192.168.255.254:22 100.64.0.1:22 100.100.100.100:22 169.254.169.254:80 $SMOKE_EXTRA_TARGETS; do
            if ! [[ "$target" =~ ^[A-Za-z0-9._-]+:[0-9]+$ ]]; then
              echo "::error::malformed target (want host:port): $target"; fail=1; continue
            fi
            if /usr/bin/nc -z -G 3 "${target%:*}" "${target#*:}" 2>/dev/null; then
              echo "::error::reachable: $target"; fail=1
            else
              echo "blocked: $target"
            fi
          done
          exit $fail
      - name: Owner home unreadable
        env:
          SMOKE_OWNER_HOME: ${{ vars.SMOKE_OWNER_HOME }}
        run: |
          if [ -z "$SMOKE_OWNER_HOME" ]; then echo "note: SMOKE_OWNER_HOME is empty, skipping the home probe"; exit 0; fi
          if [ ! -d "$SMOKE_OWNER_HOME" ]; then echo "::error::SMOKE_OWNER_HOME is not a directory on this runner"; exit 1; fi
          if ls "$SMOKE_OWNER_HOME" >/dev/null 2>&1; then echo "::error::can read the owner home"; exit 1; fi
          echo "blocked: owner home"

  pi-wsl2:
    # Same-repo guard as above, and the same caveat: the boundary is the pool supervisor's admission check (it
    # refuses any run whose head repository is not this one), repo-scoped single-use JIT runners and the
    # per-job VM's firewall. The host-specific targets arrive through the runner's environment
    # (`SMOKE_HOST_IP`, `SMOKE_DEV_IP`, `SMOKE_DEV_PORTS`), never from this repository.
    # Until the pool's heartbeat variable exists no runner carries the label, so a PR-triggered job would queue
    # forever (`timeout-minutes` only starts once a runner picks it up): PRs wait for the pool, and the acceptance
    # smoke before that is a manual `workflow_dispatch`.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (vars.PI_WSL2_HEARTBEAT != '' && github.event.pull_request.head.repo.full_name == github.repository)
    name: smoke (pi-wsl2)
    runs-on: [self-hosted, pi-wsl2]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Identify the runner
        run: |
          uname -a
          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH user=$(id -un)"
          nproc
          free -g | head -2
      - name: Isolation smoke
        run: bash scripts/wsl2_smoke.sh
