# Owned-code gates and packed-artifact contracts. See docs/ci.md.
name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    name: classify changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      wsl_inputs: ${{ steps.classify.outputs.wsl_inputs }}
      stack_inputs: ${{ steps.classify.outputs.stack_inputs }}
      benchmark_inputs: ${{ steps.classify.outputs.benchmark_inputs }}
      plan: ${{ steps.classify.outputs.plan }}
      changed_files: ${{ steps.classify.outputs.changed_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Classify changed paths
        # `plan` is every cell's decision (run, scenarios, gates, NOT RUN reason); the jobs below only read it.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            # A frozen release-verification/<sha> ref can verify an older main
            # candidate without moving it forward merely because main advanced.
            case "$GITHUB_REF" in
              refs/heads/main|"refs/heads/release-verification/$GITHUB_SHA") ;;
              *) echo 'Full verification requires main or an exact frozen candidate ref' >&2; exit 1 ;;
            esac
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            # No diff to read: every input is true and every cell runs for real.
            python3 scripts/ci_paths.py --full --event "$EVENT" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_paths.py --base "$BASE" --head "$HEAD" --event "$EVENT" \
              --pr-title="$PR_TITLE" --pr-number "${PR_NUMBER:-0}" --github-output "$GITHUB_OUTPUT"
          fi
      - name: Report classification
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          WSL_INPUTS: ${{ steps.classify.outputs.wsl_inputs }}
          STACK_INPUTS: ${{ steps.classify.outputs.stack_inputs }}
          BENCHMARK_INPUTS: ${{ steps.classify.outputs.benchmark_inputs }}
          CHANGED_FILES: ${{ steps.classify.outputs.changed_files }}
        run: |
          echo "Changed-path classification: docs-only=$DOCS_ONLY wsl-inputs=$WSL_INPUTS stack-inputs=$STACK_INPUTS benchmark-inputs=$BENCHMARK_INPUTS"
          echo "::notice title=bench not run::No quiet self-hosted runner yet; hosted runners cannot meet the bench admission policy"
          {
            echo "### CI path classification"
            echo
            echo "Docs-only: \`$DOCS_ONLY\`"
            echo
            echo "WSL inputs: \`$WSL_INPUTS\`"
            echo
            echo "Stack inputs: \`$STACK_INPUTS\`"
            echo
            echo "Benchmark inputs: \`$BENCHMARK_INPUTS\`"
            echo
            echo "Changed files:"
            echo '```text'
            printf '%s\n' "$CHANGED_FILES"
            echo '```'
            echo
            echo "### bench: NOT RUN"
            echo "No quiet self-hosted runner exists yet (migration plan section 7). This is not a pass."
          } >>"$GITHUB_STEP_SUMMARY"

  owned:
    if: ${{ !cancelled() }}
    name: owned (${{ matrix.os }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, wsl2]
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            guest: linux
          - os: macos-14
            runner: xcode-27
            guest: macos
          - os: wsl2
            runner: windows-2025
            guest: wsl2
    # A cell the plan does not run (NOT RUN, or blocked, or no plan at all) reports from a cheap Ubuntu job and holds
    # no macOS or Windows slot.
    runs-on: ${{ !fromJSON(needs.classify.outputs.plan || '{}')[format('owned ({0})', matrix.os)].run && 'ubuntu-24.04' || matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.guest == 'wsl2' && format('bash "{0}/scripts/wsl2_host.sh" {{0}}', github.workspace) || 'bash -e {0}' }}
    timeout-minutes: ${{ matrix.os == 'wsl2' && 45 || 30 }}
    steps:
      - name: Select and verify Git Bash on the Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          $bash = Join-Path $gitBin 'bash.exe'
          if (!(Test-Path $bash)) { throw "Missing Git Bash: $bash" }
          $env:PATH = "$gitBin;$env:PATH"
          $resolved = (Get-Command bash.exe -All -CommandType Application | Select-Object -First 1).Source
          Write-Output "Resolved Git Bash: $resolved; expected: $bash"
          if ($resolved -ne $bash) { throw "Ambiguous Bash resolution: $resolved" }
          & $bash --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gitBin >> $env:GITHUB_PATH
          "PI_CI_GIT_BASH=$bash" >> $env:GITHUB_ENV
          "Git Bash executable: $resolved" >> $env:GITHUB_STEP_SUMMARY
      # The plan step lives in a local action, so a sparse checkout of `.github/actions` comes first. The full
      # checkout below runs only when the plan says the cell runs.
      - name: Check out the local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: plan
        name: Report execution plan
        uses: ./.github/actions/report-plan
        with:
          cell: ${{ format('owned ({0})', matrix.os) }}
          plan: ${{ needs.classify.outputs.plan }}
          classify_result: ${{ needs.classify.result }}
          changed_files: ${{ needs.classify.outputs.changed_files }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.plan.outputs.run == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        id: tools
        if: steps.plan.outputs.run == 'true'
        with:
          guest: ${{ matrix.guest }}
          owned: 'true'
      # Real reviewer reads need system binaries, not Pi's live latest-release download fallback.
      - name: Install reviewer read dependencies (Ubuntu)
        if: steps.plan.outputs.run == 'true' && matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install --yes ripgrep fd-find
      # fd-find 10.4.2+ ships binstall metadata matching its release assets; fail rather than compile from source.
      - name: Install reviewer read dependencies (macOS)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        if: steps.plan.outputs.run == 'true' && runner.os == 'macOS'
        env:
          BINSTALL_DISABLE_STRATEGIES: compile
        with:
          tool: ripgrep@14.1.1,fd-find@10.5.0
      - name: Verify reviewer read dependencies
        if: steps.plan.outputs.run == 'true'
        run: |
          rg --version
          if command -v fd >/dev/null; then fd --version; else fdfind --version; fi
      - name: Initialize the core fork at its Gitlink
        if: steps.plan.outputs.run == 'true'
        run: git submodule update --init forks/pi
      # Verifies the root core overrides before `npm ci`; the read-only token is for `gh attestation verify`.
      - name: Install
        id: install
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make install-owned
      # computer-use's Linux helper checks (cargo tests, packed-source build, diagnostics) run inside `check-ts` on
      # Ubuntu and print NOT RUN on macOS. ARM64 is compile-only (`cargo check`, no linker): never a runtime claim.
      - name: Add the aarch64 Linux compile target
        if: steps.plan.outputs.run == 'true' && matrix.guest != 'macos'
        run: |
          rustup target add aarch64-unknown-linux-gnu
          echo "PI_CU_LINUX_ARM64_CHECK=1" >>"$GITHUB_ENV"
      # One step per gate the plan lists, so a failing gate never hides another gate's evidence.
      - name: Owned gate check-ts (biome, tsc, Vitest on Node and Bun, computer-use checks)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && contains(steps.plan.outputs.gates, 'check-ts') }}
        run: make check-ts
      - name: Owned gate check-scripts (ruff, ty, pytest scripts, import audit)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && contains(steps.plan.outputs.gates, 'check-scripts') }}
        run: make check-scripts
      - name: Owned gate check-integration (ruff, ty, pytest integration units, probes)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && contains(steps.plan.outputs.gates, 'check-integration') }}
        run: make check-integration
      - name: Owned gate check-probes (WSL LCOV producer)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && contains(steps.plan.outputs.gates, 'check-probes') }}
        run: make check-probes
      - name: Owned gate check-import-audit (WSL LCOV producer)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.install.outcome == 'success' && contains(steps.plan.outputs.gates, 'check-import-audit') }}
        run: make check-import-audit
      - name: Coverage accounting (existing reports, including test failures)
        if: always() && steps.plan.outputs.run == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: make check-coverage BASE="$BASE"
      # WSL producers run on the guest Linux filesystem; artifact actions run on Windows.
      - uses: ./.github/actions/capture-ci-wsl
        if: always() && matrix.os == 'wsl2' && steps.tools.outcome == 'success'
      - name: Preserve independent coverage reports and summary
        if: always() && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: |
            packages/*/coverage/**/lcov.info
            integration/inprocess/coverage/**/lcov.info
            integration/probes/coverage/**/lcov.info
            scripts/coverage/**/lcov.info
            coverage/summary.json
          if-no-files-found: error
      - name: Packages without a Bun run (not run)
        if: steps.plan.outputs.run == 'true'
        run: |
          # shellcheck disable=SC2016 # the single-quoted program is JavaScript, its ${} is a JS template
          for manifest in packages/*/package.json; do
            node -e 'const m = require(process.argv[1]); if (!m.scripts["test:bun"]) console.log(`::notice title=bun test not run::${m.name} has no declared Bun suite yet`)' "./$manifest"
          done
      - name: Benchmark unit gate
        if: steps.plan.outputs.run == 'true' && runner.os == 'macOS' && (needs.classify.outputs.benchmark_inputs != 'false' || github.event_name == 'push')
        run: |
          # The runner image's Homebrew Python drifts (3.15.1 now); `pydantic-core` has no cp315 wheel in
          # `benchmarks/comparison/uv.lock`, so uv compiled it from source (~84s here, and again in every
          # cold-cache gate sync the tests run, which inherit this interpreter). Pin the repo's interpreter.
          export UV_PYTHON="$(tr -d '\n' < .python-version)"
          make install-benchmark
          # The native_runtime test runs the real Codex sandbox (Seatbelt); exact historical pin, no credentials.
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/codex" @openai/codex@0.154.0
          mkdir -p "$RUNNER_TEMP/codex-home" "$RUNNER_TEMP/codex-cache"
          CODEX_HOME="$RUNNER_TEMP/codex-home" XDG_CACHE_HOME="$RUNNER_TEMP/codex-cache" \
            PATH="$RUNNER_TEMP/codex/node_modules/.bin:$PATH" make check-benchmark
      - name: Benchmark unit gate (not run)
        if: steps.plan.outputs.run == 'true' && runner.os != 'macOS'
        run: echo "::notice title=check-benchmark not run::macOS only, its native_runtime test needs Seatbelt"
      - name: Benchmark unit gate (not run, no benchmark inputs)
        if: steps.plan.outputs.run == 'true' && runner.os == 'macOS' && needs.classify.outputs.benchmark_inputs == 'false' && github.event_name != 'push'
        run: |
          why="This pull request changes no benchmark input (BENCHMARK_INPUT_FILES and BENCHMARK_INPUT_PREFIXES in scripts/ci_paths.py); check-benchmark runs for real on main pushes and on PRs that change them."
          echo "::notice title=check-benchmark NOT RUN::$why"
          {
            echo "### check-benchmark: NOT RUN"
            echo "$why This is not a pass."
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/capture-ci-wsl
        if: always() && matrix.os == 'wsl2' && steps.tools.outcome == 'success'
        with:
          cleanup: cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Windows'
        with:
          name: wsl2-diagnostics-owned
          path: ${{ runner.temp }}/wsl2-diagnostics/
          if-no-files-found: warn

  contracts:
    if: ${{ !cancelled() }}
    name: contracts (${{ matrix.os }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, wsl2]
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            guest: linux
          - os: macos-14
            runner: xcode-27
            guest: macos
          - os: wsl2
            runner: windows-2025
            guest: wsl2
    # A cell the plan does not run (NOT RUN, or blocked, or no plan at all) reports from a cheap Ubuntu job and holds
    # no macOS or Windows slot.
    runs-on: ${{ !fromJSON(needs.classify.outputs.plan || '{}')[format('contracts ({0})', matrix.os)].run && 'ubuntu-24.04' || matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.guest == 'wsl2' && format('bash "{0}/scripts/wsl2_host.sh" {{0}}', github.workspace) || 'bash -e {0}' }}
    timeout-minutes: ${{ matrix.os == 'wsl2' && 45 || 30 }}
    steps:
      - name: Select and verify Git Bash on the Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          $bash = Join-Path $gitBin 'bash.exe'
          if (!(Test-Path $bash)) { throw "Missing Git Bash: $bash" }
          $env:PATH = "$gitBin;$env:PATH"
          $resolved = (Get-Command bash.exe -All -CommandType Application | Select-Object -First 1).Source
          Write-Output "Resolved Git Bash: $resolved; expected: $bash"
          if ($resolved -ne $bash) { throw "Ambiguous Bash resolution: $resolved" }
          & $bash --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gitBin >> $env:GITHUB_PATH
          "PI_CI_GIT_BASH=$bash" >> $env:GITHUB_ENV
          "Git Bash executable: $resolved" >> $env:GITHUB_STEP_SUMMARY
      # The plan step lives in a local action, so a sparse checkout of `.github/actions` comes first. The full
      # checkout below runs only when the plan says the cell runs.
      - name: Check out the local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: plan
        name: Report execution plan
        uses: ./.github/actions/report-plan
        with:
          cell: ${{ format('contracts ({0})', matrix.os) }}
          plan: ${{ needs.classify.outputs.plan }}
          classify_result: ${{ needs.classify.result }}
          changed_files: ${{ needs.classify.outputs.changed_files }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.plan.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        id: tools
        if: steps.plan.outputs.run == 'true'
        with:
          guest: ${{ matrix.guest }}
      # Verifies the root core overrides before `npm ci`; the read-only token is for `gh attestation verify`.
      - name: Install
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make install-owned
      - name: Packed plugins alone on exact stock Pi, plus packed preset audit
        if: steps.plan.outputs.run == 'true'
        run: make check-package-contracts REPORT="$RUNNER_TEMP/package-contracts.json"
      - name: Packed pi-plan-mode with its registry dependency on exact stock Pi
        if: steps.plan.outputs.run == 'true'
        run: make check-plan-mode-package-contract REPORT="$RUNNER_TEMP/plan-mode-package-contracts.json"
      - name: Packed pi-computer-use on exact stock Pi (native desktop not run)
        if: steps.plan.outputs.run == 'true'
        run: make check-computer-use-package-contract REPORT="$RUNNER_TEMP/computer-use-package-contracts.json"
      - name: Packed pi-subagents with its registry dependencies on exact stock Pi
        if: steps.plan.outputs.run == 'true'
        run: make check-subagents-package-contract REPORT="$RUNNER_TEMP/subagents-package-contracts.json"
      - name: Packed pi-todo with its registry dependencies on exact stock Pi
        if: steps.plan.outputs.run == 'true'
        run: make check-todo-package-contract REPORT="$RUNNER_TEMP/todo-package-contracts.json"
      - uses: ./.github/actions/capture-ci-wsl
        if: always() && matrix.os == 'wsl2' && steps.tools.outcome == 'success'
        with:
          cleanup: cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.plan.outputs.run == 'true'
        with:
          name: contract-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/*contracts*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Windows'
        with:
          name: wsl2-diagnostics-contracts
          path: ${{ runner.temp }}/wsl2-diagnostics/
          if-no-files-found: warn

  release-core:
    if: github.event_name == 'workflow_dispatch'
    needs: classify
    uses: ./.github/workflows/forks.yml

  stack:
    if: ${{ !cancelled() }}
    name: stack (${{ matrix.os }}, ${{ matrix.stack }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, wsl2]
        stack: [personal, local]
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            guest: linux
            platform: linux-x64
          - os: macos-14
            runner: xcode-27
            guest: macos
            platform: darwin-arm64
          # Required check names with no work behind them (scripts/ci_paths.py plans NOT RUN), on Ubuntu so they
          # hold no macOS or Windows slot.
          - os: macos-14
            stack: personal
            runner: ubuntu-24.04
            guest: linux
          - os: wsl2
            runner: ubuntu-24.04
            guest: linux
            platform: linux-x64
    runs-on: ${{ !fromJSON(needs.classify.outputs.plan || '{}')[format('stack ({0}, {1})', matrix.os, matrix.stack)].run && 'ubuntu-24.04' || matrix.runner }}
    defaults:
      run:
        shell: bash -e {0}
    timeout-minutes: 40
    steps:
      # The plan step lives in a local action, so a sparse checkout of `.github/actions` comes first. The full
      # checkout below runs only when the plan says the cell runs.
      - name: Check out the local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: plan
        name: Report execution plan
        uses: ./.github/actions/report-plan
        with:
          cell: ${{ format('stack ({0}, {1})', matrix.os, matrix.stack) }}
          plan: ${{ needs.classify.outputs.plan }}
          classify_result: ${{ needs.classify.result }}
          changed_files: ${{ needs.classify.outputs.changed_files }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.plan.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        id: tools
        if: steps.plan.outputs.run == 'true'
        with:
          guest: ${{ matrix.guest }}
      - name: Initialize the core fork at its Gitlink
        if: steps.plan.outputs.run == 'true'
        run: git submodule update --init forks/pi
      - name: Install tmux (Linux)
        if: steps.plan.outputs.run == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Install tmux (macOS)
        if: steps.plan.outputs.run == 'true' && runner.os == 'macOS'
        run: brew install tmux
      - name: Verify root core overrides before install
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=integration python3 -m harness.release --verify-root-overrides --root .
      - name: Install workspace and harness dependencies
        id: workspace
        if: steps.plan.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts
          cd integration && uv sync --locked --python "$(tr -d '\n' < ../.python-version)"
      - name: Fetch exact Gitlinked core release, formula-equivalent install
        if: steps.plan.outputs.run == 'true'
        working-directory: integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C ../forks/pi fetch --tags origin
          uv run --locked python -m harness.release --gitlink ../forks/pi --prefix "$RUNNER_TEMP/pi-release"
          echo "PI_BIN=$RUNNER_TEMP/pi-release/bin/pi" >>"$GITHUB_ENV"
      - name: Report binary identity
        if: steps.plan.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/version-home" "$RUNNER_TEMP/version-agent"
          HOME="$RUNNER_TEMP/version-home" PI_CODING_AGENT_DIR="$RUNNER_TEMP/version-agent" "$PI_BIN" --version
          git -C forks/pi describe --tags --exact-match
      - name: Replay source-selected installer runtime locks without lifecycle scripts
        if: steps.plan.outputs.scenarios == 'true' && matrix.stack == 'personal'
        working-directory: integration
        run: uv run --locked python -m harness.runtime_lock --stack stacks/personal.json --replay stacks/runtime-locks.json
      - name: Assembled D and E boundaries (explicit stack, no machine config)
        if: steps.plan.outputs.scenarios == 'true'
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack "stacks/${{ matrix.stack }}.json" -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml="artifacts/stack-${{ matrix.stack }}.xml"
      - name: Report installed package identities and stack digests
        if: always() && steps.plan.outputs.run == 'true'
        working-directory: integration
        run: |
          uv run --locked python -c 'from pathlib import Path; [print(p.read_text()) for p in sorted(Path("artifacts").glob("stack-*.json"))]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.plan.outputs.run == 'true'
        with:
          name: stack-${{ matrix.os }}-${{ matrix.stack }}
          path: integration/artifacts/
          if-no-files-found: ignore
      # Each cell builds the core and runs only its own stack, so macOS keeps standalone evidence in `local`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ !cancelled() && steps.plan.outputs.scenarios == 'true' && steps.workspace.outcome == 'success' }}
        with:
          bun-version-file: .bun-version
      - name: Preserve Node failure artifacts before standalone runs
        if: ${{ always() && steps.plan.outputs.scenarios == 'true' }}
        working-directory: integration
        run: |
          if [ -d artifacts ]; then mv artifacts artifacts-node; fi
      - name: Build standalone
        id: build
        if: ${{ !cancelled() && steps.plan.outputs.scenarios == 'true' && steps.workspace.outcome == 'success' }}
        working-directory: forks/pi
        run: |
          npm ci --ignore-scripts
          # Same frozen data as forks.yml, never the live model fetch.
          version=$(node -p 'require("./packages/ai/package.json").version')
          mkdir -p "$RUNNER_TEMP/model-data"
          npm pack "@earendil-works/pi-ai@$version" --pack-destination "$RUNNER_TEMP/model-data"
          tar -xzf "$RUNNER_TEMP/model-data/earendil-works-pi-ai-$version.tgz" -C "$RUNNER_TEMP/model-data"
          rm -rf packages/ai/src/providers/data
          cp -R "$RUNNER_TEMP/model-data/package/dist/providers/data" packages/ai/src/providers/data
          # Observe Bun's compile argv/module graph without changing core sources or build flags.
          PYTHONPATH=../../integration ../../integration/.venv/bin/python -m harness.standalone_diagnostics \
            prepare-build --directory "$RUNNER_TEMP/pi-build-evidence"
          PATH="$RUNNER_TEMP/pi-build-evidence/bin:$PATH" \
            ./scripts/build-binaries.sh --skip-install --offline-model-data \
            --platform "${{ matrix.platform }}" --out "$RUNNER_TEMP/pi-standalone" \
            2>&1 | tee "$RUNNER_TEMP/pi-build-evidence/build.log"
          echo "PI_BIN=$RUNNER_TEMP/pi-standalone/${{ matrix.platform }}/pi" >>"$GITHUB_ENV"
      - name: Report standalone binary and source identity
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/version-home" "$RUNNER_TEMP/version-agent"
          HOME="$RUNNER_TEMP/version-home" PI_CODING_AGENT_DIR="$RUNNER_TEMP/version-agent" "$PI_BIN" --version
          git -C forks/pi rev-parse HEAD
          bun --version
          shasum -a 256 "$PI_BIN" "$RUNNER_TEMP/pi-standalone/pi-${{ matrix.platform }}.tar.gz"
      - name: Strict standalone startup with failure-only diagnostics
        id: startup
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' && matrix.platform == 'linux-x64' && matrix.stack == 'personal' }}
        working-directory: integration
        run: |
          uv run --locked python -m harness.standalone_diagnostics startup \
            --binary "$PI_BIN" --core ../forks/pi \
            --build-evidence "$RUNNER_TEMP/pi-build-evidence" \
            --output "$RUNNER_TEMP/standalone-startup-diagnostics" --github-output "$GITHUB_OUTPUT"
      - name: Upload scanned standalone startup failure evidence
        if: ${{ !cancelled() && steps.startup.outcome == 'failure' && steps.startup.outputs.artifact_ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-startup-linux-x64
          path: ${{ runner.temp }}/standalone-startup-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Standalone D and E (personal)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' && matrix.stack == 'personal' }}
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack stacks/personal.json --runtime bun-standalone -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml=artifacts/standalone-personal.xml
      - name: Candidate compiled-core auth adapter (personal)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' && matrix.stack == 'personal' }}
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_auth_transport.py \
            --stack stacks/personal.json --runtime bun-standalone --bun-auth-adapter -m stack \
            --log-cli-level=INFO --junitxml=artifacts/standalone-auth-personal.xml
      - name: Standalone D and E (local)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' && matrix.stack == 'local' }}
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack stacks/local.json --runtime bun-standalone -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml=artifacts/standalone-local.xml
      - name: Candidate compiled-core auth adapter (local)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' && matrix.stack == 'local' }}
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_auth_transport.py \
            --stack stacks/local.json --runtime bun-standalone --bun-auth-adapter -m stack \
            --log-cli-level=INFO --junitxml=artifacts/standalone-auth-local.xml
      - name: Report coverage exclusions
        if: ${{ always() && steps.plan.outputs.scenarios == 'true' }}
        shell: bash -e {0}
        run: |
          echo "Bun standalone: default D/E retains seven auth skips (#14). Separate candidate compiled-core auth adapter steps execute the unchanged assertions; consult their outcome and JUnit, not this notice, for evidence." >>"$GITHUB_STEP_SUMMARY"
          echo "linux-arm64, packed contracts under standalone, bench, live credentials and desktop helpers: NOT RUN." >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.plan.outputs.scenarios == 'true' }}
        with:
          name: standalone-${{ matrix.platform }}-${{ matrix.stack }}
          path: integration/artifacts/
          if-no-files-found: ignore
