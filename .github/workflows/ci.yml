# Owned-code gates and packed-artifact contracts. Policy is documented inline below.
name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}', github.run_id, github.run_attempt) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Policy: Flake admission
# Flake policy
#
# Flake policy:
#
# - A new correctness failure blocks
# - A documented, isolated flake may get ONE fresh rerun of the whole failed job, only when nothing else
#   failed. The rerun must pass. Both attempts stay in the run's attempt history; name the flake in the PR
# - Known timing-sensitive suites: session-kit `monitor` and `diff` reaping, dev-tools kill escalation,
#   core `chord`/`durable` 5 s timeouts. They were green alone and flaky on a loaded laptop
# - Historical dev-tools child-sample race (#499): sampler `0.2.0` could drop the whole baseline on a
#   mid-`/proc` PID exit. Source consumers now pin `0.2.1`, which removes that iterator mechanism.
#   A new missing-metadata failure is a correctness blocker, not permission to retry
# - `npm` SIGABRT on the `pi-macos` pool (#542): the job log's shell line reads
#   `<pid> Abort trap: 6  npm ci ...` or `npm install ...`, the step exits 134 with no npm error output,
#   the runner is `pi-macos-*` and no other step failed. Cause: macOS LaunchServices aborts in
#   `_LSApplicationCheckIn` when npm sets `process.title`. Only that exact match allows ONE fresh rerun
#   of the whole job; record each occurrence on #542 (run, job, host crash report name). An abort from any other
#   process, any other runner, or with other output is a new correctness failure and blocks. The
#   allowance lapses when a macOS update removes the `_LSApplicationCheckIn` abort, or when a different
#   signature appears, which blocks
# - Runner-supervisor kill on self-hosted macOS runners (#761): the job's check-run annotation reads
#   `The self-hosted runner lost communication with the server`, a step stays `in_progress` with no
#   conclusion, the job log is missing (`log not found`, logs API 404) and no test assertion exists.
#   Attempt 1 of `43177772438` (two jobs) and of `43201041536` (one job) match. In each the supervisor
#   logged `idle past ttl, killing` for the exact runner while its job ran, and GitHub failed the job
#   later: `43177772438` killed 2026-11-12 07:57:54 UTC, failed 08:06:54; `43201041536` killed 10:55:03,
#   failed 11:04:10. Why the scheduler saw those runners as idle is NOT established. Mitigation
#   `nredd/ci-runners#4` is merged. Deployment is observed, never assumed: in the supervisor-log step the
#   runner owner records the `nredd/ci-runners` commit the supervisor was running at the kill and confirms
#   it predates the #4 merge commit. If it includes #4 or cannot be determined, treat as deployed and
#   block, whatever #761 says. Any deploy comment on #761 sets the deploy time (its stated time, else its
#   own timestamp); a kill at or after it blocks, even if the recorded commit predates #4. Either signal
#   alone blocks. The failed job proves nothing about the repository. To triage: read the annotation
#   (`gh api repos/nredd/pi-harness/check-runs/<job id>/annotations`), then the supervisor log for that
#   exact runner (runner owner only). ONE fresh rerun per affected whole job is allowed only with ALL
#   THREE recorded (the annotation; a supervisor kill of that runner while the job ran; the supervisor
#   commit at the kill, confirmed to predate the #4 merge commit), and when nothing else failed; it must
#   pass, and both attempts stay in the
#   history. Jobs lost to one supervisor event are one incident. Until the rerun passes, the cell is a failed
#   required check. A matching annotation without a supervisor-log kill of that runner, a log-less failure
#   without the annotation, or any other failure is a new signature and blocks. Record each occurrence on
#   #761 (run, job, runner). Never read missing logs as a pass
# - Subagents' genuine manager-reload fixture also includes synchronous TypeScript preparation and child
#   imports inside its 5 s test deadline. PR #138's macOS failure reported that deadline at 5597 ms
#   ([here](https://github.com/nredd/pi-harness/actions/runs/40369078357/job/121734701111)). Controlled
#   compiler/import delays reproduce the same timeout on the unchanged `origin/main` source while the
#   child passes every budget assertion and exits successfully. Vitest checks elapsed time even after
#   a synchronous test returns. Compile each source once and write its output to two physical ESM trees;
#   the test pins that operation count and retains distinct managers, shared waiters and final zero usage.
#   Neither the 5 s test deadline nor the 10 s child watchdog changes. This does not authorize a rerun
# - Never rerun until green, never relabel NOT RUN as a pass

jobs:
  # Policy: CI planning and bypasses
  # PRs expand only Ubuntu cells. Docs-only PRs retain NOT RUN receipts for the four required names.
  # A missing plan or invalid squash subject fails those checks. The personal stack runs setup only
  # on PRs without stack inputs. Main pushes and full dispatches run both OSes; only the frozen
  # dispatch also runs the Gitlink gate and qualifies for release evidence.
  # Only macOS execution jobs share a per-cell concurrency group across main pushes. GitHub keeps
  # only one pending job per group and replaces older pending jobs; that is intentional here.
  # Group by cell, not runner, so changes in pool routing do not prevent supersession. Dispatches
  # get a run/attempt key at both levels in this workflow. Report-only macOS jobs get private job
  # groups so they cannot displace executing cells. Ubuntu jobs have no job-level concurrency.

  # Policy: Self-hosted routing policy
  # ## Self-hosted pools
  #
  # Heavy Linux and macOS cells run on an owned machine while one has room, and on the hosted runner otherwise: `pi-linux` (NAS VMs, 2 slots) takes Linux cells and `pi-macos` (one conservatively usable macOS slot) takes macOS cells. Job names, steps and check names are unchanged; only a cell's runner differs in the `classify` plan. Every cell not in `CELL_SECONDS` is always hosted.
  #
  #
  # - Each pool's host writes the repo variable `PI_LINUX_HEARTBEAT` / `PI_MACOS_HEARTBEAT` every ~45 s as `<epoch>:<free>` (`0` on a clean stop), where free = slots minus running minus queued jobs for that pool's label. It is negative while more jobs wait than the pool can start, which is how a run sees that the queue is already deep. A host that has been told to stop writes `<epoch>:drain` instead: it finishes the job in flight, starts nothing new, and exits. The host only beats while its scheduler loop is alive, so a hung supervisor goes stale like a dead one. `scripts/runner_pools.py` treats a beat as up only if the epoch is a positive integer at most 120 s old (30 s of skew tolerated); a plain epoch (no count) means one free slot. Missing, `0`, stale, `drain` or garbled means hosted. A mistyped `--pool-heartbeat POOL=VALUE` fails `classify` instead of quietly going hosted
  # - Effective capacity: legacy `<epoch>:<free>` counts configured slots, not healthy accounts. macOS is capped at ONE working account with no queue allowance; other pools keep their working-slot ceilings
  # - Admission: `classify` reads a census of unfinished CI runs and their latest jobs. Observed pooled jobs consume capacity. Older classifiers, and any run that finished `classify`, reserve the pool's whole run-placeable room before their cells exist (in the pools their unlabeled cells target, else every pool). A run's share of a pool is held to its `run_cap` (one for macOS)
  # - Fail closed: a missing run id, a missing or incomplete census, or any API failure means hosted, never a fresh spend of the heartbeat. A run that finished `classify` without cells reserves the pool's whole run-placeable room (`pi-linux`: two; macOS: one). GitHub snapshots are not atomic leases: API lag can hide a predecessor
  # - Token: the census needs `actions: read`. It is a JOB-level permission on `classify` (contents stay read-only), and `GH_TOKEN` is a plain environment variable of the classify step, visible to every child process of repo scripts. The expression gives the token to ALL non-`pull_request` events (pushes and `workflow_dispatch` on any branch) and to same-repo pull requests; a fork PR gets an empty token and `--no-pools`. `actions: read` is job-wide for `classify`. This rests on the same-repo TRUST assumption in `AGENTS.md`; the only verification is a test that the census reader's argv is GET-only. Owner-approved exception recorded in `AGENTS.md` (2026-11-18)
  # - Result: the nine-run free=5 incident replays to one pooled macOS cell in the visible burst, the rest immediately hosted (a unit replay, not live behaviour)
  # - Completion-time policy: `CELL_SECONDS` ranks eligible work longest first. With no speculative queue, the admitted longest cell starts self-hosted and shorter peers run hosted. A richer working-account heartbeat can later raise the macOS ceiling without blocking this fix
  # - Rescue (`runner-rescue.yml`) moves POOL cells to hosted only. A cell queued on a dead or draining pool waits five minutes; on a live pool, ten, and only while no OTHER run has queued hosted jobs of that OS (the run's own siblings are what the restart re-plans)
  # - Hosted -> pool rescue is intentionally NOT implemented: planning at classify time is the balancing mechanism, and a hosted queue is not moved into a pool (a restart discards finished jobs and re-plans every cell, which repeatedly made runs finish later). Tracked as a follow-up
  # - `classify` excludes the pools of EVERY earlier attempt, so a stranded pool cannot attract the run back. The three-attempt cap is the final loop guard
  # - Safety: forks never move. Rescue refuses any started job (status or runner assignment, never `started_at`, which a queued job also carries), refuses full job pages, skips a run whose jobs cannot be read (e.g. rate limit) instead of aborting the tick, exits red and makes no live-pool move that tick (hosted load unknown), and rechecks the picked run's jobs before cancelling the whole run. GitHub has neither per-job migration nor atomic cancel-if-queued: a job can start in the read/cancel gap
  # - Not a queue-time SLA: five-minute cron delay, running siblings and the three-runs-per-tick limit can extend a wait
  # - Draining: a pool that is draining, or whose runners keep failing to start (three in a row, e.g. a 403 or rate limit on the JIT mint), writes `<epoch>:drain`, and is treated as down by both `classify` (no new cells) and the rescue (it moves a cell queued on it after the usual 5 minutes, without waiting for the beat to go stale), because a queued job on a pool that starts nothing would otherwise wait for the whole drain. The writer announces `drain` the moment it is told to stop, retries a failed write after 5 s, writes nothing before its first successful poll, and stops beating when it cannot read the queue. A draining host never kills a runner younger than 90 s, since the API may not list its job yet. Residual: a run already at its third attempt is not rescued, so a cell queued on a pool that then drains waits out the drain (up to the 50 minute job cap)
  # - `classify` ranks the cells this run executes in full by their measured hosted duration (`CELL_SECONDS`, from the clean `main` run 41914882314; the macOS `check-ts` shards are estimates from run 42799667706, #660) and gives the longest to each pool while it has free slots; the rest stay hosted. A cell is eligible only if it is listed, at least `MIN_HEAVY_S` (240 s) long, not in `HOSTED_ONLY_CELLS` (one shared `_routable` check) and not a bypass or setup-only cell. A self-hosted job pays ~25 s to clone and boot a VM plus a few seconds to register, so shorter cells lose. The table plus `HOSTED_ONLY_CELLS` decide CI cell routing; `native-helper.yml` has its own route job on the same admission. Only `owned shard (macos-14, ts)` and `owned shard (ubuntu-24.04, ts)` had passed on a pool before they were listed; the other macOS cells were enabled on request. The `scripts` shard has a hosted timing (1420 s) but no pool-image pass. It DEPARTS from the original issue scope (route it to the pool) and stays hosted: `make install-owned` verifies core provenance with `GH_TOKEN` and the pool has none. Follow-up: make provenance verification work without a token, then drop `HOSTED_ONLY_CELLS`. Unset or dead beats reproduce the all-hosted plan
  # - macOS routing applies only to non-PR events. The plan carries the choice: an `owned` shard's `runner` in its matrix entry, and a `contracts` or `stack` cell's top-level `runner`, which `runs-on` reads (`plan[cell].runner || matrix.runner`; a bypass cell stays on `ubuntu-24.04`)
  # - Kill switch: any non-empty repo variable `PI_POOLS_DISABLED` plans every cell hosted and makes the rescue treat every pool as down. Use it when a pool beats but cannot run jobs
  # - A fork PR never gets a pool: `classify` passes `--no-pools`. This is not the security boundary (a fork edits its own workflow; fork-PR approval for every outside contributor and the ephemeral, network-isolated runners are), it just keeps honest runs honest. The beat variables are readable by fork workflows, which only shows liveness
  #
  # - `native-helper.yml` shares macOS admission and falls back to hosted `xcode-27`. The census includes both workflows for macOS. `native-helper.yml` has no pool-image pass: a started failure fails its check. Cron rescue reads every repo run, so a stranded pool `build` is picked up only once every unfinished job of its run is unstarted (e.g. `windows-helper` already done); the whole run is then cancelled and re-run (`windows-helper` re-runs) with `pi-macos` excluded. Only attempt 1 may use the pool: `build` goes hosted on a re-run.
  # - Not routed, on purpose: `installer.yml` (same-UID package code can reach the read-only gh login; see `AGENTS.md`) and `publish.yml` (OIDC and attestation). Their macOS jobs stay hosted on `xcode-27`.
  # - GitHub disables scheduled workflows in a public repo after 60 days without repository activity; any push re-enables it, but check Actions if this repo goes quiet

  classify:
    name: classify changed paths
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      stack_inputs: ${{ steps.classify.outputs.stack_inputs }}
      plan: ${{ steps.classify.outputs.plan }}
      changed_files: ${{ steps.classify.outputs.changed_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Always validate the event's complete commit range, even for docs-only or single-workspace PRs.
      - name: Validate commit subjects
        run: make check-commits
      - id: classify
        name: Classify changed paths
        # `plan` is every cell's decision (run, scenarios, gates, NOT RUN reason); the jobs below only read it.
        env:
          # Same-repo runs only: a fork PR stays anonymous (see the Token policy bullet).
          GH_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.token || '' }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Self-hosted pools write these; a pool that is missing, stopped or stale leaves its cells hosted.
          # A fork PR never gets a pool (a fork also controls its own workflow, so this is not the boundary).
          PI_LINUX_HEARTBEAT: ${{ vars.PI_LINUX_HEARTBEAT }}
          PI_MACOS_HEARTBEAT: ${{ vars.PI_MACOS_HEARTBEAT }}
          # Maintainer kill switch: any non-empty value sends every cell back to hosted runners.
          PI_POOLS_DISABLED: ${{ vars.PI_POOLS_DISABLED }}
          UNTRUSTED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'true' || '' }}
        run: python3 scripts/ci_classify.py plan
      - name: Report classification
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          STACK_INPUTS: ${{ steps.classify.outputs.stack_inputs }}
          CHANGED_FILES: ${{ steps.classify.outputs.changed_files }}
        run: python3 scripts/ci_classify.py report

  # The shard matrix comes from the plan. The fan-in matrix selects OSes by event.
  # Policy: Owned shard gates and verification engines
  # The native Ubuntu computer-use shard also installs Rust `1.97.1`/matching LLVM tools and
  # cargo-llvm-cov `0.9.1`, with at most two Cargo jobs, then collects the Linux crate headlessly.
  # `coverage/native-linux/coverage.json` is the required raw LLVM accounting entry; unique run
  # subdirectories retain LCOV, per-file text, raw JSON, metadata and logs, with setup timings in
  # `setup.log`. Build products are not uploaded. The fan-in consumes these artifacts through the
  # report-only `computer-use-linux-native/primary` signal. Removing its selected-host report fails
  # accounting, even though uncovered counts are advisory. No native branch/statement producer or
  # Ubuntu-only signal. The ordinary packed-source/diagnostics contract is unchanged.
  #
  # `check-scripts` also runs `scripts/package_layout.py` (#861), which checks every package under `packages/`, plus the script, Biome, binary and shell rules of the shared packages, against the layout standard in #860 and prints one `<package>: <path>: <rule>` line per violation. The test layout is plural `tests/` everywhere: per package `tests/*.test.ts` (and `tests/*.bench.ts`) plus `tests/fixtures/` for every non-test file, with no `support/`, `helpers/` or per-package `lib/`; root shared code goes in `tests/lib/` and data in `tests/fixtures/`. `SHARED_PACKAGES` (`tests/inprocess`, `tests/lib`) gets the script-name, Biome, tracked-binary and shell-script rules; a configured shared path with no tracked files is a hard error (exit 2), so a move cannot leave its tree unchecked. Today's deviations, including each package's `test/` directory, are one line each in `scripts/package_layout.json` (sorted, one entry per line, so rebases conflict only where two PRs touch the same line). The list can only shrink: an entry whose violation is gone fails as stale, and an entry the merge base of `HEAD` and `origin/main` (or `BASE`; an empty `BASE` also means `origin/main`) does not carry fails, so a new violation cannot be waived by listing it. A tracked path that is new since the merge base and sits under a waived banned entry (e.g. a file added to `test/` or `lib/`) fails as `added-under-banned-entry`, so the waiver covers the directory, not what is added to it (a pure rename inside the same entry is exempt, including staged index renames). Repeated occurrences of an allowlisted import specifier may not grow beyond the merge-base count. Content rules (`import-escape`, `test-extension`, `test-name`, `shell-script`, `tracked-binary`) keep running below a banned entry, so those lines stay in the allowlist as debt. No committed binaries: files under `prebuilt/` and any tracked file with an ELF, Mach-O or PE magic number are `tracked-binary`; standalone `.sh`, `.ps1`, `.bash` and `.cmd` files outside `tests/fixtures/` are `shell-script` (use a Makefile target); `test:upstream-sync` and `test:sync-reverts` are denied script names. Script commands and code also reject textual retired sync markers under renamed entry points. `pretest` is a standard script name (it builds the gitignored `dist/` a test loads), and a relative import of exactly `scripts/runtime-builder.mjs`, `scripts/run-vitest.ts` or `scripts/vitest-package.ts` (the `SHARED_TOOLCHAIN` set; a later PR extends it) is not an `import-escape`, any other root path is. A package PR deletes its own entries. The python shard is never path-gated, and a diff that adds or deletes a package's `README.md` or `CHANGELOG.md` is not docs-only, so the gate runs for every change it reads.
  #
  #
  #
  #
  #
  # Shards (from the per-package timings in #350, run `41749405074`):
  #
  # | Cell | Shards | Why |
  # | --- | --- | --- |
  # | `owned (ubuntu-24.04)` | `subagents`; `computer-use`; `ts` (every other workspace); `python` (`check-scripts`, `check-integration`) | The issue's four units: about 196s, 157s, 254s and 271s of gate time, against 883s in one job |
  # | `owned (macos-14)` | `subagents`; `computer-use`; `ts` (every other workspace); `scripts` (`check-scripts`); `python` (`check-integration`) | Run 44008954118 spent 19m01s in scripts, then passed both full 2831-case release/harness coverage runs (228s/181s), but hit the unchanged 30m limit during probes. Separate scripts/import-audit from integration/probes/providers; keep every gate, both independent coverage passes and the two-worker cap. No new timing estimate is treated as measured pool capacity. |
  #
  # Computer-use's macOS Swift invariants explicitly prepare SDK-only imports in their private per-run
  # module cache before checking repository sources (#551). Cold preparation is visible and bounded:
  # 240s compilation, 10s per identity probe and a 300s setup-hook cap, with bounded child-group cleanup.
  # Failure fails the suite; it never authorizes source validation. `INV-8` retains its 90s test deadline,
  # `INV-17` its 50s deadline. Compiler-file/SDK-settings identity, real invalid/corrected Swift and
  # concurrent caller controls verify reuse of SDK modules, not reuse of source verdicts. No persistent
  # cross-run cache, shared gate lock or retry is introduced; #506's private caches and unwritable
  # retired-name controls remain. Details: [develop and validate](../../packages/computer-use/docs/content/docs/how-to-guides/develop-and-validate.mdx).
  #
  #
  # `tests/inprocess/`, the private `A-stack` workspace, runs in `check-ts` on Vitest and Bun:
  #
  # - `make install-owned` first runs `make verify-root-overrides` (see [releases](../../docs/releases.md)); `owned`, `contracts`, `stack` (a dedicated step before `npm ci`, plus the core fetch) and `publish.yml` verify pass the read-only job token as `GH_TOKEN` to those steps only, for non-legacy core tags. Hosted Linux and macOS runners ship a `gh` with `attestation`. A transient release-asset download failure (HTTP 502/503/504/429, connection reset, socket timeout) is retried up to 8 attempts with logged backoff (5s, 10s, 20s, then 30s, at most 155s per request); a 404/401/403, other status or checksum/size/redirect refusal fails the job on the first attempt. A `gh attestation verify` that fails with exactly `public good verifier is not available (initialization may have failed)` (the Sigstore public-good trust-root fetch) is retried up to 3 attempts with logged backoff; every other provenance failure, including other Sigstore init errors, fails the job on the first attempt. The `npm ci` that follows reads the root `.npmrc` (`fetch-retries=7`, the same 155s window) for the same CDN 5xx, and on native cells installs the core tarballs from the restored npm cache when it is warm (see [releases](../../docs/releases.md)).
  # - `make install-owned` ends its npm step with `make build` (`npm run build --workspaces --if-present`): `packages/*/dist/` is gitignored, and the `local` stack, `tests/inprocess` and `pi -e packages/plan-mode` load it from the checkout. `check-scripts`, the candidate-core scenario's workflow build, the inprocess `pretest` and the `local` stack runner build first, so a stale `dist/` is never loaded. The `stack` job runs `npm run build` after its own `npm ci`. Package-contract packing builds first too (`package_contracts.pack`).
  # - `owned` initializes only `forks/pi` (core) before `make install-owned`. The extensions load from
  #   `packages/{subagents,plan-mode,todo}`; no package-local `npm ci`, no package-local host copies
  # - `support.ts`: `startStack({ cwd?, factories, settings?, sessionManager?, useModelRuntimeStream?, withConfiguredAuth?, mode?, ui? })` creates and
  #   binds core's real harness. `loadFork(name)` imports the imported package's declared entry from `packages/<dir>`; `loadOwned(name)`
  #   imports the owned plugin's `src/index.ts`. Direct `createXxx()` factories work too
  # - Before importing a package workspace, resolve `pi-coding-agent`, `pi-tui`, `pi-ai`, `typebox` from both directories
  #   and compare real paths. A mismatch or unresolvable entry fails with the package's `node_modules/`
  #   deletion path. Node uses import conditions on `createRequire().resolve`; Bun uses
  #   `import.meta.resolve` with an explicit parent. No aliases or copied extension code
  # - Root workspace dependencies supply `croner` `10.0.1`, `nanoid` `5.1.16`, `pi-tui-kit` `0.65.5`
  #   from the imported packages' historical lockfiles. Root also anchors `nanoid` `5.1.16`: otherwise npm hoists PostCSS's
  #   `3.x` and leaves the imported subagents package's `5.x` unreachable inside the stack workspace. The `rpiv-todo`
  #   source lockfile was retired with its Gitlink; the stack workspace pins `rpiv-config` and optional peer
  #   `rpiv-i18n` to the imported package's `2.13.9` provenance, with the same integrity as that historical lockfile
  # - The test launcher isolates `HOME` at process spawn on both engines. `isolateStackHome()` keeps
  #   that home fixed (Bun caches `os.homedir()`), isolating `PI_CODING_AGENT_DIR` and XDG config
  #   independently per fixture before loading entries.
  #   `plan-todos.test.ts` drives the real Plan/todo pair, canonical RPC chooser selections, core
  #   compaction with scripted summaries, file-backed dispose/reopen and legacy mode entries.
  #   `/todos` heading counts share the evidenced-batch test; no second process
  # - `goal-support.ts` shares one injected clock across the real kit, router and subagents factories,
  #   with credential-free usage snapshots and explicitly configured faux auth. Goal/Plan/todo,
  #   loop/Plan, child accounting, scheduled/busy/idle notices and quota park/refuse/resume tests
  #   run on the same host. The child runner loads the real kit itself.
  #
  # - `stats-plan.test.ts` checks the explicit `viewer last import` label and cycles through
  #   Overview, Models and Machines while Plan mode remains enabled; the Machines view retains
  #   viewer-import and local-scan evidence across terminal resizes.
  # - `memory-deferred-kit.test.ts` loads real npm memory/context-engine factories with session-kit:
  #   memory write/read and system-message refresh coexist with hidden monitor registration,
  #   session-lifetime search promotion and successful controlled monitor execution. qmd is a
  #   failing fixture shim; no network is allowed. The D `test_extension_coverage.py` canaries
  #   separately prove installed registry/commands, memory persistence/path rejection, workflow
  #   list/missing-run behavior, a clean refused-loopback raw web fetch error and computer-use's
  #   installed-but-not-loaded headless exclusion. No version pins are copied into scenarios.
  #   The shared third-party loader
  #   resets pi-memory's own path/snapshot/qmd caches before a new fixture: Bun caches npm modules
  #   across test files, so import-time state must not retain a deleted prior private home.
  #
  # The unit gates must not read the machine: the first CI run found three `tests/integration/tests` that only
  # passed on the owner's laptop (`pi` on `PATH`, the chezmoi source tree). They are gone or isolated.
  #
  # Verification engines: Vitest stays the owned TypeScript runner, with Node primary (the shipped
  # runtime) and Bun the standalone target. Full Vitest runs on both engines for
  # `subscription-router`, `preset`, `resource-sampler`, `todo`, `plan-mode`, `dev-tools`, `subagents` and
  # `tests/inprocess`.
  # `test:bun` launches `bun --bun vitest run` through `scripts/run-vitest.ts` in a disposable
  # spawn-time home (the keys come from `isolatedHomeEnv` in `tests/lib/src/isolated-home.ts`, which nested runners such as
  # session-kit's worker-death test reuse as `@nredd/pi-test-lib/isolated-home`); `make check-ts` and the native `owned` cells' TypeScript shards run it.
  # The launcher also sets `JITI_FS_CACHE=false`, and pins `CARGO_HOME`/`RUSTUP_HOME` to the account's
  # (`toolchainHomeEnv`, explicit values win): rustup's proxies otherwise look under the disposable home,
  # so dev-tools' real cargo suite silently skipped on Bun on the hosted runners. The `test:bun` script that starts with native
  # `bun test` (session-kit) sets it for that half through an inline
  # prefix, not the launcher, as do the direct `vitest` scripts. Each
  # invocation prints engine/OS/package duration and exit status and appends it to the CI step summary.
  # The launcher's `bun` engine also appends the Bun signal's Istanbul coverage arguments.
  # The shared guard checks `os.homedir() === HOME` at setup, before each test and after each test,
  # failing with the offending file and an instruction to inject home directories. These are
  # boundary checks, not interception of transient mutations between boundaries.
  #
  # Phase 2 #171 resolves the todo/subagents guard deferral from
  # [spec PR #170](https://github.com/nredd/pi-harness/pull/170), tracking
  # [#160](https://github.com/nredd/pi-harness/issues/160). Both Vitest configs now install the
  # shared guard and fixtures inject their homes instead of mutating `HOME`. Todo runs its full
  # 390-test suite on Bun. Since [#320](https://github.com/nredd/pi-harness/issues/320) subagents runs its full suite on Bun too;
  # session-kit keeps its native subset, see [#320](https://github.com/nredd/pi-harness/issues/320).
  # Both full Node suites are guarded.
  # No guard-related skip list or informational-only guard is used.
  # Python stays on pytest/uv/ruff/ty; dotfiles stays on dependency-free `node --test` as the
  # bootstrap exception. Istanbul consolidation is phase 3, not part of this producer change.
  #
  # The session-kit `/mon` mapping test injects a deadline-truncated sampler snapshot instead of assuming
  # that a bounded host scan always includes the test process. Real-sampler cancellation tests continue to
  # exercise the published sampler; the host-dependent polling smoke is not in the coverage-gated suite.
  #
  # The dev-tools real-host `resource_snapshot` smoke requires process metadata and includes the producer's
  # unavailable reason in its failure, including child discovery after recovery is exhausted. Diagnostics retain
  # all scan coverage, durations, terminal reason and the child's exit/signal status. Separate controls exercise
  # registry sampler `0.2.1` through the tool schema with an injected names-only Linux enumeration failure and a
  # genuinely exhausted scan budget. Live-child helper-seam controls force healthy/lost/healthy/lost scans and
  # a final real deadline after an earlier loss, without weakening healthy-host assertions or the four-scan bound.
  # The injected Linux path on macOS is not a native Linux run.
  #
  # `resource_snapshot` also resamples, at most twice more, when either scan of the window reports
  # `process-collection-unavailable` (#557), sliding the window to the latest pair of scans. Failures that
  # outlast the two resamples still report the producer's reason (or leave a lost baseline's entries `warming`). Both source consumers now pin published sampler `0.2.1`, whose names-only `/proc` enumeration removes
  # newer incident's final unavailable collection is established, not its underlying syscall failure.
  #
  # Hosted Ubuntu tmux steps (#655): `Install tmux (Linux)` (both sites) skips apt when the runner image already has `tmux`. Otherwise it runs with `timeout-minutes: 5` and `-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120`, so a stalled mirror or held dpkg lock fails that step fast instead of burning the 30 minute job budget (runs `42756722827` and `42763778363` were cancelled inside apt). Not a flake to rerun: a step that hits the 5 minute bound is a real failure to investigate. `Install reviewer read dependencies` installs prebuilt `ripgrep` and `fd-find` release binaries with `taiki-e/install-action` on both Ubuntu and macOS, so an apt mirror outage (2026-11-11: every Linux owned shard timed out in apt) cannot block the Linux matrix.

  owned-shards-ubuntu:
    if: ${{ fromJSON(needs.classify.outputs.plan || '{}')['owned (ubuntu-24.04)'].run }}
    name: &owned-shard-name owned shard (${{ matrix.os }}, ${{ matrix.shard }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.plan)['owned (ubuntu-24.04)'].shards }}
    runs-on: &owned-shard-runner ${{ matrix.runner }}
    defaults: &owned-shard-defaults
      run:
        shell: bash -e {0}
    timeout-minutes: &owned-shard-timeout 30
    steps: &owned-shard-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        id: tools
        with:
          owned: 'true'
      # Real reviewer reads need system binaries, not Pi's live latest-release download fallback.
      # Prebuilt release binaries from GitHub on both OSes: an Ubuntu apt mirror outage must not
      # block the Linux matrix. fd-find 10.4.2+ ships binstall metadata matching its release assets;
      # fail rather than compile from source.
      - name: Install reviewer read dependencies
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        env:
          BINSTALL_DISABLE_STRATEGIES: compile
        with:
          tool: ripgrep@14.1.1,fd-find@10.5.0
      - name: Verify reviewer read dependencies
        run: |
          rg --version
          if command -v fd >/dev/null; then fd --version; else fdfind --version; fi
      - name: Initialize the core fork at its Gitlink
        run: git submodule update --init forks/pi
      # `check-integration` drives the live-session drivers against a stub pi in panes on private tmux servers. Same
      # install as the `stack` job; only Linux and macOS shards list that gate.
      - name: Install tmux (Linux)
        if: runner.os == 'Linux' && contains(matrix.gates, 'check-integration')
        timeout-minutes: 5
        run: |
          # The runner image usually ships tmux; skip apt entirely then (#655).
          command -v tmux >/dev/null && exit 0
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120 install --yes tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS' && contains(matrix.gates, 'check-integration')
        run: command -v tmux >/dev/null || brew install tmux
      # Verifies the root core overrides before `npm ci`; the read-only token is for `gh attestation verify`.
      - name: Install
        id: install
        env:
          GH_TOKEN: ${{ github.token }}
        run: make install-owned
      # computer-use's Linux helper checks (cargo tests, packed-source build, diagnostics) run inside its `check-ts` on
      # Ubuntu and print NOT RUN on macOS. ARM64 is compile-only (`cargo check`, no linker): never a runtime claim.
      - name: Add the aarch64 Linux compile target
        if: matrix.guest == 'linux' && contains(matrix.workspaces, 'packages/computer-use')
        run: |
          rustup target add aarch64-unknown-linux-gnu
          echo "PI_CU_LINUX_ARM64_CHECK=1" >>"$GITHUB_ENV"
      # One step per gate the shard lists, so a failing gate never hides another gate's evidence. `check-ts` runs
      # only the shard's workspaces, each package's own `npm run check` in npm workspace order.
      - name: Owned gate check-ts (biome, tsc, Vitest on Node and Bun, computer-use checks)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(matrix.gates, 'check-ts') }}
        env:
          # computer-use's `check` also diffs its tree against the pinned upstream commit (#720). Linux only: one
          # shallow fetch, and the check compares source trees, so one OS is enough.
          PI_CU_UPSTREAM_SYNC: ${{ matrix.os == 'ubuntu-24.04' && '1' || '' }}
        run: make check-ts WORKSPACES="${{ matrix.workspaces }}"
      - name: Install pinned native Ubuntu coverage tools
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-24.04' && contains(matrix.workspaces, 'packages/computer-use') }}
        timeout-minutes: 8
        env:
          CARGO_BUILD_JOBS: '2'
          RUSTUP_TOOLCHAIN: '1.97.1'
        run: |
          mkdir -p packages/computer-use/coverage/native-linux
          {
            time rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
            time cargo +1.97.1 install cargo-llvm-cov --version 0.9.1 --locked --root "$RUNNER_TEMP/cu-cov-tools"
            rustup run 1.97.1 rustc --version --verbose
          } 2>&1 | tee packages/computer-use/coverage/native-linux/setup.log
          dirname "$(rustup which --toolchain 1.97.1 cargo)" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cu-cov-tools/bin" >> "$GITHUB_PATH"
      - name: Collect native Ubuntu Rust coverage (headless, report-only)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-24.04' && contains(matrix.workspaces, 'packages/computer-use') }}
        timeout-minutes: 8
        env:
          CARGO_BUILD_JOBS: '2'
          RUSTUP_TOOLCHAIN: '1.97.1'
        run: npm run coverage:rust --workspace @nredd/pi-computer-use -- --crate linux --output coverage/native-linux
      - name: Owned gate check-scripts (ruff, ty, pytest scripts, import audit)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(matrix.gates, 'check-scripts') }}
        run: make check-scripts
      - name: Owned gate check-integration (ruff, ty, pytest integration units, probes, providers)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(matrix.gates, 'check-integration') }}
        run: make check-integration
      # `macos-native-pure` compiles real shipped Swift sources once during the package gate.
      # Retain raw region/profile evidence separately; fan-in still consumes its validated LCOV.
      - name: Preserve real-source Swift coverage
        if: always() && matrix.guest == 'macos' && contains(matrix.workspaces, 'packages/computer-use')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: computer-use-swift-${{ matrix.os }}
          path: packages/computer-use/coverage/swift/
          if-no-files-found: error
      # The macOS scripts shard owns scripts/python + import-audit reports; python owns release/harness,
      # probes/providers. Dynamic artifact names and downloads include both without a second list.
      # Bind the receipt to the shard checkout, not the PR head or the artifact upload time.
      - name: Record shard coverage provenance
        if: always() && steps.tools.outcome == 'success'
        continue-on-error: true
        env:
          COVERAGE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COVERAGE_CELL: coverage-${{ matrix.os }}-${{ matrix.shard }}
          COVERAGE_SHARD: ${{ matrix.shard }}
        run: |
          python3 scripts/coverage_provenance.py --cell "$COVERAGE_CELL" \
            --output "coverage/provenance-$COVERAGE_SHARD.json"
      # A shard can retain its receipt without measurements. The fan-in still fails if a report
      # expected by policy is missing.
      - name: Preserve this shard's coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            coverage/provenance-${{ matrix.shard }}.json
            packages/*/coverage/**/lcov.info
            packages/computer-use/coverage/native-linux/coverage.json
            packages/computer-use/coverage/native-linux/setup.log
            packages/computer-use/coverage/native-linux/*/coverage.json
            packages/computer-use/coverage/native-linux/*/metadata.json
            packages/computer-use/coverage/native-linux/*/summary.txt
            packages/computer-use/coverage/native-linux/*/*.log
            packages/*/coverage/**/coverage-summary.json
            tests/inprocess/coverage/**/lcov.info
            tests/inprocess/coverage/**/coverage-summary.json
            tests/lib/coverage/**/lcov.info
            tests/lib/coverage/**/coverage-summary.json
            tests/integration/probes/coverage/**/lcov.info
            tests/integration/probes/coverage/**/coverage-summary.json
            tests/integration/providers/coverage/**/lcov.info
            tests/integration/providers/coverage/**/coverage-summary.json
            tests/integration/coverage/**/lcov.info
            release/coverage/**/lcov.info
            scripts/coverage/**/lcov.info
            scripts/coverage/**/coverage-summary.json
          if-no-files-found: ignore

  owned-shards-macos:
    if: ${{ github.event_name != 'pull_request' && needs.classify.result == 'success' && fromJSON(needs.classify.outputs.plan || '{}')['owned (macos-14)'].run }}
    name: *owned-shard-name
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.plan)['owned (macos-14)'].shards }}
    concurrency:
      group: ${{ github.workflow }}-owned-shards-macos-${{ matrix.os }}-${{ matrix.shard }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.result == 'success' && fromJSON(needs.classify.outputs.plan || '{}')['owned (macos-14)'].run && 'push' || format('{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.result == 'success' && fromJSON(needs.classify.outputs.plan || '{}')['owned (macos-14)'].run || false }}
    runs-on: *owned-shard-runner
    defaults: *owned-shard-defaults
    timeout-minutes: *owned-shard-timeout
    steps: *owned-shard-steps

  # Policy: Native Windows Rust evidence
  # `computer-use Rust (windows-x64)` separately uses hosted `windows-2025`, pinned Rust/LLVM and
  # cargo-llvm-cov versions above, and two build jobs. It checks a native x64 MSVC compiler, formatting,
  # all-target compilation, Clippy, docs, real crate tests and raw LLVM JSON/LCOV, then runs the opt-in
  # Windows build/install routing tests with disposable destinations. Before npm installation it verifies
  # core overrides with the pinned Python and a temporary PEM exported from pinned Node's built-in
  # public Mozilla roots via the verifier's supported `SSL_CERT_FILE` input (Windows Python has no
  # compiled-in OpenSSL CA path). It does not depend on Git's installation layout or copy private
  # machine roots. Root export errors fail closed; system trust is not modified and TLS checks stay enabled.
  # The shared child-process boundary also preserves `SYSTEMROOT`, required by native Windows DNS:
  # an isolated real-verifier comparison failed without it and verified the original signer/ref policy
  # with only that OS-runtime key restored ([receipt](https://github.com/nredd/pi-harness/actions/runs/43362875064)).
  # No token, profile/cache state or tool-injection variables are admitted by that correction.
  # It uploads source-bound metadata
  # and raw reports as `computer-use-rust-windows-x64`. The Ubuntu fan-in additionally depends on this
  # job and refuses any non-success outcome when computer-use is selected.
  # Windows native coverage is report-only, not a borrowed Ubuntu accounting signal or a claim of
  # live desktop behavior; absent branches/statements stay unmeasured.

  computer-use-windows:
    name: computer-use Rust (windows-x64)
    needs: classify
    if: ${{ fromJSON(needs.classify.outputs.plan || '{}')['owned (ubuntu-24.04)'].run && contains(toJSON(fromJSON(needs.classify.outputs.plan)['owned (ubuntu-24.04)'].shards), 'packages/computer-use') }}
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.97.1'
      PI_CU_WINDOWS_SCRIPTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - name: Verify root core overrides before installing dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:PYTHONPATH = 'release'
          # The verifier intentionally uses only explicit OpenSSL CA defaults. Windows Python has none.
          # Export pinned Node's built-in public Mozilla roots, not private machine roots or a guessed Git layout.
          # This is a temporary CA input, not a system trust-store change or TLS bypass.
          $env:SSL_CERT_FILE = Join-Path $env:RUNNER_TEMP 'cu-public-node-ca.pem'
          node -e 'require("node:fs").writeFileSync(process.argv[1], require("node:tls").rootCertificates.join("\n") + "\n")' "$env:SSL_CERT_FILE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-project --python (Get-Content .python-version) python -m pi_release.release --verify-root-overrides --root .
      - name: Install pinned native compiler and LLVM tools
        run: |
          New-Item -ItemType Directory -Force packages/computer-use/coverage/native-windows | Out-Null
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview,rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97.1 install cargo-llvm-cov --version 0.9.1 --locked --root "$env:RUNNER_TEMP/cu-cov-tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/cu-cov-tools/bin" >> $env:GITHUB_PATH
          rustup run 1.97.1 rustc --version --verbose | Tee-Object packages/computer-use/coverage/native-windows/compiler.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Select-String -Quiet 'host: x86_64-pc-windows-msvc' packages/computer-use/coverage/native-windows/compiler.log)) { throw 'Native Windows x64 compiler required' }
      - name: Format, compile, lint and document the Windows crate
        run: |
          $manifest = 'packages/computer-use/native/windows/bridge-rs/Cargo.toml'
          cargo fmt --manifest-path $manifest -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --all-targets --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets --manifest-path $manifest -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RUSTDOCFLAGS = '-D warnings'
          cargo doc --locked --no-deps --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --doc --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows tests and LLVM reports (no desktop interaction)
        run: node packages/computer-use/scripts/rust-coverage.mjs --crate windows --output packages/computer-use/coverage/native-windows
      - name: Install isolated script-test dependencies
        run: npm ci --ignore-scripts
      - name: Windows build and install routing into disposable paths
        working-directory: packages/computer-use
        run: node ../../scripts/run-vitest.ts node test/windows-build-scripts.test.mjs test/rust-coverage.test.mjs --coverage.enabled=false
      - name: Preserve Windows source-bound native reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: computer-use-rust-windows-x64
          path: |
            packages/computer-use/coverage/native-windows/compiler.log
            packages/computer-use/coverage/native-windows/coverage.json
            packages/computer-use/coverage/native-windows/*/lcov.info
            packages/computer-use/coverage/native-windows/*/coverage.json
            packages/computer-use/coverage/native-windows/*/summary.txt
            packages/computer-use/coverage/native-windows/*/metadata.json
            packages/computer-use/coverage/native-windows/*/*.log
          if-no-files-found: error

  # Policy: Fan-in and independent coverage accounting
  # Both fan-ins require the active shard matrix to succeed. Artifacts stay partitioned by OS;
  # each fan-in downloads and accounts only its own reports. PRs have only the Ubuntu fan-in.
  #
  # Phase 0 coverage runs inside the existing primary and declared Bun test invocations, never a
  # second CI test pass. Each Vitest config reads its owned source from `coverage/policy.json`, uses text + LCOV and
  # `reportOnFailure`; `subagents` retains Istanbul because V8 reload merging is incorrect. The
  # `check-probes` and `check-import-audit` helper gates run Vitest with V8 coverage too, since #347
  # (c8 + `node --test` before), and `check-providers` since #378 (native cells run it inside `check-integration`). Each `owned` fan-in's `always()` step consumes its shards' independent
  # reports with `scripts/coverage_accounting.py`, selects `darwin` / `linux` integer uncovered-line/function
  # floors with `COVERAGE_OS` (`--os`, the plan's `coverage_os`; the default is `sys.platform`), compares **every OS's enforced floors** with the PR base's `coverage/policy.json`,
  # and fails closed on missing/invalid input or a missing OS floor. Hosted artifacts, not a local Mac,
  # establish per-runner floors.
  # No counters are combined across runners. Native Windows has its separate raw LLVM producer;
  # scenarios remain separate acceptance evidence, not owned-source coverage. To regenerate a review-only policy diff from an
  # artifact, run `uv run --locked --project tests/integration python scripts/coverage_accounting.py --measure
  # --os linux --reports-root /tmp/cov-linux --summary /tmp/measured-linux.json` (use `darwin` and its
  # artifact for macOS). The full download/replay and independent-two-run comparison procedure is
  # [here](../../docs/coverage.md#refresh-floors-from-hosted-artifacts); this command never edits or commits policy. Uncovered
  # branches are capped per signal like lines/functions ([here](../../docs/coverage.md#branch-caps)). Final hosted run
  # `40857829296` established zero primary misses for all eight packages on macOS and all except
  # resource-sampler on Linux, whose 47 lines / 8 functions in native `darwin.ts` paths went to 0/0
  # with #375's fake-host FFI tests; no package has a per-OS allowance. Session-kit now has zero primary misses on both
  # OSes after the deterministic formatter test removes the incidental comparator hit (#163).
  # The earlier 110/32 transitional floor is historical only. Another `always()` step retains LCOV and the per-package/per-file JSON summary
  # on either outcome. Bun signals for `dev-tools`, `plan-mode`, `preset`, `subscription-router` and
  # `todo` are enforced at 0/0 on both OSes (#320), `resource-sampler` since #375 and `inprocess` since #376, and `subagents` at 0/0/0 since #320 (measured on darwin; linux awaits hosted CI, see [here](../../docs/coverage.md)). The rest (session-kit) explicitly uses `enforcement: "report-only"` with
  # mandatory reasons linked to #160. Report-only signals retain fail-closed LCOV parsing, expected-file checks,
  # per-OS references, inventory ratcheting, and text+LCOV reporter checks. Counts and signed deltas
  # from references are logged and included under JSON `signals`; budget excess alone cannot fail
  # these advisory signals. Primary budgets stay enforced and define the 100% goal. Never merge
  # Bun counters into primary coverage.
  #
  # The owner's roughly 1-7% small-subset description is not a measured source-coverage percentage:
  # historical hosted run `40455349710` had plan-mode 8/539 Bun/primary tests (1.5%), subagents 22/3078
  # (0.7%) and todo 2/387 (0.5%); preset and in-process ran their full test sets. plan-mode and todo
  # now run their full suites under Bun too (#320). The precise limitation is
  # incomplete verified source scope. A strict Bun budget blocked main #153's primary-tested additions
  # (subagents Bun 7728/512 -> 7763/515, primary unchanged at 500/68 on both OSes).
  #
  # A package flips to `enforced` only after its full suite runs under Bun on both OSes AND Bun's
  # inventory covers every owned executable source file, including never-imported files, as specified
  # by #160. Accounting rejects enforced partial Bun inventories. Any later enforced-to-report-only
  # flip requires a new reasoned `enforcement_changes` entry relative to base; standing reasons or
  # historical approvals cannot silently waive enforcement. Initial policy introduction is allowed.
  # Enforced-to-enforced floors ratchet per OS; advisory references do not become hidden budgets.
  # `computer-use` stays not measured, tracked for its native Swift/Rust and documentation site. Its 35 JS/TS runtime modules are measured by the enforced `computer-use-vitest` ratchet (#347, #645): per-OS uncovered lines, functions and branches may not grow. `dev-tools` uses #195's primary Istanbul decision with
  # all 23 executable modules and zero uncovered lines/functions on both hosted OSes after #155.
  # Its Bun signal runs the same full Vitest suite on Bun and is enforced at 0/0 since #320. Python `scripts/` and `tests/integration/harness/` are measured by `PY_GATE`. The Vitest
  # producer configurations are measured by `import-audit` (#380, see `docs/coverage.md`).
  # The repository-wide TS/Python/JavaScript audit and the base-tree/current-tree inventory ratchet
  # prevent silent source omission; reasoned reclassifications are required for membership losses.
  # Verification-only scripts have exact per-file `verification_helpers` reasons; shipped runtime
  # scripts remain owned production source, never blanket helper exclusions. The policy's eventual
  # global-zero flip refuses pending packages.
  # No job or required-check name changes. Definition, exclusions, receipts and ratcheting:
  # [here](../../docs/coverage.md).

  owned-ubuntu:
    if: ${{ !cancelled() }}
    name: &owned-name owned (${{ matrix.os }})
    needs: [classify, owned-shards-ubuntu, computer-use-windows]
    strategy:
      matrix:
        os: [ubuntu-24.04]
    env:
      SHARDS_RESULT: ${{ needs.owned-shards-ubuntu.result }}
      WINDOWS_REQUIRED: ${{ contains(toJSON(fromJSON(needs.classify.outputs.plan || '{}')['owned (ubuntu-24.04)'].shards), 'packages/computer-use') }}
      WINDOWS_RESULT: ${{ needs.computer-use-windows.result }}
    runs-on: ubuntu-24.04
    timeout-minutes: &owned-timeout 15
    steps: &owned-steps
      # The plan step lives in a local action, so a sparse checkout of `.github/actions` comes first. The full
      # checkout below runs only when the plan says the cell runs.
      - name: Check out the local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - id: plan
        name: Report execution plan
        uses: ./.github/actions/report-plan
        with:
          cell: ${{ format('owned ({0})', matrix.os) }}
          plan: ${{ needs.classify.outputs.plan }}
          classify_result: ${{ needs.classify.result }}
          changed_files: ${{ needs.classify.outputs.changed_files }}
      # `needs.<job>.result` folds every shard of the matrix into one value, and is `skipped` when the shard job
      # never ran. A running cell needs `success`: a failed, cancelled or skipped shard fails the required check.
      - name: Require every planned shard to succeed
        if: steps.plan.outputs.run == 'true'
        env:
          CELL: ${{ format('owned ({0})', matrix.os) }}
        run: python3 scripts/ci_require_shards.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' }}
        with:
          # No `npm ci` here, so it must not save an empty npm cache.
          npm-cache: 'false'
      - name: Download the shards' coverage reports
        id: download-coverage
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-${{ matrix.os }}-*
          path: ${{ runner.temp }}/shard-coverage
      # Each artifact lands in its own directory; a report path two shards both produced would let one copy
      # silently replace the other, so that fails instead.
      - name: Merge the shards' coverage reports
        id: merge-coverage
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' }}
        run: |
          cd "$RUNNER_TEMP/shard-coverage"
          duplicates=$(find . -mindepth 2 -type f | cut -d/ -f3- | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error title=duplicate shard coverage::More than one shard produced: ${duplicates//$'\n'/ }"
            exit 1
          fi
          for shard in */; do
            echo "Merging ${shard%/}"
            cp -R "$shard." "$GITHUB_WORKSPACE/"
          done
      # The accounting reads reports, the policy and Git, and runs no test, so the macOS cell's reports are
      # accounted here with `--os darwin` (the `--reports-root` replay docs/coverage.md describes).
      - name: Coverage accounting (existing reports, including test failures)
        if: always() && steps.plan.outputs.run == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          # The plan selects the coverage platform, host class and skipped gates.
          COVERAGE_OS: ${{ fromJSON(needs.classify.outputs.plan)[format('owned ({0})', matrix.os)].coverage_os }}
          COVERAGE_HOST: ${{ fromJSON(needs.classify.outputs.plan)[format('owned ({0})', matrix.os)].guest }}
          COVERAGE_SKIPPED_GATES: ${{ fromJSON(needs.classify.outputs.plan)[format('owned ({0})', matrix.os)].skipped_gates }}
        run: make check-coverage BASE="$BASE" COVERAGE_OS="$COVERAGE_OS" COVERAGE_HOST="$COVERAGE_HOST" COVERAGE_SKIPPED_GATES="$COVERAGE_SKIPPED_GATES"
      # Keep accounting and artifact retention independent from presentation provenance. An older or
      # partial rerun's shard can still be retained for diagnosis, but may not be presented as current.
      - name: Record fan-in coverage provenance
        if: always() && steps.plan.outputs.run == 'true'
        continue-on-error: true
        env:
          COVERAGE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COVERAGE_CELL: coverage-${{ matrix.os }}
          DOWNLOAD_OUTCOME: ${{ steps.download-coverage.outcome }}
          MERGE_OUTCOME: ${{ steps.merge-coverage.outcome }}
        run: |
          rm -f coverage/provenance.json
          if [ "$DOWNLOAD_OUTCOME" = success ] && [ "$MERGE_OUTCOME" = success ] && [ -f coverage/summary.json ]; then
            python3 scripts/coverage_provenance.py --cell "$COVERAGE_CELL" \
              --shards "$RUNNER_TEMP/shard-coverage" --output coverage/provenance.json
          fi
      - name: Preserve independent coverage reports and summary
        if: always() && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: |
            packages/*/coverage/**/lcov.info
            packages/computer-use/coverage/native-linux/coverage.json
            packages/computer-use/coverage/native-linux/setup.log
            packages/computer-use/coverage/native-linux/*/coverage.json
            packages/computer-use/coverage/native-linux/*/metadata.json
            packages/computer-use/coverage/native-linux/*/summary.txt
            packages/computer-use/coverage/native-linux/*/*.log
            packages/*/coverage/**/coverage-summary.json
            tests/inprocess/coverage/**/lcov.info
            tests/inprocess/coverage/**/coverage-summary.json
            tests/lib/coverage/**/lcov.info
            tests/lib/coverage/**/coverage-summary.json
            tests/integration/probes/coverage/**/lcov.info
            tests/integration/probes/coverage/**/coverage-summary.json
            tests/integration/providers/coverage/**/lcov.info
            tests/integration/providers/coverage/**/coverage-summary.json
            tests/integration/coverage/**/lcov.info
            release/coverage/**/lcov.info
            scripts/coverage/**/lcov.info
            scripts/coverage/**/coverage-summary.json
            coverage/summary.json
            coverage/provenance.json
          if-no-files-found: error
      - name: Packages without a Bun run (not run)
        if: steps.plan.outputs.run == 'true'
        run: |
          # shellcheck disable=SC2016 # the single-quoted program is JavaScript, its ${} is a JS template
          for manifest in packages/*/package.json; do
            node -e 'const m = require(process.argv[1]); if (!m.scripts["test:bun"]) console.log(`::notice title=bun test not run::${m.name} has no declared Bun suite yet`)' "./$manifest"
          done

  owned-macos:
    # Report neither a failure nor NOT RUN for cancelled push shards. A failed plan or dispatch
    # still goes through the shared fail-closed reporter.
    if: >-
      ${{ github.event_name != 'pull_request' && !cancelled()
      && !(github.event_name == 'push' && needs.classify.result == 'success' && needs.owned-shards-macos.result == 'cancelled') }}
    name: *owned-name
    needs: [classify, owned-shards-macos]
    strategy:
      matrix:
        os: [macos-14]
    env:
      SHARDS_RESULT: ${{ needs.owned-shards-macos.result }}
      WINDOWS_REQUIRED: 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: *owned-timeout
    steps: *owned-steps

  # Policy: Packed contracts and independent sampler evidence
  # `scripts/package_contracts.py` owns packed-file validation, including the `--packed-files-only`
  # and `--package <workspace-directory>` paths. Package gates use this same checker, not separate
  # package-specific asset or manifest checks; the full contract gate also installs and exercises tarballs.
  # The resource sampler's package gate runs real host sampling and bounded helper cleanup in each
  # `owned` OS cell. `check-package-contracts` also builds/audits/installs its exact ESM tarball and
  # runs an isolated Node consumer in each `contracts` OS cell. This library has no Pi entrypoint;
  # Darwin process CPU is native interval CPU on Node >=26.1 and Bun, authenticated with libproc
  # start identity rather than `ps` whole-second precision. Older Node remains explicitly unavailable.
  # No consumer migration, publication, extra CI job or runner is added.

  contracts:
    if: ${{ !cancelled() }}
    name: &contracts-name contracts (${{ matrix.os }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    # A cell the plan does not run (NOT RUN, or blocked, or no plan at all) reports from a cheap Ubuntu job and holds
    # no macOS or Windows slot.
    # A running cell the plan hands to a self-hosted pool carries its `runner`; otherwise the matrix's hosted one.
    runs-on: &contracts-runner ${{ !fromJSON(needs.classify.outputs.plan || '{}')[format('contracts ({0})', matrix.os)].run && 'ubuntu-24.04' || fromJSON(needs.classify.outputs.plan || '{}')[format('contracts ({0})', matrix.os)].runner || (matrix.os == 'macos-14' && 'xcode-27' || 'ubuntu-24.04') }}
    defaults: &contracts-defaults
      run:
        shell: bash -e {0}
    timeout-minutes: &contracts-timeout 30
    steps: &contracts-steps
      # The plan step lives in a local action, so a sparse checkout of `.github/actions` comes first. The full
      # checkout below runs only when the plan says the cell runs.
      - name: Check out the local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - id: plan
        name: Report execution plan
        uses: ./.github/actions/report-plan
        with:
          cell: ${{ format('contracts ({0})', matrix.os) }}
          plan: ${{ needs.classify.outputs.plan }}
          classify_result: ${{ needs.classify.result }}
          changed_files: ${{ needs.classify.outputs.changed_files }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.plan.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        id: tools
        if: steps.plan.outputs.run == 'true'
      # Verifies the root core overrides before `npm ci`; the read-only token is for `gh attestation verify`.
      - name: Install
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make install-owned
      - name: Packed plugins alone on exact stock Pi, plus packed preset audit
        if: steps.plan.outputs.run == 'true'
        run: make check-package-contracts REPORT="$RUNNER_TEMP/package-contracts.json"
      - name: Packed pi-plan-mode with its registry dependency on exact stock Pi
        if: steps.plan.outputs.run == 'true'
        run: make check-plan-mode-package-contract REPORT="$RUNNER_TEMP/plan-mode-package-contracts.json"
      - name: Packed pi-computer-use on exact stock Pi (native desktop not run)
        if: steps.plan.outputs.run == 'true'
        run: make check-computer-use-package-contract REPORT="$RUNNER_TEMP/computer-use-package-contracts.json"
      - name: Packed pi-subagents with its registry dependencies on exact stock Pi
        if: steps.plan.outputs.run == 'true'
        run: make check-subagents-package-contract REPORT="$RUNNER_TEMP/subagents-package-contracts.json"
      - name: Packed pi-todo with its registry dependencies on exact stock Pi
        if: steps.plan.outputs.run == 'true'
        run: make check-todo-package-contract REPORT="$RUNNER_TEMP/todo-package-contracts.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.plan.outputs.run == 'true'
        with:
          name: contract-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/*contracts*.json
          if-no-files-found: ignore

  contracts-macos:
    if: ${{ github.event_name != 'pull_request' && !cancelled() }}
    name: *contracts-name
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    concurrency:
      group: ${{ github.workflow }}-contracts-macos-${{ matrix.os }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.result == 'success' && fromJSON(needs.classify.outputs.plan || '{}')[format('contracts ({0})', matrix.os)].run && 'push' || format('{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.result == 'success' && fromJSON(needs.classify.outputs.plan || '{}')[format('contracts ({0})', matrix.os)].run || false }}
    runs-on: *contracts-runner
    defaults: *contracts-defaults
    timeout-minutes: *contracts-timeout
    steps: *contracts-steps

  release-core:
    if: github.event_name == 'workflow_dispatch'
    needs: classify
    uses: ./.github/workflows/forks.yml

  # Policy: Stack acceptance, diagnostics and Bun boundaries
  # The `stack` job's `Report coverage exclusions` summary writes only `GITHUB_STEP_SUMMARY` text.
  # The workflow contract executes that step's actual body with the test runner's `/bin/bash` in
  # an isolated directory, checks production output-failure propagation, and checks scoped exclusions
  # separately from shell selection.
  # Standalone D/E skips no auth case (#14); the step outcome and JUnit, not the summary notice, are
  # the evidence. Friendly-prose changes must preserve those disclosures and the remaining explicit
  # `NOT RUN` scopes.
  #
  # ## Standalone startup failure evidence
  #
  # The Linux personal cell runs one extra **strict** text startup before D/E: the same explicit
  # personal stack, faux provider, `STACK-OK` output, zero exit and empty stderr as
  # `test_extensions_load_without_warnings[text]`. No retry can turn a failure green. On failure only,
  # `standalone-startup-linux-x64` retains the exact executable and `SHA256SUMS` for seven days.
  # The normal standalone suites still run and retain their original assertions.
  #
  # Each cell builds the standalone twice through the same `build_standalone` shell function, so the Bun
  # wrapper records the same argv (`cmp` of both `compile-command.json` files). Evidence at the root of the
  # build-evidence directory describes the second build, the one exported as `PI_BIN`; the first build's
  # evidence and executable are moved to `first/`, also when the first build itself fails.
  #
  # If the build step fails (including a digest mismatch), `collect-build-failure` scans both executables,
  # logs and module graphs through the same `require_safe_diagnostic` policy, and
  # `standalone-build-failure-<platform>-<stack>` retains them for seven days, only when the scan published
  # (`artifact_ready=true`). `build-binaries.sh` clears its output directory, so a failed second build leaves
  # no stale `second/pi`.
  #
  # `harness.standalone_diagnostics` stages an explicit allowlist and scans *every input*, binary
  # included, through the shared `pi_release.credentials.require_safe_diagnostic` policy before atomically
  # publishing the upload directory. This preserves #178's npm (at least 36 alphanumerics), short GitHub,
  # sk/pk, Slack and general private-key signatures alongside main's nonempty JSON/Bearer and release
  # URL/proxy policy. There is one shared scanner, not a collector-local duplicate. Signatures are
  # conservative heuristics, not a guarantee against every secret format. A scan or capture failure
  # leaves no partial upload and cannot mask the original failing exit status.
  # The upload also requires the probe's `artifact_ready=true` output, emitted only after a new
  # scanned publication; stale directories and early failures cannot authorize an upload.
  # It never copies installed homes, `auth.json`, `.storage`, sessions, environment dumps or token stores.
  # All subprocesses use a new harness fixture HOME, empty synthetic auth and the existing command shims.
  # This is diagnostic hygiene, not isolation from malicious same-UID package code.
  #
  # Artifact files:
  #
  # - `pi`, `SHA256SUMS`, `build.json`: exact executable, per-file SHA-256, schema-validated
  #   Gitlink/harness SHAs, tool versions, build/startup commands and separate primary/replay verdicts.
  # - `compile-command.json`, `module-graph.json`, `build.log`: the actual compile argv, Bun's
  #   module graph and the frozen-data build log. A transparent build-only Bun wrapper adds
  #   `--metafile`; it changes neither core sources nor production pins. Missing optional metadata
  #   is explicit; a graph cannot establish the undefined symbol's cause by itself.
  # - `packages/pi-memory/{index.ts,package.json,npm-lock.json}` (the lock's memory entry only),
  #   `core/*.js`, `core/*-package.json`,
  #   `core/package-lock.json`, `harness-package-lock.json`, `stack.json`: named public package/build
  #   inputs only, with original bytes. No recursive package or home upload.
  # - `startup.{stdout,stderr}` and `jiti/primary/*`: byte-exact original failed startup streams (including
  #   CRLF and invalid UTF-8) and *only*
  #   Jiti 2.7 transform filenames keyed to this fixture's exact `pi-memory/index.ts` path (MD5 and
  #   FIPS SHA-256 naming variants). Cache absence is recorded, not replaced with another run's code.
  # - `replay.{stdout,stderr}`, `replay-wrapper.ts`, `jiti/replay/*`: supplemental failure-only replay.
  #   In the disposable fixture, memory's resource declaration/filter selects a wrapper at the same
  #   package-order slot. It imports the untouched original entry, prints `error.stack` before Pi
  #   reduces it to a message, then **rethrows**. Original package manifest/source/cache bytes are
  #   captured *before* this instrumentation; the executable is never rebuilt or patched. A replay
  #   passing or failing differently does not replace the primary failure or prove a root cause.
  #   Replay streams are also raw bytes. Primary-stream decoding is separate, only for strict startup matching,
  #   never for artifact contents. Timeouts retain untouched partial streams (absent data becomes empty
  #   bytes), use synthetic exit status 124 and record `startup_timed_out`/`replay_timed_out` in `build.json`;
  #   no annotation is appended to stderr. A normal child exit 124 remains distinguishable from a timeout.
  #
  # To diagnose an already-built binary without running the whole suite:
  #
  # ```sh
  # cd tests/integration
  # uv run --locked python -m harness.standalone_diagnostics startup \
  #   --binary /absolute/path/to/linux-x64/pi --core ../../forks/pi \
  #   --build-evidence /absolute/path/to/pi-build-evidence \
  #   --output /absolute/path/to/new-failure-evidence
  # ```
  #
  # For PR #178's exact graph, cherry-pick the diagnostic harness commit onto that branch and run its
  # normal CI. The workflow observes that branch's existing frozen-core build; do not copy a binary
  # from this diagnostic PR or change package/core/Bun pins. Do not reuse an installed live HOME.
  # Local successful startup creates no artifact. A deliberate synthetic throwing memory factory can
  # verify the raw-stack/capture path, but is not a reproduction of the unexplained CI `Type3` failure.
  #
  # ## Startup exit failure evidence
  #
  # The existing per-scenario artifacts now retain `*.pane.json` captured **before** tmux teardown,
  # `*.exit` wrapper status files when present, and raw startup/RPC `*.stderr`. The pane report keeps
  # the native PID/dead/status/signal response (empty fields can mean unsupported tmux formats), the
  # wrapper status path and its contents or absence; a vanished server is recorded as an error rather
  # than replacing the original failure. Only these named artifact patterns are added to the existing
  # allowlist, never arbitrary JSON, environment dumps or a recursive sandbox HOME. Every candidate's
  # complete raw bytes, including existing sessions/screens, are scanned **before publication**.
  # `pi_release.credentials.require_safe_diagnostic` is the shared publication policy: it reuses
  # `release.redact_diagnostic` for URL/known proxy credentials and centralizes the signature rules
  # guest-state capture (through `python -m pi_release.credentials`) consume this same helper, with no
  # collector-local credential regex or dependency from the shared helper back onto a collector. Long
  # token/key signatures remain checked. Explicit canonical JSON string
  # fields `access_token`, `refresh_token` and `api_key` are refused for **any nonempty string value**;
  # case-insensitive `Bearer` followed by any nonempty whitespace-delimited value is refused regardless
  # of length. Empty/null credential slots and metadata keys such as `api_key_available`,
  # `access_token_count`, `auth_type: "Bearer"` and `token_count` are not auth dumps by themselves.
  # The Bearer rule deliberately may reject prose describing a token. Signatures are heuristics, not
  # proof against arbitrary secrets, unknown/escaped credential keys or encoded values.
  #
  # Candidates are staged outside the uploaded artifacts root, scanned and written from the same byte
  # snapshot, then renamed into place only when the complete set is safe. Any unsafe/unreadable candidate
  # or staging error refuses the whole set, removes stale publication and leaves the primary verdict
  # unchanged; raw bytes are never redacted into a misleading "exact" capture. Every ancestor from the
  # sandbox root itself through the candidate's parent must be an actual directory, including internal
  # parent links that happen to resolve inside the sandbox. Candidate reads reuse the `pi_release.files`
  # regular-file pattern: reject known nonregular entries before opening, then use `O_NOFOLLOW`,
  # `O_NONBLOCK`, `O_NOCTTY` and descriptor `fstat` before reading. Final symlink/FIFO replacements cannot
  # turn cleanup into a blocking FIFO read. Ancestry checks are observations, not a descriptor-anchored
  # sandbox against concurrent malicious same-UID parent replacement. No broader filesystem-security
  # claim is made. Pane reports use a strict `PaneExitEvidence` Pydantic model, including a read-only `ps` subtree of the pane PID (`process_tree`; empty when the wrapper is gone, never a signal). Missing tmux, invalid UTF-8
  # markers and capture/write failures cannot prevent server teardown. RPC evidence open/write/flush
  # failures disable only the disk sink: bounded pipe drainage and in-memory diagnostics continue.
  # This supplements, not duplicates, the separate standalone build/startup collector from #191.
  #
  # Observed on 2026-10-28, both in `Standalone D and E (local)`:
  #
  # - PR #155, run `40666549747`, job `122742471639`: `ordinary-session_start-tui` fails with
  #   `TUI never reported its exit status`. Its saved screen contains `STARTUP-OK` and the resume hint.
  #   Original `pi.stderr` reports `Bun v1.3.14 (0d9b296a) macOS Silicon`, macOS `14.8.9`,
  #   `Elapsed: 8573ms`, feature `exited`, and `Segmentation fault at address 0xC`.
  #   The decoded trace [here](https://bun.report/1.3.14/M_10d9b296mggQugggC______mk04Yuw4uhBu7l7H_2lkjlDurh5kD27p5tC+xt2yC+1+3H_2lkjlDurh5kDunr21Cusw11CA2AY)
  #   resolves through `jsc.VirtualMachine.globalExit`, `Bun__Process__exit` and
  #   `Bun::Process_functionReallyExit` / `Process_functionExit`.
  # - PR #178, run `40667021371`, job `122744482131`: the failure is instead
  #   `ordinary-session_start-rpc`, `subprocess.TimeoutExpired` after 60 seconds. Its TUI case passes.
  #   The traceback's truncated `stderr_seq` contains the Bun `1.3.14` crash banner; the original full
  #   timeout stderr was not archived. The `-9` return code is observed after Python's timeout kill,
  #   not a successful runtime shutdown.
  #
  # Both include a curl-shim `Bad file descriptor` error. Bun's macOS crash reporter invokes curl
  # ([here](https://github.com/oven-sh/bun/blob/0d9b296af33f2b851fcbf4df3e9ec89751734ba4/src/crash_handler/crash_handler.zig));
  # that downstream error is not evidence that an extension's curl caused the crash. The historical
  # artifacts lack pre-cleanup pane state and `*.exit`; they cannot distinguish a live crashed process
  # from a dead wrapper or missing status file. RPC does not use that wrapper at all.
  #
  # A local rebuild of Gitlink `2bfb8e7c61d35167b09f8ce70693df39660fc197` with Bun `1.3.14` and frozen
  # release model data passed 29 original TUI and 29 RPC startup calls, including two concurrent drivers.
  # The initial two-case command was `PI_BIN=<rebuilt-pi> uv run --locked pytest
  # 'scenarios/test_startup.py::test_fatal_startup_modes[ordinary-session_start-tui]'
  # 'scenarios/test_startup.py::test_fatal_startup_modes[ordinary-session_start-rpc]'
  # --stack ../../release/stacks/local.json --runtime bun-standalone -q`: 2 passed. A diagnostic driver then invoked
  # that unchanged scenario function on copied explicit fixtures: 12 serial pairs, then two concurrent
  # drivers of 8 pairs each (qmd failure shim for the concurrent run), all passed. Recorded local logs:
  # `/tmp/fix-tui-repro.log`, `/tmp/fix-tui-repeat.log`, `/tmp/fix-tui-stress-a.log` and
  # `/tmp/fix-tui-stress-b.log`; these workstation logs are not durable CI artifacts.
  # This is not a native-crash reproduction or a fix. Synthetic abort and timeout tests prove the
  # original nonzero/timeout failure and raw evidence survive cleanup; no assertions, deadlines, Bun
  # pins or runtime behavior are relaxed. The exact native trigger and a failing-CI pane-state capture
  # remain unresolved. No capacity cancellation is classified as this failure.
  #
  # RPC EOF exit (#100): the 15s `RPC did not exit on EOF` timeout is a Bun `1.3.14` native exit crash, not a
  # live-monitor shutdown bug, so EOF keeps its graceful contract and no test stops its monitor early. The
  # captured failures hit session D (no monitors) and `test_children_die_when_pi_quits_mid_monitor[stop]`
  # (monitor already stopped), while `[rpc]` EOF with a live monitor exits 0 and reaps its group on every
  # passing run. Since Bun `1.4.4` (#197, 2026-10-29) the 73 PR runs among the latest 100 CI runs hold 61 passing macOS personal
  # stack jobs and no EOF timeout or `Segmentation fault` in any failed run (measured on `ad747f42`). That is
  # absence of recurrence, not a proven fix. `RpcProcess.__exit__` now puts the child's drained stderr in the
  # `TimeoutError`, so a recurrence names the crash banner in the failure itself.
  #
  # Final privacy/cleanup proofs additionally reject internal parent/root links and a root `pi.stderr`
  # FIFO without ever opening it for reading. Stale regular-file prechecks with a FIFO or final symlink
  # replacement are refused through the descriptor checks; removing `O_NONBLOCK` fails a pre-open test
  # assertion, so the mutant cannot hang the test. Short synthetic fields/Bearer values are injected
  # across all seven artifact categories while the primary exception remains unchanged and no artifact
  # set is published. Public metadata negative controls still pass. Removing ancestor checks, restoring
  # plain `Path.read_bytes`, reverting the short-credential rule, or removing `O_NONBLOCK` each fails a
  # focused mutant (workstation logs `/tmp/tui-finalprivacy-mutant-{ancestry,regular,short,nonblock}.log`).
  #
  # Blocker regression receipts:
  #
  # - Unsafe-byte injections cover markers, pane reports, raw stderr, screens, scripts, event logs and
  #   session history for token signatures, URL credentials and known proxy passwords. No partial/stale
  #   artifact tree is published; injected staging write failure preserves the primary assertion.
  # - Missing-executable/server/I/O pane queries still attempt teardown. Invalid UTF-8 marker bytes
  #   remain unchanged, produce an explicit model error field and retain the original decode failure.
  #   Real fixture-generator and direct-startup-owner tests inject missing tmux, screen decode and
  #   screenshot write errors: every owned pane is killed and the primary failure is retained.
  #   An unavailable final screenshot cannot replace `wait_dead`'s exit-status assertion.
  # - RPC evidence open/write/flush failures still drain 262144 stderr bytes plus a tail diagnostic;
  #   the real child exits 17 without pipe blockage and bounded in-memory diagnostics retain the tail.
  # - The startup proof prints the required startup message and observes exit 17 specifically. Its
  #   exit-0 control succeeds. Mutating the observed exit 17 to 0 makes that regression fail with
  #   `DID NOT RAISE AssertionError`, rather than accidentally testing the missing-message assertion.
  # - Mutation checks disable scanning, restore the prior pane capture, restore the prior RPC writer,
  #   and change the nonzero result to zero. All four are killed by the focused regressions. Local
  #   logs are `/tmp/tui-mutant-{scan,pane,writer,zero}.log`, not durable CI artifacts. Restoring the
  #   old fixture teardown or final timeout screenshot separately also fails the caller regressions
  #   (`/tmp/tui-mutant-teardown.log`, `/tmp/tui-mutant-wait-capture.log`).
  #
  # Both assembled stacks use `npm:@gotgenes/pi-anthropic-auth@3.4.3`, not the retained auth Gitlink.
  # `test_auth_transport.py` records direct Anthropic and `router/default` OAuth requests: native bearer
  # and Pi user agent, exact versioned billing block, section-shaped system prompt retained in `system[]`
  # and unchanged first user text. API-key and unconfigured custom-provider requests stay unshaped.
  # Refresh persistence/refusal and the missing-Node-preload fail-closed branch remain covered. No live
  # subscription is used. Explicit pi-ai compat dispatch and legacy loops without `streamFn` bypass the
  # provider wrapper; compaction/modelRegistry coverage is upstream-documented, not asserted here.
  #
  # The `stack` job explicitly selects `tests/integration/scenarios/test_*.py` plus
  # `tests/integration/scenarios/tui/test_footer_resize.py`, marked `stack`, under xdist `--dist loadfile`.
  # No unported non-boundary Python scenarios remain. Package-native suites and `tests/inprocess/`
  # own the ported assertions.
  # The thirteen historical `DOTFILES` rows belong to dotfiles, not a distribution check. Eleven
  # remain doctor checks; the two REA rows were retired in `nredd/dotfiles#58` and replaced with
  # absence/cleanup regressions in dotfiles' `tests/rea-retirement.test.mjs`. See
  # [here](../../tests/integration/README.md) for inputs, package sets and deliberate headless exclusions.
  #
  # Tap and profile pin bumps require green CI on the candidate stack, not local `pi-harness-e2e make verify`.
  # A correctness failure blocks promotion; the existing one-fresh-whole-job-rerun policy applies unchanged.
  # `stack` still tests the released Homebrew-shaped Node bundle. Fork release `v1.3.0-nredd.10`
  # publishes the coding-agent and pi-tui npm tarballs, no standalone assets. Each running `stack` cell also builds the exact
  # Gitlinked source using `.bun-version` (1.4.4), the official `scripts/build-binaries.sh`, and frozen
  # release model data with `build:offline`. It does not depend on a future standalone release, commit
  # binaries, or test a Node wrapper in place of the compiled executable.
  #
  # Bun scope:
  #
  # - Native execution on `xcode-27`, macOS 27 (darwin-arm64) and `ubuntu-24.04` (baseline linux-x64).
  #   Each running cell builds once for its own stack
  # - `--runtime bun-standalone` skips nothing in `tests/integration/scenarios/test_auth_transport.py`: Bun
  #   ignores the `NODE_OPTIONS --import` redirect, so `harness/runtime_hooks.py` also sets
  #   `BUN_OPTIONS=--preload` and the compiled core loads the shared redirect and egress/readiness hook
  #   before its entrypoint. The unchanged shaping, refresh and refusal assertions run in the ordinary
  #   standalone D/E step for each stack (#14). The small native fixture in infrastructure units proves
  #   hook admission and failures only
  # - No other selected D/E case uses preloads, scaled timers or `--expose-gc`. Clock-driven behavior
  #   moved to native suites, and the unused `providers/fast_timers.mjs` preload is deleted (#378);
  #   `harness/probe.py`'s `--expose-gc` is used only by excluded `scenarios/bench/test_render.py`.
  #   The render probe (`probes/render.ts`) picks its collector per runtime: Node's `--expose-gc` hook,
  #   else `Bun.gc(true)` (compiled Bun has no such flag and ignores `NODE_OPTIONS`), else `gc: false`.
  #   `render.test.ts` pins all three; `make check-probes` runs it
  # - The adapter blocker is [here](https://github.com/nredd/pi-harness/issues/14). Previous references
  #   to #58 are stale: no such issue exists in this repository. The timer migration removed one
  #   dependency, not the remaining auth transport interception requirement
  # - NOT RUN: linux-arm64 (no `ubuntu-24.04-arm` job added), darwin-x64, Windows, packed contracts
  #   hosted by the standalone, quiet-runner benchmarks, live credentials and desktop/TCC helpers.
  #   REA is retired, not an outstanding standalone acceptance requirement.
  #   Source-built D/E coverage is not published-binary acceptance or a completed Bun checklist

  stack:
    if: ${{ !cancelled() }}
    name: &stack-name stack (${{ matrix.os }}, ${{ matrix.stack }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, stack: personal, runner: ubuntu-24.04, platform: linux-x64}
          - {os: ubuntu-24.04, stack: local, runner: ubuntu-24.04, platform: linux-x64}
    runs-on: &stack-runner ${{ !fromJSON(needs.classify.outputs.plan || '{}')[format('stack ({0}, {1})', matrix.os, matrix.stack)].run && 'ubuntu-24.04' || fromJSON(needs.classify.outputs.plan || '{}')[format('stack ({0}, {1})', matrix.os, matrix.stack)].runner || matrix.runner }}
    defaults: &stack-defaults
      run:
        shell: bash -e {0}
    timeout-minutes: &stack-timeout 40
    steps: &stack-steps
      # The plan step lives in a local action, so a sparse checkout of `.github/actions` comes first. The full
      # checkout below runs only when the plan says the cell runs.
      - name: Check out the local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            scripts
          persist-credentials: false
      - id: plan
        name: Report execution plan
        uses: ./.github/actions/report-plan
        with:
          cell: ${{ format('stack ({0}, {1})', matrix.os, matrix.stack) }}
          plan: ${{ needs.classify.outputs.plan }}
          classify_result: ${{ needs.classify.result }}
          changed_files: ${{ needs.classify.outputs.changed_files }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.plan.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        id: tools
        if: steps.plan.outputs.run == 'true'
      - name: Initialize the core fork at its Gitlink
        if: steps.plan.outputs.run == 'true'
        run: git submodule update --init forks/pi
      - name: Install tmux (Linux)
        if: steps.plan.outputs.run == 'true' && runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          # The runner image usually ships tmux; skip apt entirely then (#655).
          command -v tmux >/dev/null && exit 0
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120 install --yes tmux
      - name: Install tmux (macOS)
        if: steps.plan.outputs.run == 'true' && runner.os == 'macOS'
        run: command -v tmux >/dev/null || brew install tmux
      - name: Verify root core overrides before install
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=release python3 -m pi_release.release --verify-root-overrides --root .
      - name: Install workspace and harness dependencies
        id: workspace
        if: steps.plan.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts
          # `dist/` is gitignored; the `local` stack and inprocess tests load it from the checkout.
          npm run build
          cd tests/integration && uv sync --locked --python "$(tr -d '\n' < ../../.python-version)"
      - name: Fetch exact Gitlinked core release, formula-equivalent install
        if: steps.plan.outputs.run == 'true'
        working-directory: tests/integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C ../../forks/pi fetch --tags origin
          uv run --locked python -m pi_release.release --gitlink ../../forks/pi --prefix "$RUNNER_TEMP/pi-release"
          echo "PI_BIN=$RUNNER_TEMP/pi-release/bin/pi" >>"$GITHUB_ENV"
      - name: Report binary identity
        if: steps.plan.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/version-home" "$RUNNER_TEMP/version-agent"
          HOME="$RUNNER_TEMP/version-home" PI_CODING_AGENT_DIR="$RUNNER_TEMP/version-agent" "$PI_BIN" --version
          git -C forks/pi describe --tags --exact-match
      - name: Replay source-selected installer runtime locks without lifecycle scripts
        if: steps.plan.outputs.scenarios == 'true' && matrix.stack == 'personal'
        working-directory: tests/integration
        run: uv run --locked python -m pi_release.runtime_lock --stack ../../release/stacks/personal.json --replay ../../release/stacks/runtime-locks.json
      - name: Assembled D and E boundaries (explicit stack, no machine config)
        if: steps.plan.outputs.scenarios == 'true'
        working-directory: tests/integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack "../../release/stacks/${{ matrix.stack }}.json" -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml="artifacts/stack-${{ matrix.stack }}.xml"
      - name: Report installed package identities and stack digests
        if: always() && steps.plan.outputs.run == 'true'
        working-directory: tests/integration
        run: |
          uv run --locked python -c 'from pathlib import Path; [print(p.read_text()) for p in sorted(Path("artifacts").glob("stack-*.json"))]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.plan.outputs.run == 'true'
        with:
          name: stack-${{ matrix.os }}-${{ matrix.stack }}
          path: tests/integration/artifacts/
          if-no-files-found: ignore
      # Each cell builds the core and runs only its own stack, so macOS keeps standalone evidence in `local`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ !cancelled() && steps.plan.outputs.scenarios == 'true' && steps.workspace.outcome == 'success' }}
        with:
          bun-version-file: .bun-version
      - name: Preserve Node failure artifacts before standalone runs
        if: ${{ always() && steps.plan.outputs.scenarios == 'true' }}
        working-directory: tests/integration
        run: |
          if [ -d artifacts ]; then mv artifacts artifacts-node; fi
      - name: Build standalone
        id: build
        if: ${{ !cancelled() && steps.plan.outputs.scenarios == 'true' && steps.workspace.outcome == 'success' }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: tests/integration/.venv/bin/python scripts/ci_standalone.py "$PLATFORM"
      - name: Scan standalone build failure evidence
        id: build_failure
        if: ${{ !cancelled() && steps.build.outcome == 'failure' }}
        working-directory: tests/integration
        run: |
          uv run --locked python -m harness.standalone_diagnostics collect-build-failure \
            --evidence "$RUNNER_TEMP/pi-build-evidence" --first "$RUNNER_TEMP/pi-first-build" \
            --second "$RUNNER_TEMP/pi-standalone/${{ matrix.platform }}/pi" \
            --output "$RUNNER_TEMP/standalone-build-failure" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.build.outcome == 'failure' && steps.build_failure.outputs.artifact_ready == 'true' }}
        with:
          name: standalone-build-failure-${{ matrix.platform }}-${{ matrix.stack }}
          path: ${{ runner.temp }}/standalone-build-failure/
          if-no-files-found: warn
          retention-days: 7
      - name: Report standalone binary and source identity
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/version-home" "$RUNNER_TEMP/version-agent"
          HOME="$RUNNER_TEMP/version-home" PI_CODING_AGENT_DIR="$RUNNER_TEMP/version-agent" "$PI_BIN" --version
          git -C forks/pi rev-parse HEAD
          bun --version
          shasum -a 256 "$PI_BIN" "$RUNNER_TEMP/pi-standalone/pi-${{ matrix.platform }}.tar.gz"
      - name: Strict standalone startup with failure-only diagnostics
        id: startup
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' && matrix.platform == 'linux-x64' && matrix.stack == 'personal' }}
        working-directory: tests/integration
        run: |
          uv run --locked python -m harness.standalone_diagnostics startup \
            --binary "$PI_BIN" --core ../../forks/pi \
            --build-evidence "$RUNNER_TEMP/pi-build-evidence" \
            --output "$RUNNER_TEMP/standalone-startup-diagnostics" --github-output "$GITHUB_OUTPUT"
      - name: Upload scanned standalone startup failure evidence
        if: ${{ !cancelled() && steps.startup.outcome == 'failure' && steps.startup.outputs.artifact_ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-startup-linux-x64
          path: ${{ runner.temp }}/standalone-startup-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Standalone D and E (personal)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' && matrix.stack == 'personal' }}
        working-directory: tests/integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack ../../release/stacks/personal.json --runtime bun-standalone -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml=artifacts/standalone-personal.xml
      - name: Standalone D and E (local)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' && matrix.stack == 'local' }}
        working-directory: tests/integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack ../../release/stacks/local.json --runtime bun-standalone -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml=artifacts/standalone-local.xml
      - name: Report coverage exclusions
        if: ${{ always() && steps.plan.outputs.scenarios == 'true' }}
        shell: bash -e {0}
        run: |
          echo "Bun standalone: default D/E runs the auth transport cases through the BUN_OPTIONS preload adapter, no skips (#14); consult the step outcome and JUnit, not this notice, for evidence." >>"$GITHUB_STEP_SUMMARY"
          echo "linux-arm64, packed contracts under standalone, bench, live credentials and desktop helpers: NOT RUN." >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.plan.outputs.scenarios == 'true' }}
        with:
          name: standalone-${{ matrix.platform }}-${{ matrix.stack }}
          path: tests/integration/artifacts/
          if-no-files-found: ignore

  stack-macos:
    if: ${{ github.event_name != 'pull_request' && !cancelled() }}
    name: *stack-name
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, stack: local, runner: xcode-27, platform: darwin-arm64}
    concurrency:
      group: ${{ github.workflow }}-stack-macos-${{ matrix.os }}-${{ matrix.stack }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.result == 'success' && fromJSON(needs.classify.outputs.plan || '{}')[format('stack ({0}, {1})', matrix.os, matrix.stack)].run && 'push' || format('{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.result == 'success' && fromJSON(needs.classify.outputs.plan || '{}')[format('stack ({0}, {1})', matrix.os, matrix.stack)].run || false }}
    runs-on: *stack-runner
    defaults: *stack-defaults
    timeout-minutes: *stack-timeout
    steps: *stack-steps
