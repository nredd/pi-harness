# Owned-code gates and packed-artifact contracts. See docs/ci.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: classify changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      changed_files: ${{ steps.classify.outputs.changed_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Classify changed paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_paths.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
      - name: Report classification
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          CHANGED_FILES: ${{ steps.classify.outputs.changed_files }}
        run: |
          echo "Changed-path classification: docs-only=$DOCS_ONLY"
          {
            echo "### CI path classification"
            echo
            echo "Docs-only: \`$DOCS_ONLY\`"
            echo
            echo "Changed files:"
            echo '```text'
            printf '%s\n' "$CHANGED_FILES"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  owned:
    name: owned (${{ matrix.os }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, wsl2]
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            guest: linux
          - os: macos-14
            runner: macos-14
            guest: macos
          - os: wsl2
            runner: windows-2022
            guest: wsl2
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.guest == 'wsl2' && format('bash "{0}/scripts/wsl2_host.sh" {{0}}', github.workspace) || 'bash -e {0}' }}
    timeout-minutes: ${{ matrix.os == 'wsl2' && 45 || 30 }}
    steps:
      - name: Select and verify Git Bash on the Windows host
        if: matrix.os == 'wsl2'
        shell: pwsh
        run: |
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          $bash = Join-Path $gitBin 'bash.exe'
          if (!(Test-Path $bash)) { throw "Missing Git Bash: $bash" }
          $env:PATH = "$gitBin;$env:PATH"
          $resolved = (Get-Command bash.exe -All -CommandType Application | Select-Object -First 1).Source
          Write-Output "Resolved Git Bash: $resolved; expected: $bash"
          if ($resolved -ne $bash) { throw "Ambiguous Bash resolution: $resolved" }
          & $bash --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gitBin >> $env:GITHUB_PATH
          "PI_CI_GIT_BASH=$bash" >> $env:GITHUB_ENV
          "Git Bash executable: $resolved" >> $env:GITHUB_STEP_SUMMARY
      - id: plan
        name: Report execution plan
        shell: bash -e {0}
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          CHANGED_FILES: ${{ needs.classify.outputs.changed_files }}
        run: |
          if [ "$DOCS_ONLY" = true ] && [ "${{ matrix.os }}" != wsl2 ]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=docs-only CI bypass::Skipping expensive owned checks because this change is docs-only"
            {
              echo "### owned: skipped"
              echo "Skipped because the change is docs-only."
              echo '```text'
              printf '%s\n' "$CHANGED_FILES"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "owned checks will run"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.plan.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        id: tools
        if: steps.plan.outputs.run == 'true'
        with:
          guest: ${{ matrix.guest }}
          owned: 'true'
      - name: Initialize the core fork at its Gitlink
        if: steps.plan.outputs.run == 'true'
        run: git submodule update --init forks/pi
      # Verifies the root core overrides before `npm ci`; the read-only token is for `gh attestation verify`.
      - name: Install
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make install
      # computer-use's Linux helper checks (cargo tests, packed-source build, diagnostics) run inside `check-ts` on
      # Ubuntu and print NOT RUN on macOS. ARM64 is compile-only (`cargo check`, no linker): never a runtime claim.
      - name: Add the aarch64 Linux compile target
        if: steps.plan.outputs.run == 'true' && matrix.guest != 'macos'
        run: |
          rustup target add aarch64-unknown-linux-gnu
          echo "PI_CU_LINUX_ARM64_CHECK=1" >>"$GITHUB_ENV"
      - name: Owned gates (biome, tsc, Vitest on Node and Bun, scripts, integration units)
        if: steps.plan.outputs.run == 'true'
        run: make check-ts check-scripts check-integration
      - name: Packages without a Bun run (not run)
        if: steps.plan.outputs.run == 'true'
        run: |
          # shellcheck disable=SC2016 # the single-quoted program is JavaScript, its ${} is a JS template
          for manifest in packages/*/package.json; do
            node -e 'const m = require(process.argv[1]); if (!m.scripts["test:bun"]) console.log(`::notice title=bun test not run::${m.name} has no declared Bun suite yet`)' "./$manifest"
          done
      - name: Benchmark unit gate
        if: steps.plan.outputs.run == 'true' && runner.os == 'macOS'
        run: |
          # The native_runtime test runs the real Codex sandbox (Seatbelt); exact historical pin, no credentials.
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/codex" @openai/codex@0.154.0
          mkdir -p "$RUNNER_TEMP/codex-home" "$RUNNER_TEMP/codex-cache"
          CODEX_HOME="$RUNNER_TEMP/codex-home" XDG_CACHE_HOME="$RUNNER_TEMP/codex-cache" \
            PATH="$RUNNER_TEMP/codex/node_modules/.bin:$PATH" make check-benchmark
      - name: Benchmark unit gate (not run)
        if: steps.plan.outputs.run == 'true' && runner.os != 'macOS'
        run: echo "::notice title=check-benchmark not run::macOS only, its native_runtime test needs Seatbelt"
      - uses: ./.github/actions/capture-ci-wsl
        if: always() && matrix.os == 'wsl2' && steps.tools.outcome == 'success'
        with:
          cleanup: cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.os == 'wsl2'
        with:
          name: wsl2-diagnostics-owned
          path: ${{ runner.temp }}/wsl2-diagnostics/
          if-no-files-found: warn

  contracts:
    name: contracts (${{ matrix.os }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, wsl2]
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            guest: linux
          - os: macos-14
            runner: macos-14
            guest: macos
          - os: wsl2
            runner: windows-2022
            guest: wsl2
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.guest == 'wsl2' && format('bash "{0}/scripts/wsl2_host.sh" {{0}}', github.workspace) || 'bash -e {0}' }}
    timeout-minutes: ${{ matrix.os == 'wsl2' && 45 || 30 }}
    steps:
      - name: Select and verify Git Bash on the Windows host
        if: matrix.os == 'wsl2'
        shell: pwsh
        run: |
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          $bash = Join-Path $gitBin 'bash.exe'
          if (!(Test-Path $bash)) { throw "Missing Git Bash: $bash" }
          $env:PATH = "$gitBin;$env:PATH"
          $resolved = (Get-Command bash.exe -All -CommandType Application | Select-Object -First 1).Source
          Write-Output "Resolved Git Bash: $resolved; expected: $bash"
          if ($resolved -ne $bash) { throw "Ambiguous Bash resolution: $resolved" }
          & $bash --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gitBin >> $env:GITHUB_PATH
          "PI_CI_GIT_BASH=$bash" >> $env:GITHUB_ENV
          "Git Bash executable: $resolved" >> $env:GITHUB_STEP_SUMMARY
      - id: plan
        name: Report execution plan
        shell: bash -e {0}
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          CHANGED_FILES: ${{ needs.classify.outputs.changed_files }}
        run: |
          if [ "$DOCS_ONLY" = true ] && [ "${{ matrix.os }}" != wsl2 ]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=docs-only CI bypass::Skipping expensive contracts checks because this change is docs-only"
            {
              echo "### contracts: skipped"
              echo "Skipped because the change is docs-only."
              echo '```text'
              printf '%s\n' "$CHANGED_FILES"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "contracts checks will run"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.plan.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        id: tools
        if: steps.plan.outputs.run == 'true'
        with:
          guest: ${{ matrix.guest }}
      # Verifies the root core overrides before `npm ci`; the read-only token is for `gh attestation verify`.
      - name: Install
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make install
      - name: Packed plugins alone on exact stock Pi, plus packed preset audit
        if: steps.plan.outputs.run == 'true'
        run: make check-package-contracts REPORT="$RUNNER_TEMP/package-contracts.json"
      - name: Packed pi-plan-mode with its registry dependency on exact stock Pi
        if: steps.plan.outputs.run == 'true'
        run: make check-plan-mode-package-contract REPORT="$RUNNER_TEMP/plan-mode-package-contracts.json"
      - name: Packed pi-computer-use on exact stock Pi (native desktop not run)
        if: steps.plan.outputs.run == 'true'
        run: make check-computer-use-package-contract REPORT="$RUNNER_TEMP/computer-use-package-contracts.json"
      - name: Packed pi-subagents with its registry dependencies on exact stock Pi
        if: steps.plan.outputs.run == 'true'
        run: make check-subagents-package-contract REPORT="$RUNNER_TEMP/subagents-package-contracts.json"
      - name: Packed pi-todo with its registry dependencies on exact stock Pi
        if: steps.plan.outputs.run == 'true'
        run: make check-todo-package-contract REPORT="$RUNNER_TEMP/todo-package-contracts.json"
      - uses: ./.github/actions/capture-ci-wsl
        if: always() && matrix.os == 'wsl2' && steps.tools.outcome == 'success'
        with:
          cleanup: cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.plan.outputs.run == 'true'
        with:
          name: contract-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/*contracts*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.os == 'wsl2'
        with:
          name: wsl2-diagnostics-contracts
          path: ${{ runner.temp }}/wsl2-diagnostics/
          if-no-files-found: warn

  stack:
    name: stack (${{ matrix.os }}, ${{ matrix.stack }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, wsl2]
        stack: [personal, local]
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            guest: linux
            platform: linux-x64
          - os: macos-14
            runner: macos-14
            guest: macos
            platform: darwin-arm64
          - os: wsl2
            runner: windows-2022
            guest: wsl2
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.guest == 'wsl2' && format('bash "{0}/scripts/wsl2_host.sh" {{0}}', github.workspace) || 'bash -e {0}' }}
    timeout-minutes: ${{ matrix.os == 'wsl2' && 45 || 40 }}
    steps:
      - name: Select and verify Git Bash on the Windows host
        if: matrix.os == 'wsl2'
        shell: pwsh
        run: |
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          $bash = Join-Path $gitBin 'bash.exe'
          if (!(Test-Path $bash)) { throw "Missing Git Bash: $bash" }
          $env:PATH = "$gitBin;$env:PATH"
          $resolved = (Get-Command bash.exe -All -CommandType Application | Select-Object -First 1).Source
          Write-Output "Resolved Git Bash: $resolved; expected: $bash"
          if ($resolved -ne $bash) { throw "Ambiguous Bash resolution: $resolved" }
          & $bash --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gitBin >> $env:GITHUB_PATH
          "PI_CI_GIT_BASH=$bash" >> $env:GITHUB_ENV
          "Git Bash executable: $resolved" >> $env:GITHUB_STEP_SUMMARY
      - id: plan
        name: Report execution plan
        shell: bash -e {0}
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          CHANGED_FILES: ${{ needs.classify.outputs.changed_files }}
        run: |
          if [ "$DOCS_ONLY" = true ] && [ "${{ matrix.os }}" != wsl2 ]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=docs-only CI bypass::Skipping expensive stack scenario because this change is docs-only"
            {
              echo "### stack: skipped"
              echo "Skipped because the change is docs-only."
              echo '```text'
              printf '%s\n' "$CHANGED_FILES"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "${{ matrix.os }}" != wsl2 ] && { [ "${{ matrix.os }}" != ubuntu-24.04 ] || [ "${{ matrix.stack }}" != personal ]; }; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=main CI smoke::Skipping this stack cell on main; ubuntu-24.04/personal remains the merged-result smoke"
            echo "### stack: main-push selective smoke" >>"$GITHUB_STEP_SUMMARY"
            echo "Skipped on a main push; \`stack (ubuntu-24.04, personal)\` validates the merged result." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "stack scenario will run"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.plan.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        id: tools
        if: steps.plan.outputs.run == 'true'
        with:
          guest: ${{ matrix.guest }}
      - name: Initialize the core fork at its Gitlink
        if: steps.plan.outputs.run == 'true'
        run: git submodule update --init forks/pi
      - name: Install tmux (Linux)
        if: steps.plan.outputs.run == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Install tmux (macOS)
        if: steps.plan.outputs.run == 'true' && runner.os == 'macOS'
        run: brew install tmux
      - name: Verify root core overrides before install
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=integration python3 -m harness.release --verify-root-overrides --root .
      - name: Install workspace and harness dependencies
        id: workspace
        if: steps.plan.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts
          cd integration && uv sync --locked --python "$(tr -d '\n' < ../.python-version)"
      - name: Fetch exact Gitlinked core release, formula-equivalent install
        if: steps.plan.outputs.run == 'true'
        working-directory: integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C ../forks/pi fetch --tags origin
          uv run --locked python -m harness.release --gitlink ../forks/pi --prefix "$RUNNER_TEMP/pi-release"
          echo "PI_BIN=$RUNNER_TEMP/pi-release/bin/pi" >>"$GITHUB_ENV"
      - name: Report binary identity
        if: steps.plan.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/version-home" "$RUNNER_TEMP/version-agent"
          HOME="$RUNNER_TEMP/version-home" PI_CODING_AGENT_DIR="$RUNNER_TEMP/version-agent" "$PI_BIN" --version
          git -C forks/pi describe --tags --exact-match
      - name: Assembled D and E boundaries (explicit stack, no machine config)
        if: steps.plan.outputs.run == 'true'
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack "stacks/${{ matrix.stack }}.json" -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml="artifacts/stack-${{ matrix.stack }}.xml"
      - name: Report installed package identities and stack digests
        if: always() && steps.plan.outputs.run == 'true'
        working-directory: integration
        run: |
          uv run --locked python -c 'from pathlib import Path; [print(p.read_text()) for p in sorted(Path("artifacts").glob("stack-*.json"))]'
      - uses: ./.github/actions/capture-ci-wsl
        if: always() && matrix.os == 'wsl2' && steps.tools.outcome == 'success'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.plan.outputs.run == 'true'
        with:
          name: stack-${{ matrix.os }}-${{ matrix.stack }}
          path: integration/artifacts/
          if-no-files-found: ignore
      # Reuse the existing personal runner for BOTH standalone stacks. No extra jobs or
      # artifact-transfer queue admissions, and no duplicate build in the local runner.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && matrix.stack == 'personal' && steps.workspace.outcome == 'success' && matrix.os != 'wsl2' }}
        with:
          bun-version-file: .bun-version
      - name: Preserve Node failure artifacts before standalone runs
        if: ${{ always() && steps.plan.outputs.run == 'true' && matrix.stack == 'personal' }}
        working-directory: integration
        run: |
          if [ -d artifacts ]; then mv artifacts artifacts-node; fi
      - name: Build standalone once for both stacks
        id: build
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && matrix.stack == 'personal' && steps.workspace.outcome == 'success' }}
        working-directory: forks/pi
        run: |
          npm ci --ignore-scripts
          # Same frozen data as forks.yml, never the live model fetch.
          version=$(node -p 'require("./packages/ai/package.json").version')
          mkdir -p "$RUNNER_TEMP/model-data"
          npm pack "@earendil-works/pi-ai@$version" --pack-destination "$RUNNER_TEMP/model-data"
          tar -xzf "$RUNNER_TEMP/model-data/earendil-works-pi-ai-$version.tgz" -C "$RUNNER_TEMP/model-data"
          rm -rf packages/ai/src/providers/data
          cp -R "$RUNNER_TEMP/model-data/package/dist/providers/data" packages/ai/src/providers/data
          # Observe Bun's compile argv/module graph without changing core sources or build flags.
          PYTHONPATH=../../integration ../../integration/.venv/bin/python -m harness.standalone_diagnostics \
            prepare-build --directory "$RUNNER_TEMP/pi-build-evidence"
          PATH="$RUNNER_TEMP/pi-build-evidence/bin:$PATH" \
            ./scripts/build-binaries.sh --skip-install --offline-model-data \
            --platform "${{ matrix.platform }}" --out "$RUNNER_TEMP/pi-standalone" \
            2>&1 | tee "$RUNNER_TEMP/pi-build-evidence/build.log"
          echo "PI_BIN=$RUNNER_TEMP/pi-standalone/${{ matrix.platform }}/pi" >>"$GITHUB_ENV"
      - name: Report standalone binary and source identity
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/version-home" "$RUNNER_TEMP/version-agent"
          HOME="$RUNNER_TEMP/version-home" PI_CODING_AGENT_DIR="$RUNNER_TEMP/version-agent" "$PI_BIN" --version
          git -C forks/pi rev-parse HEAD
          bun --version
          shasum -a 256 "$PI_BIN" "$RUNNER_TEMP/pi-standalone/pi-${{ matrix.platform }}.tar.gz"
      - name: Strict standalone startup with failure-only diagnostics
        id: startup
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' && matrix.platform == 'linux-x64' }}
        working-directory: integration
        run: |
          uv run --locked python -m harness.standalone_diagnostics startup \
            --binary "$PI_BIN" --core ../forks/pi \
            --build-evidence "$RUNNER_TEMP/pi-build-evidence" \
            --output "$RUNNER_TEMP/standalone-startup-diagnostics" --github-output "$GITHUB_OUTPUT"
      - uses: ./.github/actions/capture-ci-wsl
        id: startup_capture
        if: ${{ !cancelled() && matrix.os == 'wsl2' && steps.startup.outcome == 'failure' && steps.startup.outputs.artifact_ready == 'true' }}
      - name: Upload scanned standalone startup failure evidence
        if: ${{ !cancelled() && steps.startup.outcome == 'failure' && steps.startup.outputs.artifact_ready == 'true' && (matrix.os != 'wsl2' || steps.startup_capture.outcome == 'success') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os == 'wsl2' && 'standalone-startup-wsl2-linux-x64' || 'standalone-startup-linux-x64' }}
          path: ${{ runner.temp }}/standalone-startup-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Standalone D and E (personal)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' }}
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack stacks/personal.json --runtime bun-standalone -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml=artifacts/standalone-personal.xml
      - name: Preserve personal failure artifacts before local runs
        if: ${{ always() && steps.plan.outputs.run == 'true' && matrix.stack == 'personal' }}
        working-directory: integration
        run: |
          if [ -d artifacts ]; then mv artifacts artifacts-personal; fi
      - name: Standalone D and E (local)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' }}
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack stacks/local.json --runtime bun-standalone -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml=artifacts/standalone-local.xml
      - name: Report coverage exclusions
        if: ${{ always() && steps.plan.outputs.run == 'true' && matrix.stack == 'personal' }}
        run: |
          echo "Bun standalone: seven auth dispatch/refresh cases per stack NOT RUN: Node preload interception required (#14). Missing-preload refusal runs." >>"$GITHUB_STEP_SUMMARY"
          echo "linux-arm64, packed contracts under standalone, bench, live credentials and desktop helpers: NOT RUN." >>"$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/capture-ci-wsl
        if: always() && matrix.os == 'wsl2' && steps.tools.outcome == 'success'
        with:
          cleanup: cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.plan.outputs.run == 'true' && matrix.stack == 'personal' }}
        with:
          name: ${{ matrix.os == 'wsl2' && 'standalone-wsl2' || 'standalone' }}-${{ matrix.platform }}
          path: |
            integration/artifacts/
            integration/artifacts-personal/
            ${{ matrix.os == 'wsl2' && 'integration/artifacts-node/' || '' }}
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.os == 'wsl2'
        with:
          name: wsl2-diagnostics-stack-${{ matrix.stack }}
          path: ${{ runner.temp }}/wsl2-diagnostics/
          if-no-files-found: warn

  bench:
    name: bench (not run)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          echo "::notice title=bench not run::No quiet self-hosted runner yet; hosted runners cannot meet the bench admission policy"
          echo "### bench: NOT RUN" >>"$GITHUB_STEP_SUMMARY"
          echo "No quiet self-hosted runner exists yet (migration plan section 7). This is not a pass." >>"$GITHUB_STEP_SUMMARY"
