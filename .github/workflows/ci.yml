# Owned-code gates and packed-artifact contracts on every PR and on main. See docs/ci.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  owned:
    name: owned (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm to packageManager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      # dev-tools' cargo suite runs real cargo + nextest; without nextest it skips, which is not a pass.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      - name: Initialize stack forks at their Gitlinks
        run: git submodule update --init forks/pi-subagents forks/pi-plan-mode forks/rpiv-todo
      - name: Install
        run: make install
      - name: Owned gates (biome, tsc, vitest, bun test, scripts, integration units)
        run: make check-ts check-scripts check-integration
      - name: Packages without a Bun run (not run)
        run: |
          # shellcheck disable=SC2016 # the single-quoted program is JavaScript, its ${} is a JS template
          for manifest in packages/*/package.json; do
            node -e 'const m = require(process.argv[1]); if (!m.scripts["test:bun"]) console.log(`::notice title=bun test not run::${m.name} has no test/scenarios suite under bun yet`)' "./$manifest"
          done
      - name: Benchmark unit gate
        if: runner.os == 'macOS'
        run: |
          # The native_runtime test runs the real Codex sandbox (Seatbelt); exact historical pin, no credentials.
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/codex" @openai/codex@0.154.0
          mkdir -p "$RUNNER_TEMP/codex-home" "$RUNNER_TEMP/codex-cache"
          CODEX_HOME="$RUNNER_TEMP/codex-home" XDG_CACHE_HOME="$RUNNER_TEMP/codex-cache" \
            PATH="$RUNNER_TEMP/codex/node_modules/.bin:$PATH" make check-benchmark
      - name: Benchmark unit gate (not run)
        if: runner.os != 'macOS'
        run: echo "::notice title=check-benchmark not run::macOS only, its native_runtime test needs Seatbelt"

  contracts:
    name: contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize the pi-subagents fork at its Gitlink
        run: git submodule update --init forks/pi-subagents
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm to packageManager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install
        run: make install
      - name: Packed plugins alone on exact stock Pi
        run: make check-package-contracts REPORT="$RUNNER_TEMP/package-contracts.json"
      - name: Packed preset and dev-tools through the pi-subagents fork
        run: make check-fork-package-contracts REPORT="$RUNNER_TEMP/fork-package-contracts.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contract-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/*contracts.json
          if-no-files-found: ignore

  stack:
    name: stack (${{ matrix.os }}, ${{ matrix.stack }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        stack: [personal, local]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm to packageManager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Install workspace and harness dependencies
        run: |
          npm ci --ignore-scripts
          cd integration && uv sync --locked --python "$(tr -d '\n' < ../.python-version)"
      - name: Fetch exact Gitlinked core release, formula-equivalent install
        working-directory: integration
        run: |
          git -C ../forks/pi fetch --tags origin
          uv run --locked python -m harness.release --gitlink ../forks/pi --prefix "$RUNNER_TEMP/pi-release"
          echo "PI_BIN=$RUNNER_TEMP/pi-release/bin/pi" >>"$GITHUB_ENV"
      - name: Report binary identity
        run: |
          mkdir -p "$RUNNER_TEMP/version-home" "$RUNNER_TEMP/version-agent"
          HOME="$RUNNER_TEMP/version-home" PI_CODING_AGENT_DIR="$RUNNER_TEMP/version-agent" "$PI_BIN" --version
          git -C forks/pi describe --tags --exact-match
      - name: Assembled D and E boundaries (explicit stack, no machine config)
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack "stacks/${{ matrix.stack }}.json" -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml="artifacts/stack-${{ matrix.stack }}.xml"
      - name: Report installed package identities and stack digests
        if: always()
        working-directory: integration
        run: |
          uv run --locked python -c 'from pathlib import Path; [print(p.read_text()) for p in sorted(Path("artifacts").glob("stack-*.json"))]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stack-${{ matrix.os }}-${{ matrix.stack }}
          path: integration/artifacts/
          if-no-files-found: ignore

  standalone:
    name: standalone (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm to packageManager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Install workspace and harness dependencies
        run: |
          npm ci --ignore-scripts
          cd integration && uv sync --locked --python "$(tr -d '\n' < ../.python-version)"
      - name: Install Gitlinked core build dependencies
        working-directory: forks/pi
        run: npm ci --ignore-scripts
      - name: Restore the release's model data
        working-directory: forks/pi
        run: |
          # Same frozen data as forks.yml, never the live model fetch.
          version=$(node -p 'require("./packages/ai/package.json").version')
          mkdir -p "$RUNNER_TEMP/model-data"
          npm pack "@earendil-works/pi-ai@$version" --pack-destination "$RUNNER_TEMP/model-data"
          tar -xzf "$RUNNER_TEMP/model-data/earendil-works-pi-ai-$version.tgz" -C "$RUNNER_TEMP/model-data"
          rm -rf packages/ai/src/providers/data
          cp -R "$RUNNER_TEMP/model-data/package/dist/providers/data" packages/ai/src/providers/data
      - name: Build standalone once for both stacks
        id: build
        working-directory: forks/pi
        run: |
          ./scripts/build-binaries.sh --skip-install --offline-model-data \
            --platform "${{ matrix.platform }}" --out "$RUNNER_TEMP/pi-standalone"
          echo "PI_BIN=$RUNNER_TEMP/pi-standalone/${{ matrix.platform }}/pi" >>"$GITHUB_ENV"
      - name: Report binary and source identity
        run: |
          mkdir -p "$RUNNER_TEMP/version-home" "$RUNNER_TEMP/version-agent"
          HOME="$RUNNER_TEMP/version-home" PI_CODING_AGENT_DIR="$RUNNER_TEMP/version-agent" "$PI_BIN" --version
          git -C forks/pi rev-parse HEAD
          bun --version
          shasum -a 256 "$PI_BIN" "$RUNNER_TEMP/pi-standalone/pi-${{ matrix.platform }}.tar.gz"
      - name: Standalone D and E (personal)
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack stacks/personal.json --runtime bun-standalone -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml=artifacts/standalone-personal.xml
      - name: Preserve personal failure artifacts before local runs
        if: always()
        working-directory: integration
        run: |
          if [ -d artifacts ]; then mv artifacts artifacts-personal; fi
      - name: Standalone D and E (local)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack stacks/local.json --runtime bun-standalone -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml=artifacts/standalone-local.xml
      - name: Report coverage exclusions
        if: always()
        run: |
          echo "Bun standalone: seven auth dispatch/refresh cases per stack NOT RUN: Node preload interception required (#14). Missing-preload refusal runs." >>"$GITHUB_STEP_SUMMARY"
          echo "linux-arm64, packed contracts under standalone, bench, live credentials and desktop helpers: NOT RUN." >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: standalone-${{ matrix.platform }}
          path: |
            integration/artifacts/
            integration/artifacts-personal/
          if-no-files-found: ignore

  bench:
    name: bench (not run)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          echo "::notice title=bench not run::No quiet self-hosted runner yet; hosted runners cannot meet the bench admission policy"
          echo "### bench: NOT RUN" >>"$GITHUB_STEP_SUMMARY"
          echo "No quiet self-hosted runner exists yet (migration plan section 7). This is not a pass." >>"$GITHUB_STEP_SUMMARY"
