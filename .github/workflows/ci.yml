# Owned-code gates and packed-artifact contracts. See docs/ci.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: classify changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      changed_files: ${{ steps.classify.outputs.changed_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Classify changed paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_paths.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
      - name: Report classification
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          CHANGED_FILES: ${{ steps.classify.outputs.changed_files }}
        run: |
          echo "Changed-path classification: docs-only=$DOCS_ONLY"
          {
            echo "### CI path classification"
            echo
            echo "Docs-only: \`$DOCS_ONLY\`"
            echo
            echo "Changed files:"
            echo '```text'
            printf '%s\n' "$CHANGED_FILES"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  owned:
    name: owned (${{ matrix.os }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Report execution plan
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          CHANGED_FILES: ${{ needs.classify.outputs.changed_files }}
        run: |
          if [ "$DOCS_ONLY" = true ]; then
            echo "::notice title=docs-only CI bypass::Skipping expensive owned checks because this change is docs-only"
            {
              echo "### owned: skipped"
              echo "Skipped because the change is docs-only."
              echo '```text'
              printf '%s\n' "$CHANGED_FILES"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "owned checks will run"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.classify.outputs.docs_only != 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm to packageManager
        if: needs.classify.outputs.docs_only != 'true'
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.classify.outputs.docs_only != 'true'
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: needs.classify.outputs.docs_only != 'true'
        with:
          version: "0.13.1"
      # dev-tools' cargo suite runs real cargo + nextest; without nextest it skips, which is not a pass.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        if: needs.classify.outputs.docs_only != 'true'
        with:
          tool: cargo-nextest
      - name: Initialize stack forks at their Gitlinks
        if: needs.classify.outputs.docs_only != 'true'
        run: git submodule update --init forks/pi-subagents forks/pi-plan-mode forks/rpiv-todo
      - name: Install
        if: needs.classify.outputs.docs_only != 'true'
        run: make install
      - name: Owned gates (biome, tsc, vitest, bun test, scripts, integration units)
        if: needs.classify.outputs.docs_only != 'true'
        run: make check-ts check-scripts check-integration
      - name: Packages without a Bun run (not run)
        if: needs.classify.outputs.docs_only != 'true'
        run: |
          # shellcheck disable=SC2016 # the single-quoted program is JavaScript, its ${} is a JS template
          for manifest in packages/*/package.json; do
            node -e 'const m = require(process.argv[1]); if (!m.scripts["test:bun"]) console.log(`::notice title=bun test not run::${m.name} has no test/scenarios suite under bun yet`)' "./$manifest"
          done
      - name: Benchmark unit gate
        if: needs.classify.outputs.docs_only != 'true' && runner.os == 'macOS'
        run: |
          # The native_runtime test runs the real Codex sandbox (Seatbelt); exact historical pin, no credentials.
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/codex" @openai/codex@0.154.0
          mkdir -p "$RUNNER_TEMP/codex-home" "$RUNNER_TEMP/codex-cache"
          CODEX_HOME="$RUNNER_TEMP/codex-home" XDG_CACHE_HOME="$RUNNER_TEMP/codex-cache" \
            PATH="$RUNNER_TEMP/codex/node_modules/.bin:$PATH" make check-benchmark
      - name: Benchmark unit gate (not run)
        if: needs.classify.outputs.docs_only != 'true' && runner.os != 'macOS'
        run: echo "::notice title=check-benchmark not run::macOS only, its native_runtime test needs Seatbelt"

  contracts:
    name: contracts (${{ matrix.os }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Report execution plan
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          CHANGED_FILES: ${{ needs.classify.outputs.changed_files }}
        run: |
          if [ "$DOCS_ONLY" = true ]; then
            echo "::notice title=docs-only CI bypass::Skipping expensive contracts checks because this change is docs-only"
            {
              echo "### contracts: skipped"
              echo "Skipped because the change is docs-only."
              echo '```text'
              printf '%s\n' "$CHANGED_FILES"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "contracts checks will run"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - name: Initialize the pi-subagents fork at its Gitlink
        if: needs.classify.outputs.docs_only != 'true'
        run: git submodule update --init forks/pi-subagents
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.classify.outputs.docs_only != 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm to packageManager
        if: needs.classify.outputs.docs_only != 'true'
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: needs.classify.outputs.docs_only != 'true'
        with:
          version: "0.13.1"
      - name: Install
        if: needs.classify.outputs.docs_only != 'true'
        run: make install
      - name: Packed plugins alone on exact stock Pi
        if: needs.classify.outputs.docs_only != 'true'
        run: make check-package-contracts REPORT="$RUNNER_TEMP/package-contracts.json"
      - name: Packed preset and dev-tools through the pi-subagents fork
        if: needs.classify.outputs.docs_only != 'true'
        run: make check-fork-package-contracts REPORT="$RUNNER_TEMP/fork-package-contracts.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.classify.outputs.docs_only != 'true'
        with:
          name: contract-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/*contracts.json
          if-no-files-found: ignore

  stack:
    name: stack (${{ matrix.os }}, ${{ matrix.stack }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        stack: [personal, local]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Report execution plan
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          CHANGED_FILES: ${{ needs.classify.outputs.changed_files }}
        run: |
          if [ "$DOCS_ONLY" = true ]; then
            echo "::notice title=docs-only CI bypass::Skipping expensive stack scenario because this change is docs-only"
            {
              echo "### stack: skipped"
              echo "Skipped because the change is docs-only."
              echo '```text'
              printf '%s\n' "$CHANGED_FILES"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          elif [ "$GITHUB_EVENT_NAME" = push ] && { [ "${{ matrix.os }}" != ubuntu-24.04 ] || [ "${{ matrix.stack }}" != personal ]; }; then
            echo "::notice title=main CI smoke::Skipping this stack cell on main; ubuntu-24.04/personal remains the merged-result smoke"
            echo "### stack: main-push selective smoke" >>"$GITHUB_STEP_SUMMARY"
            echo "Skipped on a main push; \`stack (ubuntu-24.04, personal)\` validates the merged result." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "stack scenario will run"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.docs_only != 'true' && (github.event_name != 'push' || (matrix.os == 'ubuntu-24.04' && matrix.stack == 'personal'))
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.classify.outputs.docs_only != 'true' && (github.event_name != 'push' || (matrix.os == 'ubuntu-24.04' && matrix.stack == 'personal'))
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm to packageManager
        if: needs.classify.outputs.docs_only != 'true' && (github.event_name != 'push' || (matrix.os == 'ubuntu-24.04' && matrix.stack == 'personal'))
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: needs.classify.outputs.docs_only != 'true' && (github.event_name != 'push' || (matrix.os == 'ubuntu-24.04' && matrix.stack == 'personal'))
        with:
          version: "0.13.1"
      - name: Install tmux (Linux)
        if: needs.classify.outputs.docs_only != 'true' && (github.event_name != 'push' || (matrix.os == 'ubuntu-24.04' && matrix.stack == 'personal')) && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Install tmux (macOS)
        if: needs.classify.outputs.docs_only != 'true' && (github.event_name != 'push' || (matrix.os == 'ubuntu-24.04' && matrix.stack == 'personal')) && runner.os == 'macOS'
        run: brew install tmux
      - name: Install workspace and harness dependencies
        if: needs.classify.outputs.docs_only != 'true' && (github.event_name != 'push' || (matrix.os == 'ubuntu-24.04' && matrix.stack == 'personal'))
        run: |
          npm ci --ignore-scripts
          cd integration && uv sync --locked --python "$(tr -d '\n' < ../.python-version)"
      - name: Fetch exact Gitlinked core release, formula-equivalent install
        if: needs.classify.outputs.docs_only != 'true' && (github.event_name != 'push' || (matrix.os == 'ubuntu-24.04' && matrix.stack == 'personal'))
        working-directory: integration
        run: |
          git -C ../forks/pi fetch --tags origin
          uv run --locked python -m harness.release --gitlink ../forks/pi --prefix "$RUNNER_TEMP/pi-release"
          echo "PI_BIN=$RUNNER_TEMP/pi-release/bin/pi" >>"$GITHUB_ENV"
      - name: Report Bun standalone as NOT RUN
        if: needs.classify.outputs.docs_only != 'true' && (github.event_name != 'push' || (matrix.os == 'ubuntu-24.04' && matrix.stack == 'personal'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git -C forks/pi describe --tags --exact-match)
          assets=$(gh release view "$tag" --repo nredd/pi --json assets --jq '.assets[].name')
          if printf '%s\n' "$assets" | grep -Eq '^pi-(darwin|linux|windows)-.*\.(tar\.gz|zip)$'; then
            echo "::error::Bun standalone asset exists in $tag but this gate has no runtime adapter (#58); refusing to claim coverage"
            exit 1
          fi
          echo "Bun standalone: not run (no standalone asset in $tag)"
          echo "Bun standalone: not run (no standalone asset in $tag)" >>"$GITHUB_STEP_SUMMARY"
      - name: Report binary identity
        if: needs.classify.outputs.docs_only != 'true' && (github.event_name != 'push' || (matrix.os == 'ubuntu-24.04' && matrix.stack == 'personal'))
        run: |
          mkdir -p "$RUNNER_TEMP/version-home" "$RUNNER_TEMP/version-agent"
          HOME="$RUNNER_TEMP/version-home" PI_CODING_AGENT_DIR="$RUNNER_TEMP/version-agent" "$PI_BIN" --version
          git -C forks/pi describe --tags --exact-match
      - name: Assembled D and E boundaries (explicit stack, no machine config)
        if: needs.classify.outputs.docs_only != 'true' && (github.event_name != 'push' || (matrix.os == 'ubuntu-24.04' && matrix.stack == 'personal'))
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack "stacks/${{ matrix.stack }}.json" -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml="artifacts/stack-${{ matrix.stack }}.xml"
      - name: Report installed package identities and stack digests
        if: always() && needs.classify.outputs.docs_only != 'true' && (github.event_name != 'push' || (matrix.os == 'ubuntu-24.04' && matrix.stack == 'personal'))
        working-directory: integration
        run: |
          uv run --locked python -c 'from pathlib import Path; [print(p.read_text()) for p in sorted(Path("artifacts").glob("stack-*.json"))]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.classify.outputs.docs_only != 'true' && (github.event_name != 'push' || (matrix.os == 'ubuntu-24.04' && matrix.stack == 'personal'))
        with:
          name: stack-${{ matrix.os }}-${{ matrix.stack }}
          path: integration/artifacts/
          if-no-files-found: ignore

  bench:
    name: bench (not run)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          echo "::notice title=bench not run::No quiet self-hosted runner yet; hosted runners cannot meet the bench admission policy"
          echo "### bench: NOT RUN" >>"$GITHUB_STEP_SUMMARY"
          echo "No quiet self-hosted runner exists yet (migration plan section 7). This is not a pass." >>"$GITHUB_STEP_SUMMARY"
