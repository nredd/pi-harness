# Owned-code gates and packed-artifact contracts. See docs/ci.md.
name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    name: classify changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      wsl_inputs: ${{ steps.classify.outputs.wsl_inputs }}
      stack_inputs: ${{ steps.classify.outputs.stack_inputs }}
      benchmark_inputs: ${{ steps.classify.outputs.benchmark_inputs }}
      plan: ${{ steps.classify.outputs.plan }}
      changed_files: ${{ steps.classify.outputs.changed_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Classify changed paths
        # `plan` is every cell's decision (run, scenarios, gates, NOT RUN reason); the jobs below only read it.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Self-hosted pools write these; a pool that is missing, stopped or stale leaves its cells hosted.
          # A fork PR never gets a pool (a fork also controls its own workflow, so this is not the boundary).
          PI_LINUX_HEARTBEAT: ${{ vars.PI_LINUX_HEARTBEAT }}
          PI_MACOS_HEARTBEAT: ${{ vars.PI_MACOS_HEARTBEAT }}
          PI_WSL2_HEARTBEAT: ${{ vars.PI_WSL2_HEARTBEAT }}
          # Maintainer kill switch: any non-empty value sends every cell back to hosted runners.
          PI_POOLS_DISABLED: ${{ vars.PI_POOLS_DISABLED }}
          UNTRUSTED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'true' || '' }}
        run: |
          pools=(
            --pool-heartbeat "pi-linux=$PI_LINUX_HEARTBEAT"
            --pool-heartbeat "pi-macos=$PI_MACOS_HEARTBEAT"
            --pool-heartbeat "pi-wsl2=$PI_WSL2_HEARTBEAT"
          )
          if [ -n "$UNTRUSTED" ] || [ -n "$PI_POOLS_DISABLED" ]; then pools+=(--no-pools); fi
          if [ "$EVENT" = workflow_dispatch ]; then
            # A frozen release-verification/<sha> ref can verify an older main
            # candidate without moving it forward merely because main advanced.
            case "$GITHUB_REF" in
              refs/heads/main|"refs/heads/release-verification/$GITHUB_SHA") ;;
              *) echo 'Full verification requires main or an exact frozen candidate ref' >&2; exit 1 ;;
            esac
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            # No diff to read: every input is true and every cell runs for real.
            python3 scripts/ci_paths.py --full --event "$EVENT" --github-output "$GITHUB_OUTPUT" "${pools[@]}"
          else
            python3 scripts/ci_paths.py --base "$BASE" --head "$HEAD" --event "$EVENT" \
              --pr-title="$PR_TITLE" --pr-number "${PR_NUMBER:-0}" --github-output "$GITHUB_OUTPUT" "${pools[@]}"
          fi
      - name: Report classification
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          WSL_INPUTS: ${{ steps.classify.outputs.wsl_inputs }}
          STACK_INPUTS: ${{ steps.classify.outputs.stack_inputs }}
          BENCHMARK_INPUTS: ${{ steps.classify.outputs.benchmark_inputs }}
          CHANGED_FILES: ${{ steps.classify.outputs.changed_files }}
        run: |
          echo "Changed-path classification: docs-only=$DOCS_ONLY wsl-inputs=$WSL_INPUTS stack-inputs=$STACK_INPUTS benchmark-inputs=$BENCHMARK_INPUTS"
          echo "::notice title=bench not run::No quiet self-hosted runner yet; hosted runners cannot meet the bench admission policy"
          {
            echo "### CI path classification"
            echo
            echo "Docs-only: \`$DOCS_ONLY\`"
            echo
            echo "WSL inputs: \`$WSL_INPUTS\`"
            echo
            echo "Stack inputs: \`$STACK_INPUTS\`"
            echo
            echo "Benchmark inputs: \`$BENCHMARK_INPUTS\`"
            echo
            echo "Changed files:"
            echo '```text'
            printf '%s\n' "$CHANGED_FILES"
            echo '```'
            echo
            echo "### bench: NOT RUN"
            echo "No quiet self-hosted runner exists yet (migration plan section 7). This is not a pass."
          } >>"$GITHUB_STEP_SUMMARY"

  # Each `owned (<os>)` required check is a fan-in over parallel shard jobs (#350). `scripts/ci_paths.py`
  # `OWNED_SHARDS` owns the split: the plan publishes each running cell's shards, and a shard job's matrix is that
  # list, so no step here names a shard. One shard job and one fan-in per OS, because `needs` is per job: a single
  # fan-in matrix would hold Ubuntu's check until the macOS shards finish. The three jobs of each kind share their
  # steps through YAML anchors.
  owned-shards-ubuntu:
    if: ${{ fromJSON(needs.classify.outputs.plan || '{}')['owned (ubuntu-24.04)'].run }}
    name: &owned-shard-name owned shard (${{ matrix.os }}, ${{ matrix.shard }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.plan)['owned (ubuntu-24.04)'].shards }}
    runs-on: &owned-shard-runner ${{ matrix.runner }}
    defaults: &owned-shard-defaults
      run:
        # `defaults.run.shell` cannot read `runner.os`, so the plan's `host` picks it: a hosted wsl2 shard reaches its
        # guest through `wsl.exe`, a pooled one (`native`) already runs inside the linux-arm64 distro.
        shell: ${{ matrix.guest == 'wsl2' && matrix.host == 'windows' && format('bash "{0}/scripts/wsl2_host.sh" {{0}}', github.workspace) || 'bash -e {0}' }}
    timeout-minutes: &owned-shard-timeout ${{ matrix.os == 'wsl2' && 45 || 30 }}
    steps: &owned-shard-steps
      - name: Select and verify Git Bash on the Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          $bash = Join-Path $gitBin 'bash.exe'
          if (!(Test-Path $bash)) { throw "Missing Git Bash: $bash" }
          $env:PATH = "$gitBin;$env:PATH"
          $resolved = (Get-Command bash.exe -All -CommandType Application | Select-Object -First 1).Source
          Write-Output "Resolved Git Bash: $resolved; expected: $bash"
          if ($resolved -ne $bash) { throw "Ambiguous Bash resolution: $resolved" }
          & $bash --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gitBin >> $env:GITHUB_PATH
          "PI_CI_GIT_BASH=$bash" >> $env:GITHUB_ENV
          "Git Bash executable: $resolved" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        id: tools
        with:
          guest: ${{ matrix.guest }}
          host: ${{ matrix.host }}
          owned: 'true'
      # The pooled ARM64 cell: prove the isolation first, then bootstrap in place (no copy, no `pi-ci` user; the
      # golden image's tools are reused when their versions match the pins).
      - name: Smoke the native guest
        if: matrix.host == 'native'
        run: bash scripts/wsl2_smoke.sh
      - name: Bootstrap tools in the native guest
        if: matrix.host == 'native'
        env:
          PI_WSL2_IN_GUEST: '1'
          WSL_OWNED: 'true'
        run: bash scripts/wsl2_setup.sh
      # Real reviewer reads need system binaries, not Pi's live latest-release download fallback.
      # Prebuilt release binaries from GitHub on both OSes: an Ubuntu apt mirror outage must not
      # block the Linux matrix. fd-find 10.4.2+ ships binstall metadata matching its release assets;
      # fail rather than compile from source.
      - name: Install reviewer read dependencies
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        if: matrix.os == 'ubuntu-24.04' || runner.os == 'macOS'
        env:
          BINSTALL_DISABLE_STRATEGIES: compile
        with:
          tool: ripgrep@14.1.1,fd-find@10.5.0
      - name: Verify reviewer read dependencies
        run: |
          rg --version
          if command -v fd >/dev/null; then fd --version; else fdfind --version; fi
      - name: Initialize the core fork at its Gitlink
        run: git submodule update --init forks/pi
      # `check-integration` drives the live-session drivers against a stub pi in panes on private tmux servers. Same
      # install as the `stack` job; only Linux and macOS shards list that gate.
      - name: Install tmux (Linux)
        if: runner.os == 'Linux' && contains(matrix.gates, 'check-integration')
        timeout-minutes: 5
        run: |
          # The runner image usually ships tmux; skip apt entirely then (#655).
          command -v tmux >/dev/null && exit 0
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120 install --yes tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS' && contains(matrix.gates, 'check-integration')
        run: command -v tmux >/dev/null || brew install tmux
      # Verifies the root core overrides before `npm ci`; the read-only token is for `gh attestation verify`.
      - name: Install
        id: install
        env:
          GH_TOKEN: ${{ github.token }}
        run: make install-owned
      # computer-use's Linux helper checks (cargo tests, packed-source build, diagnostics) run inside its `check-ts` on
      # Ubuntu and WSL and print NOT RUN on macOS. ARM64 is compile-only (`cargo check`, no linker): never a runtime claim.
      - name: Add the aarch64 Linux compile target
        # Skipped on the native ARM64 host: a native `cargo check` of that target is no extra evidence.
        if: matrix.guest != 'macos' && matrix.host != 'native' && contains(matrix.workspaces, 'packages/computer-use')
        run: |
          rustup target add aarch64-unknown-linux-gnu
          echo "PI_CU_LINUX_ARM64_CHECK=1" >>"$GITHUB_ENV"
      # One step per gate the shard lists, so a failing gate never hides another gate's evidence. `check-ts` runs
      # only the shard's workspaces, each package's own `npm run check` in npm workspace order.
      - name: Owned gate check-ts (biome, tsc, Vitest on Node and Bun, computer-use checks)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(matrix.gates, 'check-ts') }}
        env:
          # computer-use's `check` also diffs its tree against the pinned upstream commit (#720). Linux only: one
          # shallow fetch, and the check compares source trees, so one OS is enough.
          PI_CU_UPSTREAM_SYNC: ${{ matrix.os == 'ubuntu-24.04' && '1' || '' }}
        run: make check-ts WORKSPACES="${{ matrix.workspaces }}"
      - name: Install pinned native Ubuntu coverage tools
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-24.04' && contains(matrix.workspaces, 'packages/computer-use') }}
        timeout-minutes: 8
        env:
          CARGO_BUILD_JOBS: '2'
          RUSTUP_TOOLCHAIN: '1.97.1'
        run: |
          mkdir -p packages/computer-use/coverage/native-linux
          {
            time rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
            time cargo +1.97.1 install cargo-llvm-cov --version 0.9.1 --locked --root "$RUNNER_TEMP/cu-cov-tools"
            rustup run 1.97.1 rustc --version --verbose
          } 2>&1 | tee packages/computer-use/coverage/native-linux/setup.log
          echo "$(dirname "$(rustup which --toolchain 1.97.1 cargo)")" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cu-cov-tools/bin" >> "$GITHUB_PATH"
      - name: Collect native Ubuntu Rust coverage (headless, report-only)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-24.04' && contains(matrix.workspaces, 'packages/computer-use') }}
        timeout-minutes: 8
        env:
          CARGO_BUILD_JOBS: '2'
          RUSTUP_TOOLCHAIN: '1.97.1'
        run: npm run coverage:rust --workspace @nredd/pi-computer-use -- --crate linux --output coverage/native-linux
      - name: Owned gate check-scripts (ruff, ty, pytest scripts, import audit)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(matrix.gates, 'check-scripts') }}
        run: make check-scripts
      - name: Owned gate check-integration (ruff, ty, pytest integration units, probes, providers)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(matrix.gates, 'check-integration') }}
        run: make check-integration
      - name: Owned gate check-probes (WSL LCOV producer)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(matrix.gates, 'check-probes') }}
        run: make check-probes
      - name: Owned gate check-providers (WSL LCOV producer)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(matrix.gates, 'check-providers') }}
        run: make check-providers
      - name: Owned gate check-import-audit (WSL LCOV producer)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && contains(matrix.gates, 'check-import-audit') }}
        run: make check-import-audit
      - name: Benchmark unit gate
        # `scripts/ci_paths.py` `PATH_GATED_GATES` plans the skip; the fan-in accounting reads the same plan.
        if: contains(matrix.gates, 'check-benchmark') && !contains(matrix.skipped_gates, 'check-benchmark')
        run: |
          # The runner image's Homebrew Python drifts (3.15.1 now); `pydantic-core` has no cp315 wheel in
          # `benchmarks/comparison/uv.lock`, so uv compiled it from source (~84s here, and again in every
          # cold-cache gate sync the tests run, which inherit this interpreter). Pin the repo's interpreter.
          export UV_PYTHON="$(tr -d '\n' < .python-version)"
          make install-benchmark
          # The native_runtime test runs the real Codex sandbox (Seatbelt); exact historical pin, no credentials.
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/codex" @openai/codex@0.154.0
          mkdir -p "$RUNNER_TEMP/codex-home" "$RUNNER_TEMP/codex-cache"
          CODEX_HOME="$RUNNER_TEMP/codex-home" XDG_CACHE_HOME="$RUNNER_TEMP/codex-cache" \
            PATH="$RUNNER_TEMP/codex/node_modules/.bin:$PATH" make check-benchmark
      - name: Benchmark unit gate (not run, no benchmark inputs)
        if: contains(matrix.skipped_gates, 'check-benchmark')
        run: |
          why="This pull request changes no benchmark input (BENCHMARK_INPUT_FILES and BENCHMARK_INPUT_PREFIXES in scripts/ci_paths.py); check-benchmark runs for real on main pushes and on PRs that change them."
          echo "::notice title=check-benchmark NOT RUN::$why"
          {
            echo "### check-benchmark: NOT RUN"
            echo "$why This is not a pass."
          } >>"$GITHUB_STEP_SUMMARY"
      # `macos-native-pure` compiles real shipped Swift sources once during the package gate.
      # Retain raw region/profile evidence separately; fan-in still consumes its validated LCOV.
      - name: Preserve real-source Swift coverage
        if: always() && matrix.guest == 'macos' && contains(matrix.workspaces, 'packages/computer-use')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: computer-use-swift-${{ matrix.os }}
          path: packages/computer-use/coverage/swift/
          if-no-files-found: error
      # WSL producers run on the guest Linux filesystem; artifact actions run on Windows.
      - uses: ./.github/actions/capture-ci-wsl
        if: always() && matrix.os == 'wsl2' && runner.os == 'Windows' && steps.tools.outcome == 'success'
      # Reports only: the fan-in accounts for the whole cell. A shard that produces no report (computer-use) uploads
      # nothing, and the fan-in's accounting fails on any report the policy expects and no shard produced.
      - name: Preserve this shard's coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            packages/*/coverage/**/lcov.info
            packages/computer-use/coverage/native-linux/coverage.json
            packages/computer-use/coverage/native-linux/setup.log
            packages/computer-use/coverage/native-linux/*/coverage.json
            packages/computer-use/coverage/native-linux/*/metadata.json
            packages/computer-use/coverage/native-linux/*/summary.txt
            packages/computer-use/coverage/native-linux/*/*.log
            packages/*/coverage/**/coverage-summary.json
            integration/inprocess/coverage/**/lcov.info
            integration/inprocess/coverage/**/coverage-summary.json
            integration/probes/coverage/**/lcov.info
            integration/probes/coverage/**/coverage-summary.json
            integration/providers/coverage/**/lcov.info
            integration/providers/coverage/**/coverage-summary.json
            integration/coverage/**/lcov.info
            scripts/coverage/**/lcov.info
            scripts/coverage/**/coverage-summary.json
            benchmarks/comparison/coverage/**/lcov.info
          if-no-files-found: ignore
      - uses: ./.github/actions/capture-ci-wsl
        if: always() && matrix.os == 'wsl2' && runner.os == 'Windows' && steps.tools.outcome == 'success'
        with:
          cleanup: cleanup
          job-status: ${{ job.status }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Windows'
        with:
          name: wsl2-diagnostics-owned-${{ matrix.shard }}
          path: ${{ runner.temp }}/wsl2-diagnostics/
          if-no-files-found: warn

  owned-shards-macos:
    if: ${{ fromJSON(needs.classify.outputs.plan || '{}')['owned (macos-14)'].run }}
    name: *owned-shard-name
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.plan)['owned (macos-14)'].shards }}
    runs-on: *owned-shard-runner
    defaults: *owned-shard-defaults
    timeout-minutes: *owned-shard-timeout
    steps: *owned-shard-steps

  owned-shards-wsl2:
    if: ${{ fromJSON(needs.classify.outputs.plan || '{}')['owned (wsl2)'].run }}
    name: *owned-shard-name
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.plan)['owned (wsl2)'].shards }}
    runs-on: *owned-shard-runner
    defaults: *owned-shard-defaults
    timeout-minutes: *owned-shard-timeout
    steps: *owned-shard-steps

  # Native Windows is not the Linux guest. Keep x64 hosted even when WSL routes to an ARM64 pool (#736).
  computer-use-windows:
    name: computer-use Rust (windows-x64)
    needs: classify
    if: ${{ fromJSON(needs.classify.outputs.plan || '{}')['owned (ubuntu-24.04)'].run && contains(toJSON(fromJSON(needs.classify.outputs.plan)['owned (ubuntu-24.04)'].shards), 'packages/computer-use') }}
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.97.1'
      PI_CU_WINDOWS_SCRIPTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        with:
          guest: windows
      - name: Verify root core overrides before installing dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:PYTHONPATH = 'integration'
          # The verifier intentionally uses only explicit OpenSSL CA defaults. Windows Python has none.
          # Export pinned Node's built-in public Mozilla roots, not private machine roots or a guessed Git layout.
          # This is a temporary CA input, not a system trust-store change or TLS bypass.
          $env:SSL_CERT_FILE = Join-Path $env:RUNNER_TEMP 'cu-public-node-ca.pem'
          node -e 'require("node:fs").writeFileSync(process.argv[1], require("node:tls").rootCertificates.join("\n") + "\n")' "$env:SSL_CERT_FILE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-project --python (Get-Content .python-version) python -m harness.release --verify-root-overrides --root .
      - name: Install pinned native compiler and LLVM tools
        run: |
          New-Item -ItemType Directory -Force packages/computer-use/coverage/native-windows | Out-Null
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview,rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97.1 install cargo-llvm-cov --version 0.9.1 --locked --root "$env:RUNNER_TEMP/cu-cov-tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/cu-cov-tools/bin" >> $env:GITHUB_PATH
          rustup run 1.97.1 rustc --version --verbose | Tee-Object packages/computer-use/coverage/native-windows/compiler.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Select-String -Quiet 'host: x86_64-pc-windows-msvc' packages/computer-use/coverage/native-windows/compiler.log)) { throw 'Native Windows x64 compiler required' }
      - name: Format, compile, lint and document the Windows crate
        run: |
          $manifest = 'packages/computer-use/native/windows/bridge-rs/Cargo.toml'
          cargo fmt --manifest-path $manifest -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --all-targets --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets --manifest-path $manifest -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RUSTDOCFLAGS = '-D warnings'
          cargo doc --locked --no-deps --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --doc --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows tests and LLVM reports (no desktop interaction)
        run: node packages/computer-use/scripts/rust-coverage.mjs --crate windows --output packages/computer-use/coverage/native-windows
      - name: Install isolated script-test dependencies
        run: npm ci --ignore-scripts
      - name: Windows build and install routing into disposable paths
        working-directory: packages/computer-use
        run: node ../../scripts/run-vitest.ts node test/windows-build-scripts.test.mjs test/rust-coverage.test.mjs --coverage.enabled=false
      - name: Preserve Windows source-bound native reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: computer-use-rust-windows-x64
          path: |
            packages/computer-use/coverage/native-windows/compiler.log
            packages/computer-use/coverage/native-windows/coverage.json
            packages/computer-use/coverage/native-windows/*/lcov.info
            packages/computer-use/coverage/native-windows/*/coverage.json
            packages/computer-use/coverage/native-windows/*/summary.txt
            packages/computer-use/coverage/native-windows/*/metadata.json
            packages/computer-use/coverage/native-windows/*/*.log
          if-no-files-found: error

  # The fan-in always reports from Ubuntu: it runs no tests, so a NOT RUN, blocked or running cell holds no macOS or
  # Windows slot. Its one-cell matrix keeps the required name, and the `owned (${{ matrix.os }})` placeholder name of
  # a job a cancelled run never started.
  owned-ubuntu:
    if: ${{ !cancelled() }}
    name: &owned-name owned (${{ matrix.os }})
    needs: [classify, owned-shards-ubuntu, computer-use-windows]
    strategy:
      matrix:
        os: [ubuntu-24.04]
    env:
      SHARDS_RESULT: ${{ needs.owned-shards-ubuntu.result }}
      WINDOWS_REQUIRED: ${{ contains(toJSON(fromJSON(needs.classify.outputs.plan || '{}')['owned (ubuntu-24.04)'].shards), 'packages/computer-use') }}
      WINDOWS_RESULT: ${{ needs.computer-use-windows.result }}
    runs-on: ubuntu-24.04
    timeout-minutes: &owned-timeout 15
    steps: &owned-steps
      # The plan step lives in a local action, so a sparse checkout of `.github/actions` comes first. The full
      # checkout below runs only when the plan says the cell runs.
      - name: Check out the local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: plan
        name: Report execution plan
        uses: ./.github/actions/report-plan
        with:
          cell: ${{ format('owned ({0})', matrix.os) }}
          plan: ${{ needs.classify.outputs.plan }}
          classify_result: ${{ needs.classify.result }}
          changed_files: ${{ needs.classify.outputs.changed_files }}
      # `needs.<job>.result` folds every shard of the matrix into one value, and is `skipped` when the shard job
      # never ran. A running cell needs `success`: a failed, cancelled or skipped shard fails the required check.
      - name: Require every planned shard to succeed
        if: steps.plan.outputs.run == 'true'
        env:
          CELL: ${{ format('owned ({0})', matrix.os) }}
        run: |
          if [ "$SHARDS_RESULT" != success ]; then
            echo "::error title=$CELL shards $SHARDS_RESULT::The plan runs this cell, but its shard jobs finished '$SHARDS_RESULT'; see the 'owned shard' jobs"
            exit 1
          fi
          if [ "${WINDOWS_REQUIRED:-false}" = true ] && [ "$WINDOWS_RESULT" != success ]; then
            echo "::error title=Windows native producer $WINDOWS_RESULT::Native Windows x64 compiler, tests, reports and build scripts must succeed"
            exit 1
          fi
          echo "Every planned shard of $CELL succeeded"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' }}
        with:
          guest: linux
          # No `npm ci` here, so it must not save an empty npm cache.
          npm-cache: 'false'
      - name: Download the shards' coverage reports
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-${{ matrix.os }}-*
          path: ${{ runner.temp }}/shard-coverage
      # Each artifact lands in its own directory; a report path two shards both produced would let one copy
      # silently replace the other, so that fails instead.
      - name: Merge the shards' coverage reports
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' }}
        run: |
          cd "$RUNNER_TEMP/shard-coverage"
          duplicates=$(find . -mindepth 2 -type f | cut -d/ -f3- | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error title=duplicate shard coverage::More than one shard produced: ${duplicates//$'\n'/ }"
            exit 1
          fi
          for shard in */; do
            echo "Merging ${shard%/}"
            cp -R "$shard." "$GITHUB_WORKSPACE/"
          done
      # The accounting reads reports, the policy and Git, and runs no test, so the macOS cell's reports are
      # accounted here with `--os darwin` (the `--reports-root` replay docs/coverage.md describes).
      - name: Coverage accounting (existing reports, including test failures)
        if: always() && steps.plan.outputs.run == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          # The plan owns all three: the floors' platform, the host class whose `skip_hosts` signals (Python on
          # WSL) report NOT RUN, and the path-gated gates whose `gate` signals report NOT RUN on this run.
          COVERAGE_OS: ${{ fromJSON(needs.classify.outputs.plan)[format('owned ({0})', matrix.os)].coverage_os }}
          COVERAGE_HOST: ${{ fromJSON(needs.classify.outputs.plan)[format('owned ({0})', matrix.os)].guest }}
          COVERAGE_SKIPPED_GATES: ${{ fromJSON(needs.classify.outputs.plan)[format('owned ({0})', matrix.os)].skipped_gates }}
        run: make check-coverage BASE="$BASE" COVERAGE_OS="$COVERAGE_OS" COVERAGE_HOST="$COVERAGE_HOST" COVERAGE_SKIPPED_GATES="$COVERAGE_SKIPPED_GATES"
      - name: Preserve independent coverage reports and summary
        if: always() && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: |
            packages/*/coverage/**/lcov.info
            packages/computer-use/coverage/native-linux/coverage.json
            packages/computer-use/coverage/native-linux/setup.log
            packages/computer-use/coverage/native-linux/*/coverage.json
            packages/computer-use/coverage/native-linux/*/metadata.json
            packages/computer-use/coverage/native-linux/*/summary.txt
            packages/computer-use/coverage/native-linux/*/*.log
            packages/*/coverage/**/coverage-summary.json
            integration/inprocess/coverage/**/lcov.info
            integration/inprocess/coverage/**/coverage-summary.json
            integration/probes/coverage/**/lcov.info
            integration/probes/coverage/**/coverage-summary.json
            integration/providers/coverage/**/lcov.info
            integration/providers/coverage/**/coverage-summary.json
            integration/coverage/**/lcov.info
            scripts/coverage/**/lcov.info
            scripts/coverage/**/coverage-summary.json
            benchmarks/comparison/coverage/**/lcov.info
            coverage/summary.json
          if-no-files-found: error
      - name: Packages without a Bun run (not run)
        if: steps.plan.outputs.run == 'true'
        run: |
          # shellcheck disable=SC2016 # the single-quoted program is JavaScript, its ${} is a JS template
          for manifest in packages/*/package.json; do
            node -e 'const m = require(process.argv[1]); if (!m.scripts["test:bun"]) console.log(`::notice title=bun test not run::${m.name} has no declared Bun suite yet`)' "./$manifest"
          done
      - name: Benchmark unit gate (not run)
        if: steps.plan.outputs.run == 'true' && !contains(steps.plan.outputs.gates, 'check-benchmark')
        run: echo "::notice title=check-benchmark not run::macOS only, its native_runtime test needs Seatbelt"

  owned-macos:
    if: ${{ !cancelled() }}
    name: *owned-name
    needs: [classify, owned-shards-macos]
    strategy:
      matrix:
        os: [macos-14]
    env:
      SHARDS_RESULT: ${{ needs.owned-shards-macos.result }}
    runs-on: ubuntu-24.04
    timeout-minutes: *owned-timeout
    steps: *owned-steps

  owned-wsl2:
    if: ${{ !cancelled() }}
    name: *owned-name
    needs: [classify, owned-shards-wsl2]
    strategy:
      matrix:
        os: [wsl2]
    env:
      SHARDS_RESULT: ${{ needs.owned-shards-wsl2.result }}
    runs-on: ubuntu-24.04
    timeout-minutes: *owned-timeout
    steps: *owned-steps

  contracts:
    if: ${{ !cancelled() }}
    name: contracts (${{ matrix.os }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, wsl2]
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            guest: linux
          - os: macos-14
            runner: xcode-27
            guest: macos
          - os: wsl2
            runner: windows-2025
            guest: wsl2
    # A cell the plan does not run (NOT RUN, or blocked, or no plan at all) reports from a cheap Ubuntu job and holds
    # no macOS or Windows slot.
    # A running cell the plan hands to a self-hosted pool carries its `runner`; otherwise the matrix's hosted one.
    runs-on: ${{ !fromJSON(needs.classify.outputs.plan || '{}')[format('contracts ({0})', matrix.os)].run && 'ubuntu-24.04' || fromJSON(needs.classify.outputs.plan || '{}')[format('contracts ({0})', matrix.os)].runner || matrix.runner }}
    defaults:
      run:
        # The plan's `host` for this cell, as in the owned shards: empty (a bypass cell) means hosted.
        shell: ${{ matrix.guest == 'wsl2' && (fromJSON(needs.classify.outputs.plan || '{}')['contracts (wsl2)'].host || 'windows') == 'windows' && format('bash "{0}/scripts/wsl2_host.sh" {{0}}', github.workspace) || 'bash -e {0}' }}
    timeout-minutes: ${{ matrix.os == 'wsl2' && 45 || 30 }}
    steps:
      - name: Select and verify Git Bash on the Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          $bash = Join-Path $gitBin 'bash.exe'
          if (!(Test-Path $bash)) { throw "Missing Git Bash: $bash" }
          $env:PATH = "$gitBin;$env:PATH"
          $resolved = (Get-Command bash.exe -All -CommandType Application | Select-Object -First 1).Source
          Write-Output "Resolved Git Bash: $resolved; expected: $bash"
          if ($resolved -ne $bash) { throw "Ambiguous Bash resolution: $resolved" }
          & $bash --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gitBin >> $env:GITHUB_PATH
          "PI_CI_GIT_BASH=$bash" >> $env:GITHUB_ENV
          "Git Bash executable: $resolved" >> $env:GITHUB_STEP_SUMMARY
      # The plan step lives in a local action, so a sparse checkout of `.github/actions` comes first. The full
      # checkout below runs only when the plan says the cell runs.
      - name: Check out the local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: plan
        name: Report execution plan
        uses: ./.github/actions/report-plan
        with:
          cell: ${{ format('contracts ({0})', matrix.os) }}
          plan: ${{ needs.classify.outputs.plan }}
          classify_result: ${{ needs.classify.result }}
          changed_files: ${{ needs.classify.outputs.changed_files }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.plan.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        id: tools
        if: steps.plan.outputs.run == 'true'
        with:
          guest: ${{ matrix.guest }}
          host: ${{ matrix.guest == 'wsl2' && fromJSON(needs.classify.outputs.plan || '{}')['contracts (wsl2)'].host || '' }}
      - name: Smoke the native guest
        if: steps.plan.outputs.run == 'true' && matrix.guest == 'wsl2' && fromJSON(needs.classify.outputs.plan || '{}')['contracts (wsl2)'].host == 'native'
        run: bash scripts/wsl2_smoke.sh
      - name: Bootstrap tools in the native guest
        if: steps.plan.outputs.run == 'true' && matrix.guest == 'wsl2' && fromJSON(needs.classify.outputs.plan || '{}')['contracts (wsl2)'].host == 'native'
        env:
          PI_WSL2_IN_GUEST: '1'
        run: bash scripts/wsl2_setup.sh
      # Verifies the root core overrides before `npm ci`; the read-only token is for `gh attestation verify`.
      - name: Install
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make install-owned
      - name: Packed plugins alone on exact stock Pi, plus packed preset audit
        if: steps.plan.outputs.run == 'true'
        run: make check-package-contracts REPORT="$RUNNER_TEMP/package-contracts.json"
      - name: Packed pi-plan-mode with its registry dependency on exact stock Pi
        if: steps.plan.outputs.run == 'true'
        run: make check-plan-mode-package-contract REPORT="$RUNNER_TEMP/plan-mode-package-contracts.json"
      - name: Packed pi-computer-use on exact stock Pi (native desktop not run)
        if: steps.plan.outputs.run == 'true'
        run: make check-computer-use-package-contract REPORT="$RUNNER_TEMP/computer-use-package-contracts.json"
      - name: Packed pi-subagents with its registry dependencies on exact stock Pi
        if: steps.plan.outputs.run == 'true'
        run: make check-subagents-package-contract REPORT="$RUNNER_TEMP/subagents-package-contracts.json"
      - name: Packed pi-todo with its registry dependencies on exact stock Pi
        if: steps.plan.outputs.run == 'true'
        run: make check-todo-package-contract REPORT="$RUNNER_TEMP/todo-package-contracts.json"
      - uses: ./.github/actions/capture-ci-wsl
        if: always() && matrix.os == 'wsl2' && runner.os == 'Windows' && steps.tools.outcome == 'success'
        with:
          cleanup: cleanup
          job-status: ${{ job.status }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.plan.outputs.run == 'true'
        with:
          name: contract-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/*contracts*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Windows'
        with:
          name: wsl2-diagnostics-contracts
          path: ${{ runner.temp }}/wsl2-diagnostics/
          if-no-files-found: warn

  release-core:
    if: github.event_name == 'workflow_dispatch'
    needs: classify
    uses: ./.github/workflows/forks.yml

  stack:
    if: ${{ !cancelled() }}
    name: stack (${{ matrix.os }}, ${{ matrix.stack }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, wsl2]
        stack: [personal, local]
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            guest: linux
            platform: linux-x64
          - os: macos-14
            runner: xcode-27
            guest: macos
            platform: darwin-arm64
          # Required check names with no work behind them (scripts/ci_paths.py plans NOT RUN), on Ubuntu so they
          # hold no macOS or Windows slot.
          - os: macos-14
            stack: personal
            runner: ubuntu-24.04
            guest: linux
          - os: wsl2
            runner: ubuntu-24.04
            guest: linux
            platform: linux-x64
    runs-on: ${{ !fromJSON(needs.classify.outputs.plan || '{}')[format('stack ({0}, {1})', matrix.os, matrix.stack)].run && 'ubuntu-24.04' || fromJSON(needs.classify.outputs.plan || '{}')[format('stack ({0}, {1})', matrix.os, matrix.stack)].runner || matrix.runner }}
    defaults:
      run:
        shell: bash -e {0}
    timeout-minutes: 40
    steps:
      # The plan step lives in a local action, so a sparse checkout of `.github/actions` comes first. The full
      # checkout below runs only when the plan says the cell runs.
      - name: Check out the local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: plan
        name: Report execution plan
        uses: ./.github/actions/report-plan
        with:
          cell: ${{ format('stack ({0}, {1})', matrix.os, matrix.stack) }}
          plan: ${{ needs.classify.outputs.plan }}
          classify_result: ${{ needs.classify.result }}
          changed_files: ${{ needs.classify.outputs.changed_files }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.plan.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        id: tools
        if: steps.plan.outputs.run == 'true'
        with:
          guest: ${{ matrix.guest }}
      - name: Initialize the core fork at its Gitlink
        if: steps.plan.outputs.run == 'true'
        run: git submodule update --init forks/pi
      - name: Install tmux (Linux)
        if: steps.plan.outputs.run == 'true' && runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          # The runner image usually ships tmux; skip apt entirely then (#655).
          command -v tmux >/dev/null && exit 0
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120 install --yes tmux
      - name: Install tmux (macOS)
        if: steps.plan.outputs.run == 'true' && runner.os == 'macOS'
        run: command -v tmux >/dev/null || brew install tmux
      - name: Verify root core overrides before install
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=integration python3 -m harness.release --verify-root-overrides --root .
      - name: Install workspace and harness dependencies
        id: workspace
        if: steps.plan.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts
          cd integration && uv sync --locked --python "$(tr -d '\n' < ../.python-version)"
      - name: Fetch exact Gitlinked core release, formula-equivalent install
        if: steps.plan.outputs.run == 'true'
        working-directory: integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C ../forks/pi fetch --tags origin
          uv run --locked python -m harness.release --gitlink ../forks/pi --prefix "$RUNNER_TEMP/pi-release"
          echo "PI_BIN=$RUNNER_TEMP/pi-release/bin/pi" >>"$GITHUB_ENV"
      - name: Report binary identity
        if: steps.plan.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/version-home" "$RUNNER_TEMP/version-agent"
          HOME="$RUNNER_TEMP/version-home" PI_CODING_AGENT_DIR="$RUNNER_TEMP/version-agent" "$PI_BIN" --version
          git -C forks/pi describe --tags --exact-match
      - name: Replay source-selected installer runtime locks without lifecycle scripts
        if: steps.plan.outputs.scenarios == 'true' && matrix.stack == 'personal'
        working-directory: integration
        run: uv run --locked python -m harness.runtime_lock --stack stacks/personal.json --replay stacks/runtime-locks.json
      - name: Assembled D and E boundaries (explicit stack, no machine config)
        if: steps.plan.outputs.scenarios == 'true'
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack "stacks/${{ matrix.stack }}.json" -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml="artifacts/stack-${{ matrix.stack }}.xml"
      - name: Report installed package identities and stack digests
        if: always() && steps.plan.outputs.run == 'true'
        working-directory: integration
        run: |
          uv run --locked python -c 'from pathlib import Path; [print(p.read_text()) for p in sorted(Path("artifacts").glob("stack-*.json"))]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.plan.outputs.run == 'true'
        with:
          name: stack-${{ matrix.os }}-${{ matrix.stack }}
          path: integration/artifacts/
          if-no-files-found: ignore
      # Each cell builds the core and runs only its own stack, so macOS keeps standalone evidence in `local`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ !cancelled() && steps.plan.outputs.scenarios == 'true' && steps.workspace.outcome == 'success' }}
        with:
          bun-version-file: .bun-version
      - name: Preserve Node failure artifacts before standalone runs
        if: ${{ always() && steps.plan.outputs.scenarios == 'true' }}
        working-directory: integration
        run: |
          if [ -d artifacts ]; then mv artifacts artifacts-node; fi
      - name: Build standalone
        id: build
        if: ${{ !cancelled() && steps.plan.outputs.scenarios == 'true' && steps.workspace.outcome == 'success' }}
        working-directory: forks/pi
        run: |
          npm ci --ignore-scripts
          # Same frozen data as forks.yml, never the live model fetch.
          version=$(node -p 'require("./packages/ai/package.json").version')
          mkdir -p "$RUNNER_TEMP/model-data"
          npm pack "@earendil-works/pi-ai@$version" --pack-destination "$RUNNER_TEMP/model-data"
          tar -xzf "$RUNNER_TEMP/model-data/earendil-works-pi-ai-$version.tgz" -C "$RUNNER_TEMP/model-data"
          rm -rf packages/ai/src/providers/data
          cp -R "$RUNNER_TEMP/model-data/package/dist/providers/data" packages/ai/src/providers/data
          # Observe Bun's compile argv/module graph without changing core sources or build flags.
          PYTHONPATH=../../integration ../../integration/.venv/bin/python -m harness.standalone_diagnostics \
            prepare-build --directory "$RUNNER_TEMP/pi-build-evidence"
          set -o pipefail
          evidence="$RUNNER_TEMP/pi-build-evidence"
          # One function, so both builds run the identical wrapped command; the wrapper overwrites its evidence.
          build_standalone() {
            PATH="$evidence/bin:$PATH" \
              ./scripts/build-binaries.sh --skip-install --offline-model-data \
              --platform "${{ matrix.platform }}" --out "$RUNNER_TEMP/pi-standalone" 2>&1 | tee "$evidence/build.log"
          }
          # Park the first build's evidence and executable under first/ so failures are labelled correctly.
          keep_first_build() {
            mkdir -p "$evidence/first"
            for name in build.log compile-command.json module-graph.json; do
              if [ -e "$evidence/$name" ]; then mv "$evidence/$name" "$evidence/first/$name"; fi
            done
            if [ -f "$RUNNER_TEMP/pi-standalone/${{ matrix.platform }}/pi" ]; then
              mv "$RUNNER_TEMP/pi-standalone/${{ matrix.platform }}/pi" "$RUNNER_TEMP/pi-first-build"
            fi
          }
          build_standalone || { keep_first_build; exit 1; }
          # Rebuild the same inputs at the same output path: Bun must emit identical bytes (#72).
          keep_first_build
          build_standalone
          # Evidence at the root now describes the second build, i.e. the executable exported as PI_BIN.
          cmp "$evidence/first/compile-command.json" "$evidence/compile-command.json"
          PYTHONPATH=../../integration ../../integration/.venv/bin/python -m harness.standalone_diagnostics \
            verify-reproducible --first "$RUNNER_TEMP/pi-first-build" \
            --second "$RUNNER_TEMP/pi-standalone/${{ matrix.platform }}/pi" \
            --digest-out ../../integration/artifacts/standalone-pi.sha256
          echo "PI_BIN=$RUNNER_TEMP/pi-standalone/${{ matrix.platform }}/pi" >>"$GITHUB_ENV"
      - name: Scan standalone build failure evidence
        id: build_failure
        if: ${{ !cancelled() && steps.build.outcome == 'failure' }}
        working-directory: integration
        run: |
          uv run --locked python -m harness.standalone_diagnostics collect-build-failure \
            --evidence "$RUNNER_TEMP/pi-build-evidence" --first "$RUNNER_TEMP/pi-first-build" \
            --second "$RUNNER_TEMP/pi-standalone/${{ matrix.platform }}/pi" \
            --output "$RUNNER_TEMP/standalone-build-failure" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.build.outcome == 'failure' && steps.build_failure.outputs.artifact_ready == 'true' }}
        with:
          name: standalone-build-failure-${{ matrix.platform }}-${{ matrix.stack }}
          path: ${{ runner.temp }}/standalone-build-failure/
          if-no-files-found: warn
          retention-days: 7
      - name: Report standalone binary and source identity
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/version-home" "$RUNNER_TEMP/version-agent"
          HOME="$RUNNER_TEMP/version-home" PI_CODING_AGENT_DIR="$RUNNER_TEMP/version-agent" "$PI_BIN" --version
          git -C forks/pi rev-parse HEAD
          bun --version
          shasum -a 256 "$PI_BIN" "$RUNNER_TEMP/pi-standalone/pi-${{ matrix.platform }}.tar.gz"
      - name: Strict standalone startup with failure-only diagnostics
        id: startup
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' && matrix.platform == 'linux-x64' && matrix.stack == 'personal' }}
        working-directory: integration
        run: |
          uv run --locked python -m harness.standalone_diagnostics startup \
            --binary "$PI_BIN" --core ../forks/pi \
            --build-evidence "$RUNNER_TEMP/pi-build-evidence" \
            --output "$RUNNER_TEMP/standalone-startup-diagnostics" --github-output "$GITHUB_OUTPUT"
      - name: Upload scanned standalone startup failure evidence
        if: ${{ !cancelled() && steps.startup.outcome == 'failure' && steps.startup.outputs.artifact_ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-startup-linux-x64
          path: ${{ runner.temp }}/standalone-startup-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Standalone D and E (personal)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' && matrix.stack == 'personal' }}
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack stacks/personal.json --runtime bun-standalone -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml=artifacts/standalone-personal.xml
      - name: Standalone D and E (local)
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' && steps.build.outcome == 'success' && matrix.stack == 'local' }}
        working-directory: integration
        run: |
          uv run --locked pytest scenarios/test_*.py scenarios/tui/test_footer_resize.py \
            --stack stacks/local.json --runtime bun-standalone -m stack -n 2 --dist loadfile \
            --log-cli-level=INFO --junitxml=artifacts/standalone-local.xml
      - name: Report coverage exclusions
        if: ${{ always() && steps.plan.outputs.scenarios == 'true' }}
        shell: bash -e {0}
        run: |
          echo "Bun standalone: default D/E runs the auth transport cases through the BUN_OPTIONS preload adapter, no skips (#14); consult the step outcome and JUnit, not this notice, for evidence." >>"$GITHUB_STEP_SUMMARY"
          echo "linux-arm64, packed contracts under standalone, bench, live credentials and desktop helpers: NOT RUN." >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.plan.outputs.scenarios == 'true' }}
        with:
          name: standalone-${{ matrix.platform }}-${{ matrix.stack }}
          path: integration/artifacts/
          if-no-files-found: ignore
