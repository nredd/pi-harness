name: Publish coverage

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: Publish PR coverage
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: coverage-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run's github.sha is on the default branch, not the triggering run's head.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check run provenance and publish coverage
        shell: bash -e {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/coverage_publish.py

  snapshot:
    name: Record measured main coverage
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    concurrency:
      group: coverage-main-snapshot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Store the measured main snapshot
        shell: bash -e {0}
        env:
          COVERAGE_SNAPSHOT: '1'
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/coverage_publish.py
