name: Promote stack

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main SHA
        required: false
        type: string
      operation:
        description: Verify, promote, or explicitly roll back a retained snapshot
        required: true
        default: verify-only
        type: choice
        options: [verify-only, promote, rollback]
      rollback_tag:
        description: "Required only for rollback: stack/<40 lowercase hexadecimal characters>"
        required: false
        type: string

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: stack-promotion
  cancel-in-progress: false

permissions: {}

env:
  PROMO: ${{ github.workspace }}/promotion
  ATTEST_WORKFLOW: ${{ github.repository }}/.github/workflows/promote-stack.yml

jobs:
  # Read-only: runs only trusted `main` code plus data from the selected commit. It never holds
  # `id-token`, `attestations` or a credential that can write.
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      source_sha: ${{ steps.target.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install harness
        run: cd integration && uv sync --locked
      - id: target
        name: Validate inputs and ancestry
        env:
          OPERATION: ${{ inputs.operation }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          promo() { uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion "$@"; }
          mkdir -p "$PROMO"
          promo select --operation "$OPERATION" --source-sha "$REQUESTED_SHA" --rollback-tag "$ROLLBACK_TAG" >"$PROMO/select.json"
          sha=$(jq -r . "$PROMO/select.json")
          git fetch origin main
          git cat-file -e "$sha^{commit}"
          promo ancestor --repo "$GITHUB_WORKSPACE" --ancestor "$sha" --descendant origin/main
          echo "source_sha=$sha" >>"$GITHUB_OUTPUT"

      # Rollback: re-verify a retained, attested snapshot.
      - name: Verify retained snapshot
        if: inputs.operation == 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          promo() { uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion "$@"; }
          gh release download "$ROLLBACK_TAG" --repo "$GITHUB_REPOSITORY" --pattern stack-snapshot.json --dir "$PROMO" --clobber
          gh attestation verify "$PROMO/stack-snapshot.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$ATTEST_WORKFLOW" --source-ref refs/heads/main --deny-self-hosted-runners
          promo verify --snapshot "$PROMO/stack-snapshot.json" --source-sha "$SOURCE_SHA"

      # Promote / verify-only: gather evidence for the exact selected SHA.
      - name: Read required checks
        if: inputs.operation != 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          RULES_TOKEN: ${{ secrets.STACK_PROMOTION_RULES_TOKEN }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/rules/branches/main" >"$PROMO/rules.json" \
            || { echo '::error::Cannot read main branch rules with GITHUB_TOKEN'; exit 1; }
          if [ -n "$RULES_TOKEN" ]; then
            GH_TOKEN=$RULES_TOKEN gh api "repos/$GITHUB_REPOSITORY/branches/main/protection/required_status_checks" >"$PROMO/protection.json" \
              || { echo '::error::STACK_PROMOTION_RULES_TOKEN cannot read branch protection (needs read-only Administration)'; exit 1; }
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100" >"$PROMO/check-pages.json" \
            || { echo '::error::Cannot read check runs; the job needs checks read'; exit 1; }
      - name: Read CI runs
        if: inputs.operation != 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          mkdir -p "$PROMO/jobs"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SOURCE_SHA" --limit 100 \
            --json databaseId,status,conclusion,event,headBranch,headSha >"$PROMO/runs.json" \
            || { echo '::error::Cannot read workflow runs; the job needs actions read'; exit 1; }
          for run in $(jq -r '.[].databaseId' "$PROMO/runs.json"); do
            gh run view "$run" --repo "$GITHUB_REPOSITORY" --json jobs >"$PROMO/jobs/run-$run.json"
          done
      - name: Verify gates and build candidate snapshot
        if: inputs.operation != 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          promo() { uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion "$@"; }
          git show "$SOURCE_SHA:integration/stacks/personal.json" >"$PROMO/personal.json"
          protection=()
          if [ -f "$PROMO/protection.json" ]; then protection=(--protection "$PROMO/protection.json"); fi
          promo checks --rules "$PROMO/rules.json" "${protection[@]}" --check-pages "$PROMO/check-pages.json" --source-sha "$SOURCE_SHA" >"$PROMO/checks.json"
          promo stack-runs --runs "$PROMO/runs.json" --jobs-dir "$PROMO/jobs" --source-sha "$SOURCE_SHA" >"$PROMO/stack-runs.json"
          promo core --stack "$PROMO/personal.json" >"$PROMO/core.json"
          promo owned-tags --stack "$PROMO/personal.json" >"$PROMO/owned-tags.json"
          mkdir -p "$PROMO/owned"
          n=0
          for tag in $(jq -r '.[]' "$PROMO/owned-tags.json"); do
            n=$((n + 1))
            git worktree add --detach "$RUNNER_TEMP/pkg-$n" "refs/tags/$tag"
            uv run --locked --project integration python scripts/npm_release.py stack-check --tag "$tag" --repo-root "$RUNNER_TEMP/pkg-$n" >"$PROMO/owned/owned-$n.json"
          done
          promo gates --stack "$PROMO/personal.json" --checks "$PROMO/checks.json" --stack-runs "$PROMO/stack-runs.json" --owned-dir "$PROMO/owned" --core "$PROMO/core.json" --output "$PROMO/gates.json"
          promo build --stack "$PROMO/personal.json" --source-sha "$SOURCE_SHA" --gates "$PROMO/gates.json" --output "$PROMO/stack-snapshot.json"
      - name: Verify successor of the attested stable pointer
        if: inputs.operation == 'promote' || inputs.operation == 'verify-only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          promo() { uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion "$@"; }
          count=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/stack-channel" --jq '[.[] | select(.ref == "refs/heads/stack-channel")] | length')
          stable=()
          if [ "$count" -gt 0 ]; then
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/stable.json?ref=stack-channel" >"$PROMO/stable.json"
            gh attestation verify "$PROMO/stable.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$ATTEST_WORKFLOW" --source-ref refs/heads/main --deny-self-hosted-runners
            stable=(--stable "$PROMO/stable.json")
          fi
          promo successor --candidate "$PROMO/stack-snapshot.json" "${stable[@]}" --repo "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.operation != 'verify-only'
        with:
          name: stack-snapshot-${{ steps.target.outputs.source_sha }}
          path: promotion/stack-snapshot.json
          if-no-files-found: error

  # Holds the write credentials but runs no code from the selected commit and installs no
  # dependencies: it only downloads the verified artifact, attests, and publishes.
  attest-and-publish:
    if: github.ref == 'refs/heads/main' && inputs.operation != 'verify-only'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: stack-promotion
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stack-snapshot-${{ needs.verify.outputs.source_sha }}
          path: promotion
      - id: release
        name: Look for an existing snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          if gh release view "stack/$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        if: inputs.operation == 'promote' && steps.release.outputs.exists != 'true'
        with:
          subject-path: promotion/stack-snapshot.json
      - name: Create or confirm the immutable release
        if: inputs.operation == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTS: ${{ steps.release.outputs.exists }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          tag="stack/$SOURCE_SHA"
          if [ "$EXISTS" = true ]; then
            # Resume: only the pointer push failed. The existing attested snapshot must equal the rebuilt one.
            mkdir -p existing
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern stack-snapshot.json --dir existing --clobber
            gh attestation verify existing/stack-snapshot.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$ATTEST_WORKFLOW" --source-ref refs/heads/main --deny-self-hosted-runners
            cmp existing/stack-snapshot.json promotion/stack-snapshot.json \
              || { echo "::error::Existing '$tag' snapshot differs from the rebuilt one; refusing. Roll back to it or investigate."; exit 1; }
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "$tag" --notes 'Verified promoted stack snapshot.' promotion/stack-snapshot.json
          fi
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
          test "$tagged" = "$SOURCE_SHA" || { echo "::error::Tag '$tag' points at '$tagged', not '$SOURCE_SHA'"; exit 1; }
      - name: Advance the stack-channel pointer
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.STACK_CHANNEL_DEPLOY_KEY }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          test -n "$DEPLOY_KEY" || { echo '::error::STACK_CHANNEL_DEPLOY_KEY (write deploy key, ruleset bypass actor) is required to push stack-channel'; exit 1; }
          key="$RUNNER_TEMP/stack-channel-key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" >"$key")
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >"$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          remote="git@github.com:$GITHUB_REPOSITORY.git"
          rc=0
          git ls-remote --exit-code --heads "$remote" stack-channel >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch "$remote" stack-channel:refs/remotes/origin/stack-channel
            git switch -C stack-channel-next origin/stack-channel
          elif [ "$rc" -eq 2 ]; then
            git switch --orphan stack-channel-next
          else
            echo '::error::Could not list stack-channel over SSH'; exit 1
          fi
          git rm -rf --ignore-unmatch . >/dev/null
          cp promotion/stack-snapshot.json stable.json
          git add stable.json
          if git diff --cached --quiet; then
            echo 'stack-channel already points at this snapshot'
            exit 0
          fi
          git -c user.name=stack-promotion -c user.email=stack-promotion@users.noreply.github.com commit -m "Advance stable stack to $SOURCE_SHA"
          git push "$remote" HEAD:refs/heads/stack-channel
