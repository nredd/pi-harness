# Explicitly promotes one already-gated main commit. See docs/stack-promotion.md.
name: Promote stack

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main SHA
        required: false
        type: string
      operation:
        description: Verify, promote, or explicitly roll back a retained snapshot
        required: true
        default: verify-only
        type: choice
        options: [verify-only, promote, rollback]
      rollback_tag:
        description: "Required only for rollback: stack/<40 lowercase hexadecimal characters>"
        required: false
        type: string

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: stack-promotion
  cancel-in-progress: false

permissions: {}

env:
  PROMO: ${{ github.workspace }}/promotion
  ATTEST_WORKFLOW: ${{ github.repository }}/.github/workflows/promote-stack.yml

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      source_sha: ${{ steps.target.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install harness
        run: cd integration && uv sync --locked
      - id: target
        name: Validate inputs and ancestry
        env:
          OPERATION: ${{ inputs.operation }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          mkdir -p "$PROMO"
          uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion select --operation "$OPERATION" --source-sha "$REQUESTED_SHA" --rollback-tag "$ROLLBACK_TAG" --github-output "$GITHUB_OUTPUT"
          git fetch origin main
          uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion ancestor --repo "$GITHUB_WORKSPACE" --ancestor "${{ steps.target.outputs.source_sha }}" --descendant origin/main

      - name: Verify retained snapshot
        if: inputs.operation == 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          gh release download "$ROLLBACK_TAG" --repo "$GITHUB_REPOSITORY" --pattern stack-snapshot.json --dir "$PROMO" --clobber
          gh attestation verify "$PROMO/stack-snapshot.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$ATTEST_WORKFLOW" --source-ref refs/heads/main --deny-self-hosted-runners
          uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion verify --snapshot "$PROMO/stack-snapshot.json" --source-sha "$SOURCE_SHA"

      - name: Read required checks
        if: inputs.operation != 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/rules/branches/main" >"$PROMO/rules.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100" >"$PROMO/check-pages.json"
      - name: Read CI artifacts
        if: inputs.operation != 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          mkdir -p "$PROMO/artifacts"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SOURCE_SHA" --limit 100 --json databaseId,status,conclusion,event,headBranch,headSha >"$PROMO/runs.json"
          uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion fetch-artifacts --runs "$PROMO/runs.json" --source-sha "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" --output-dir "$PROMO/artifacts"
      - name: Verify gates and build candidate snapshot
        if: inputs.operation != 'rollback'
        env:
          SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          git show "$SOURCE_SHA:integration/stacks/personal.json" >"$PROMO/personal.json"
          uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion checks --rules "$PROMO/rules.json" --check-pages "$PROMO/check-pages.json" --source-sha "$SOURCE_SHA" >"$PROMO/checks.json"
          uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion stack-runs --runs "$PROMO/runs.json" --artifacts-dir "$PROMO/artifacts" --source-sha "$SOURCE_SHA" >"$PROMO/stack-runs.json"
          uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion core --stack "$PROMO/personal.json" --workdir "$RUNNER_TEMP/core" >"$PROMO/core.json"
          uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion owned-evidence --stack "$PROMO/personal.json" --repo "$GITHUB_WORKSPACE" --workdir "$RUNNER_TEMP/packages" --output "$PROMO/owned.json"
          uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion gates --stack "$PROMO/personal.json" --checks "$PROMO/checks.json" --stack-runs "$PROMO/stack-runs.json" --owned "$PROMO/owned.json" --core "$PROMO/core.json" --output "$PROMO/gates.json"
          uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion build --stack "$PROMO/personal.json" --source-sha "$SOURCE_SHA" --gates "$PROMO/gates.json" --output "$PROMO/stack-snapshot.json"
      - id: channel
        name: Read stack-channel state
        if: inputs.operation == 'promote' || inputs.operation == 'verify-only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/stack-channel" >"$PROMO/refs.json"
          uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion channel-exists --refs "$PROMO/refs.json" --github-output "$GITHUB_OUTPUT"
      - name: Fetch and attest the stable pointer
        if: (inputs.operation == 'promote' || inputs.operation == 'verify-only') && steps.channel.outputs.channel_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/stable.json?ref=stack-channel" >"$PROMO/stable.json"
          gh attestation verify "$PROMO/stable.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$ATTEST_WORKFLOW" --source-ref refs/heads/main --deny-self-hosted-runners
      - name: Verify successor of the attested stable pointer
        if: inputs.operation == 'promote' || inputs.operation == 'verify-only'
        run: uv run --locked --directory "$GITHUB_WORKSPACE/integration" python -m harness.promotion successor --candidate "$PROMO/stack-snapshot.json" --refs "$PROMO/refs.json" --stable "$PROMO/stable.json" --repo "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.operation != 'verify-only'
        with:
          name: stack-snapshot-${{ steps.target.outputs.source_sha }}
          path: promotion/stack-snapshot.json
          if-no-files-found: error

  attest-and-publish:
    if: github.ref == 'refs/heads/main' && inputs.operation != 'verify-only'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: stack-promotion
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stack-snapshot-${{ needs.verify.outputs.source_sha }}
          path: promotion
      - id: release
        name: Validate existing snapshot release and tag
        if: inputs.operation == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: PYTHONPATH="$GITHUB_WORKSPACE/integration" python3 -m harness.publish_gate prepare-release --repo "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" --rebuilt promotion/stack-snapshot.json --existing-dir existing --github-output "$GITHUB_OUTPUT"
      - name: Verify the existing snapshot attestation
        if: inputs.operation == 'promote' && steps.release.outputs.state == 'resume'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify existing/stack-snapshot.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$ATTEST_WORKFLOW" --source-ref refs/heads/main --deny-self-hosted-runners
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        if: inputs.operation == 'promote' && steps.release.outputs.state == 'create'
        with:
          subject-path: promotion/stack-snapshot.json
      - name: Create the immutable release
        if: inputs.operation == 'promote' && steps.release.outputs.state == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: gh release create "stack/$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "stack/$SOURCE_SHA" --notes 'Verified promoted stack snapshot.' promotion/stack-snapshot.json
      - name: Confirm the tag points at the selected commit
        if: inputs.operation == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/stack/$SOURCE_SHA" >"$RUNNER_TEMP/tag-ref.json"
          PYTHONPATH="$GITHUB_WORKSPACE/integration" python3 -m harness.publish_gate tag-target --ref "$RUNNER_TEMP/tag-ref.json" --source-sha "$SOURCE_SHA"
      - name: Advance the stack-channel pointer
        env:
          DEPLOY_KEY: ${{ secrets.STACK_CHANNEL_DEPLOY_KEY }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: PYTHONPATH="$GITHUB_WORKSPACE/integration" python3 -m harness.publish_gate advance-channel --repo "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" --snapshot promotion/stack-snapshot.json --deploy-key-env DEPLOY_KEY --temp-dir "$RUNNER_TEMP"
