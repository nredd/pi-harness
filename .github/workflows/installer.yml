---
# Real one-shot installer acceptance (docs/install.md) against a published `stack/<sha>`.
# It runs the documented `uvx` command from this exact commit in throwaway HOMEs. Not a required
# check; it runs only when the installer, the harness modules it or `conftest.py` imports, or its
# toolchain pins change. `test_installer_workflow_covers_its_inputs` keeps both path lists complete.
name: Installer

'on':
  pull_request:
    paths:
      - integration/harness/install_paths.py
      - integration/harness/credentials.py
      - integration/harness/files.py
      - .github/workflows/installer.yml
      - .node-version
      - integration/Makefile
      - integration/conftest.py
      - integration/harness/__init__.py
      - integration/harness/install.py
      - integration/harness/interactive.py
      - integration/harness/isolation.py
      - integration/harness/paths.py
      - integration/harness/power.py
      - integration/harness/promotion.py
      - integration/harness/release.py
      - integration/harness/sandbox.py
      - integration/harness/stack.py
      - integration/harness/tmux.py
      - integration/pyproject.toml
      - integration/scenarios/installer/**
      - integration/uv.lock
  push:
    branches: [main]
    paths:
      - integration/harness/install_paths.py
      - integration/harness/credentials.py
      - integration/harness/files.py
      - .github/workflows/installer.yml
      - .node-version
      - integration/Makefile
      - integration/conftest.py
      - integration/harness/__init__.py
      - integration/harness/install.py
      - integration/harness/interactive.py
      - integration/harness/isolation.py
      - integration/harness/paths.py
      - integration/harness/power.py
      - integration/harness/promotion.py
      - integration/harness/release.py
      - integration/harness/sandbox.py
      - integration/harness/stack.py
      - integration/harness/tmux.py
      - integration/pyproject.toml
      - integration/scenarios/installer/**
      - integration/uv.lock
  workflow_dispatch:
    inputs:
      stack_sha:
        description: Promoted `stack/<sha>` to install
        required: false
        default: 24889f7896be7157bf9077a41465a3b29620879f

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  installer:
    name: installer (${{ matrix.os }})
    permissions:
      contents: read
      attestations: read # Required by the attestations API used by `gh`'s fallback.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install harness dependencies
        working-directory: integration
        run: uv sync --locked
      # TRUST assumption: same-repo branches are owner-reviewed; their authors could change this
      # workflow to request writes or secrets; these permissions constrain this submitted workflow,
      # not arbitrary same-repo PR code. Fork PRs and non-main dispatches stay anonymous.
      # Only this login step sees the token. Acceptance uses a gh-only config shim, so make,
      # pytest, uvx, Git and package builds never inherit its environment value. The PATH shim
      # still grants same-UID package code the login capability (KNOWN RESIDUAL in docs/ci.md).
      # Hosted IPs share the anonymous
      # 60 requests/hour limit. `test_installer_workflow_token_policy` pins the expression.
      - name: Authenticate gh attestation fallback
        env:
          GH_TOKEN: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')) && github.token || '' }}
          GH_CONFIG_DIR: ${{ runner.temp }}/installer-gh
        run: |
          if [ -n "$GH_TOKEN" ]; then
            printf '%s' "$GH_TOKEN" | env -u GH_TOKEN gh auth login --hostname github.com --with-token --insecure-storage
          fi
      - name: Run the documented one-shot command in throwaway HOMEs
        env:
          INSTALLER_GH_CONFIG_DIR: ${{ runner.temp }}/installer-gh
          INSTALLER_SPEC: git+https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}@${{ github.event.pull_request.head.sha || github.sha }}#subdirectory=integration
          STACK_SHA: ${{ inputs.stack_sha || '24889f7896be7157bf9077a41465a3b29620879f' }}
        run: make -C integration installer
      - name: Remove temporary gh login
        if: always()
        env:
          GH_CONFIG_DIR: ${{ runner.temp }}/installer-gh
        run: rm -rf -- "$GH_CONFIG_DIR"
