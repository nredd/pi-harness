---
# Real one-shot installer acceptance (docs/install.md) against a published `stack/<sha>`.
# It runs the documented `uvx` command from this exact commit in throwaway HOMEs. Not a required
# check; it runs only when the installer, the harness modules it or `conftest.py` imports, or its
# toolchain pins change. `test_installer_workflow_covers_its_inputs` keeps both path lists complete.
name: Installer

'on':
  pull_request:
    paths:
      - integration/harness/runtime_lock.py
      - integration/stacks/runtime-locks.json
      - integration/tests/test_runtime_lock.py
      - integration/harness/install_paths.py
      - integration/harness/credentials.py
      - integration/harness/files.py
      - .github/workflows/installer.yml
      - .node-version
      - integration/Makefile
      - integration/conftest.py
      - integration/harness/__init__.py
      - integration/harness/install.py
      - integration/harness/interactive.py
      - integration/harness/isolation.py
      - integration/harness/paths.py
      - integration/harness/power.py
      - integration/harness/process_group.py
      - integration/harness/promotion.py
      - integration/harness/release.py
      - integration/harness/sandbox.py
      - integration/harness/stack.py
      - integration/harness/tmux.py
      - integration/pyproject.toml
      - integration/scenarios/installer/**
      - integration/uv.lock
  push:
    branches: [main]
    paths:
      - integration/harness/runtime_lock.py
      - integration/stacks/runtime-locks.json
      - integration/tests/test_runtime_lock.py
      - integration/harness/install_paths.py
      - integration/harness/credentials.py
      - integration/harness/files.py
      - .github/workflows/installer.yml
      - .node-version
      - integration/Makefile
      - integration/conftest.py
      - integration/harness/__init__.py
      - integration/harness/install.py
      - integration/harness/interactive.py
      - integration/harness/isolation.py
      - integration/harness/paths.py
      - integration/harness/power.py
      - integration/harness/process_group.py
      - integration/harness/promotion.py
      - integration/harness/release.py
      - integration/harness/sandbox.py
      - integration/harness/stack.py
      - integration/harness/tmux.py
      - integration/pyproject.toml
      - integration/scenarios/installer/**
      - integration/uv.lock
  workflow_dispatch:
    inputs:
      stack_sha:
        description: Promoted `stack/<sha>` to install
        required: false
        default: 24889f7896be7157bf9077a41465a3b29620879f

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Policy: Installer acceptance and residual credential capability
  # `.github/workflows/installer.yml`, PRs and `main` pushes that change the installer or the harness modules it reuses, plus manual dispatch with a `stack_sha`:
  #
  # | Job | Runs | Proves |
  # | --- | --- | --- |
  # | `installer (ubuntu-24.04, xcode-27)` | `make -C integration installer` with `INSTALLER_SPEC` set to this exact commit (`git+https://...@<sha>#subdirectory=integration`) and `STACK_SHA` the published promotion. The installer reads no token. On `main` pushes/dispatches and owner-reviewed same-repo pull requests (`head.repo.full_name == github.repository`), `GH_TOKEN` is set for the fallback when hosted runner IPs hit GitHub's anonymous 60 requests/hour limit. Job permissions are only `contents: read` and `attestations: read` (needed to fetch attestations); no write permissions are granted. Only the separate `Authenticate gh attestation fallback` step sees `GH_TOKEN`: it pipes the token to `gh auth login --with-token --insecure-storage` with `GH_TOKEN` unset in that child and a temporary `GH_CONFIG_DIR`. `--insecure-storage` deliberately confines the ephemeral login to that private plaintext config rather than an OS keychain, so removing the directory removes the login. `make` and pytest receive only the nonsecret directory path (`INSTALLER_GH_CONFIG_DIR`), not a token. Acceptance wraps `gh` alone to set `GH_CONFIG_DIR` to that path; `uvx`, Git, package builds and other installer children receive neither variable nor token. An always-running cleanup removes the login directory. Fork PRs and non-main dispatches stay anonymous and fail if the limit refuses them (`test_installer_workflow_token_policy` pins and evaluates the expression; `test_installer_workflow_token_permissions_are_read_only` pins permissions and checkout credential stripping). Triggers cover the installer's `harness` import closure, `conftest.py`, `.node-version`, `Makefile`, `pyproject.toml` and `uv.lock` (checked by `test_installer_workflow_covers_its_inputs`). | The documented one-shot `uvx` command in throwaway HOMEs: missing prerequisites, an unpromoted SHA, real `gh` rejecting tampered bytes and a foreign signer/ref, a fresh install equal to the snapshot (order, filters, disabled computer-use, owned npm integrity), a no-op rerun, consent and preservation with an existing setup, and a SIGKILL during staging then a clean rerun. See [install](../../docs/install.md). |
  #
  # TRUST assumption: same-repo PR branches are owner-reviewed code. Same-repo `pull_request` workflows are not fork-sandboxed: a branch author can edit the PR's workflow to request write permissions or reference secrets. The read-only block constrains this submitted workflow only; it is not a security boundary against arbitrary same-repo PR code. KNOWN RESIDUAL: same-UID package code inherits the PATH-prepended `gh` shim through `uvx`, the installer, `pi install`, npm/package scripts and Git children that preserve PATH. `make`/pytest also receive `INSTALLER_GH_CONFIG_DIR`; stripping it and the token variables from other child environments does not remove the capability. A child can invoke the shim to authenticate or read its embedded config path and plaintext `hosts.yml`. This is known credential-capability leakage, not merely a theoretical filesystem permission concern. It remains within the same-repo trust assumption: the submitted job token is read-only, but branch authors already control their workflow. No claim of package-script credential isolation is made. The sentinel subprocess test `test_acceptance_token_environment_is_clean_but_gh_capability_remains` demonstrates both clean environments and successful same-UID credential retrieval using the real CLI and a real-format `hosts.yml`.
  #
  # It is not a required check and has no docs-only bypass; it only starts when its paths change.

  installer:
    name: installer (${{ matrix.os }})
    permissions:
      contents: read
      attestations: read # Required by the attestations API used by `gh`'s fallback.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No `npm ci` in this job; setup-node's implicit cache would save an empty npm cache (#531).
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install harness dependencies
        working-directory: integration
        run: uv sync --locked
      # TRUST assumption: same-repo branches are owner-reviewed; their authors could change this
      # workflow to request writes or secrets; these permissions constrain this submitted workflow,
      # not arbitrary same-repo PR code. Fork PRs and non-main dispatches stay anonymous.
      # Only this login step sees the token. Acceptance uses a gh-only config shim, so make,
      # pytest, uvx, Git and package builds never inherit its environment value. The PATH shim
      # still grants same-UID package code the login capability (KNOWN RESIDUAL policy above).
      # Hosted IPs share the anonymous
      # 60 requests/hour limit. `test_installer_workflow_token_policy` pins the expression.
      - name: Authenticate gh attestation fallback
        env:
          GH_TOKEN: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')) && github.token || '' }}
          GH_CONFIG_DIR: ${{ runner.temp }}/installer-gh
        run: |
          if [ -n "$GH_TOKEN" ]; then
            printf '%s' "$GH_TOKEN" | env -u GH_TOKEN gh auth login --hostname github.com --with-token --insecure-storage
          fi
      - name: Run the documented one-shot command in throwaway HOMEs
        env:
          INSTALLER_GH_CONFIG_DIR: ${{ runner.temp }}/installer-gh
          INSTALLER_SPEC: git+https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}@${{ github.event.pull_request.head.sha || github.sha }}#subdirectory=integration
          STACK_SHA: ${{ inputs.stack_sha || '24889f7896be7157bf9077a41465a3b29620879f' }}
        run: make -C integration installer
      - name: Remove temporary gh login
        if: always()
        env:
          GH_CONFIG_DIR: ${{ runner.temp }}/installer-gh
        run: rm -rf -- "$GH_CONFIG_DIR"
