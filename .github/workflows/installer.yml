---
# Real one-shot installer acceptance (docs/install.md) against a published `stack/<sha>`.
# It runs the documented `uvx` command from this exact commit in throwaway HOMEs. Not a required
# check; it runs only when the installer, the harness modules it or `conftest.py` imports, or its
# toolchain pins change. `test_installer_workflow_covers_its_inputs` keeps both path lists complete.
name: Installer

'on':
  pull_request:
    paths:
      - integration/harness/files.py
      - .github/workflows/installer.yml
      - .node-version
      - integration/Makefile
      - integration/conftest.py
      - integration/harness/__init__.py
      - integration/harness/install.py
      - integration/harness/interactive.py
      - integration/harness/isolation.py
      - integration/harness/paths.py
      - integration/harness/power.py
      - integration/harness/promotion.py
      - integration/harness/release.py
      - integration/harness/sandbox.py
      - integration/harness/stack.py
      - integration/harness/tmux.py
      - integration/pyproject.toml
      - integration/scenarios/installer/**
      - integration/uv.lock
  push:
    branches: [main]
    paths:
      - integration/harness/files.py
      - .github/workflows/installer.yml
      - .node-version
      - integration/Makefile
      - integration/conftest.py
      - integration/harness/__init__.py
      - integration/harness/install.py
      - integration/harness/interactive.py
      - integration/harness/isolation.py
      - integration/harness/paths.py
      - integration/harness/power.py
      - integration/harness/promotion.py
      - integration/harness/release.py
      - integration/harness/sandbox.py
      - integration/harness/stack.py
      - integration/harness/tmux.py
      - integration/pyproject.toml
      - integration/scenarios/installer/**
      - integration/uv.lock
  workflow_dispatch:
    inputs:
      stack_sha:
        description: Promoted `stack/<sha>` to install
        required: false
        default: 24889f7896be7157bf9077a41465a3b29620879f

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  installer:
    name: installer (${{ matrix.os }})
    permissions:
      contents: read
      attestations: read # Required by the attestations API used by `gh`'s fallback.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Install harness dependencies
        working-directory: integration
        run: uv sync --locked
      # Same-repo PR branches are owner-reviewed code (AGENTS.md): like main pushes/dispatches,
      # they get a read-only job token for `gh`'s fallback when hosted runner IPs exhaust GitHub's
      # anonymous 60 requests/hour. Fork PRs and non-main dispatches stay anonymous. The installer
      # strips the token from every child except `gh` fetching attestations without a bundle.
      # `test_installer_workflow_token_policy` pins and evaluates this expression.
      - name: Run the documented one-shot command in throwaway HOMEs
        env:
          GH_TOKEN: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')) && github.token || '' }}
          INSTALLER_SPEC: git+https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}@${{ github.event.pull_request.head.sha || github.sha }}#subdirectory=integration
          STACK_SHA: ${{ inputs.stack_sha || '24889f7896be7157bf9077a41465a3b29620879f' }}
        run: make -C integration installer
