# Re-route runs stranded on a dead self-hosted pool onto hosted runners. See docs/ci.md#self-hosted-pools.
name: Runner rescue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: runner-rescue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rescue:
    name: re-route stranded runs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restart runs queued on a pool that stopped heartbeating
        env:
          GH_TOKEN: ${{ github.token }}
          PI_LINUX_HEARTBEAT: ${{ vars.PI_LINUX_HEARTBEAT }}
          PI_MACOS_HEARTBEAT: ${{ vars.PI_MACOS_HEARTBEAT }}
          PI_WSL2_HEARTBEAT: ${{ vars.PI_WSL2_HEARTBEAT }}
          PI_POOLS_DISABLED: ${{ vars.PI_POOLS_DISABLED }}
        run: |
          flags=()
          if [ -n "$PI_POOLS_DISABLED" ]; then flags+=(--pools-disabled); fi
          python3 scripts/runner_rescue.py "${flags[@]}" \
            --pool-heartbeat "pi-linux=$PI_LINUX_HEARTBEAT" \
            --pool-heartbeat "pi-macos=$PI_MACOS_HEARTBEAT" \
            --pool-heartbeat "pi-wsl2=$PI_WSL2_HEARTBEAT"
