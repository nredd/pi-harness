# Re-route runs stranded on a dead self-hosted pool onto hosted runners. See docs/self-hosted-runners.md.
name: Runner rescue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: runner-rescue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rescue:
    name: re-route stranded runs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restart runs queued on a pool that stopped heartbeating
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PI_LINUX_HEARTBEAT: ${{ vars.PI_LINUX_HEARTBEAT }}
          PI_MACOS_HEARTBEAT: ${{ vars.PI_MACOS_HEARTBEAT }}
        run: |
          python3 scripts/runner_rescue.py \
            --pool-heartbeat "pi-linux=$PI_LINUX_HEARTBEAT" \
            --pool-heartbeat "pi-macos=$PI_MACOS_HEARTBEAT"
