# Re-plan stranded queues toward room in either pool. Routing policy: ci.yml classify comments.
name: Runner rescue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: runner-rescue
  cancel-in-progress: false

permissions:
  contents: read

# Policy: Bilateral queue rescue and retry bounds
# - Dead/draining pool queues: five minutes. Live pool and supported hosted queues: ten minutes.
# - Move only toward observed room: no queued hosted peers, or fresh positive pool capacity.
# - Never rescue forks or a run with an observed running sibling/started queued job; recheck before
#   whole-run cancellation. GitHub has no atomic cancel-if-queued, so a start after the read is residual.
# - At most three runs per tick and three attempts per run. Retries exclude the previous attempt's
#   pools. Cron delay and running siblings can extend the threshold; this is not an atomic job race.

jobs:
  rescue:
    name: re-route stranded runs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Re-plan overdue queues toward available capacity
        env:
          GH_TOKEN: ${{ github.token }}
          PI_LINUX_HEARTBEAT: ${{ vars.PI_LINUX_HEARTBEAT }}
          PI_MACOS_HEARTBEAT: ${{ vars.PI_MACOS_HEARTBEAT }}
          PI_WSL2_HEARTBEAT: ${{ vars.PI_WSL2_HEARTBEAT }}
          PI_POOLS_DISABLED: ${{ vars.PI_POOLS_DISABLED }}
        run: |
          flags=()
          if [ -n "$PI_POOLS_DISABLED" ]; then flags+=(--pools-disabled); fi
          python3 scripts/runner_rescue.py "${flags[@]}" \
            --pool-heartbeat "pi-linux=$PI_LINUX_HEARTBEAT" \
            --pool-heartbeat "pi-macos=$PI_MACOS_HEARTBEAT" \
            --pool-heartbeat "pi-wsl2=$PI_WSL2_HEARTBEAT"
