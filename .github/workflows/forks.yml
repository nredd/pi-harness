# Each Gitlinked fork's own gate at exactly its Gitlink, when a Gitlink (or this workflow) changes. See docs/ci.md.
name: Forks

on:
  pull_request:
    paths:
      - forks/**
      - .gitmodules
      - .github/workflows/forks.yml
      - Makefile
      - integration/core-source/**
      - integration/inprocess/support.ts
      - packages/subagents/**
      - packages/dev-tools/biome.json
      - package.json
      - package-lock.json
      - .npmrc
      - .node-version
  push:
    branches: [main]
    paths:
      - forks/**
      - .gitmodules
      - .github/workflows/forks.yml
      - Makefile
      - integration/core-source/**
      - integration/inprocess/support.ts
      - packages/subagents/**
      - packages/dev-tools/biome.json
      - package.json
      - package-lock.json
      - .npmrc
      - .node-version
  workflow_dispatch:
  workflow_call:

# A dispatch, including CI's `release-core` call, is a frozen candidate: one group per SHA and no
# cancellation, so a later dispatch never kills an earlier candidate's core evidence.
concurrency:
  group: forks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  core:
    name: core (forks/pi)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: forks/pi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize the fork at its Gitlink
        working-directory: .
        run: git submodule update --init forks/pi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # Key the cache on the lockfile this job's `npm ci` installs, never the root one (#531).
          cache: npm
          cache-dependency-path: forks/pi/package-lock.json
      - name: System dependencies (upstream CI's list)
        timeout-minutes: 5
        run: |
          # Skip apt when the runner image already has every package (#655).
          packages="libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep"
          # shellcheck disable=SC2086
          if ! dpkg -s $packages >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120 update
            # shellcheck disable=SC2086
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120 install -y $packages
          fi
          command -v fd >/dev/null || sudo ln -s "$(which fdfind)" /usr/local/bin/fd
      - name: Install
        run: npm ci --ignore-scripts
      - name: Restore the release's model data
        run: |
          # `npm run build` would fetch LIVE model data, which drifts from the release (fork runbook).
          version=$(node -p 'require("./packages/ai/package.json").version')
          npm pack "@earendil-works/pi-ai@$version" --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/earendil-works-pi-ai-$version.tgz" -C "$RUNNER_TEMP"
          rm -rf packages/ai/src/providers/data
          cp -R "$RUNNER_TEMP/package/dist/providers/data" packages/ai/src/providers/data
      - name: Build
        run: npm run build:offline
      - name: Check without rewriting
        run: |
          # The fork's `check` runs Biome with --write; CI runs the same steps with Biome check-only.
          # Fail loudly if the fork changes its check list instead of silently drifting from it.
          expected='node scripts/biome-check.mjs --write && npm run check:pinned-deps && npm run check:runtime-deps && npm run check:ts-imports && npm run check:entry-graphs && npm run check:install-lock:coding-agent && tsc --noEmit && npm run check:browser-smoke'
          actual=$(node -p 'require("./package.json").scripts.check')
          if [ "$actual" != "$expected" ]; then
            echo "::error::forks/pi changed its check script; update this step: $actual"
            exit 1
          fi
          node scripts/biome-check.mjs
          npm run check:pinned-deps
          npm run check:runtime-deps
          npm run check:ts-imports
          npm run check:entry-graphs
          npm run check:install-lock:coding-agent
          npx tsc --noEmit
          npm run check:browser-smoke
      - name: Build the pi-env daemon
        run: npm run build:daemon --workspace packages/env
      - name: Test (isolated HOME, no credentials)
        run: ./test.sh
      - name: Verify root core overrides before child install
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: make verify-root-overrides
      - name: Install owned packages for candidate-core child verification
        working-directory: .
        run: npm ci --ignore-scripts
      - name: Verify assembled direct and routed child compaction on candidate core
        working-directory: .
        run: make check-core-compaction
