name: Native helper build

on:
  pull_request:
    paths:
      - '.github/workflows/native-helper.yml'
      - '.github/workflows/publish.yml'
      - 'scripts/npm_release.py'
      - 'scripts/release_descriptors.py'
      - 'packages/computer-use/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Compile both architectures and check packed compiler output
        run: >-
          uv run --locked --project integration python scripts/npm_release.py native-check
          --artifact-dir "$RUNNER_TEMP/native-helper"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-helper-staging-${{ github.run_id }}
          path: ${{ runner.temp }}/native-helper/*.tgz
          if-no-files-found: error
          retention-days: 7
