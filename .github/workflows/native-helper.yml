name: Native helper build

on:
  pull_request:
    paths:
      - '.github/workflows/native-helper.yml'
      - '.github/workflows/publish.yml'
      - 'scripts/npm_release.py'
      - 'scripts/release_descriptors.py'
      - 'packages/computer-use/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Compile both architectures and check packed compiler output
        run: >-
          uv run --locked --project integration python scripts/npm_release.py native-check
          --artifact-dir "$RUNNER_TEMP/native-helper"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-helper-staging-${{ github.run_id }}
          path: ${{ runner.temp }}/native-helper/*.tgz
          if-no-files-found: error
          retention-days: 7

  windows-helper:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/packages/computer-use/native/windows/bridge-rs/target
      RUSTUP_TOOLCHAIN: '1.97.1'
      HELPER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned native toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup run 1.97.1 rustc --version --verbose | Tee-Object native-compiler.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Select-String -Quiet 'host: x86_64-pc-windows-msvc' native-compiler.log)) { throw 'Native Windows x64 MSVC compiler required' }
      - name: Link helper and execute real Windows crate tests
        shell: pwsh
        run: |
          $manifest = 'packages/computer-use/native/windows/bridge-rs/Cargo.toml'
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin windows-bridge --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --all-targets --target x86_64-pc-windows-msvc --manifest-path $manifest -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise only disposable native fixture windows
        shell: pwsh
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path packages/computer-use/native/windows/bridge-rs/Cargo.toml --example disposable_windows_fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $PSNativeCommandUseErrorActionPreference = $false
          & packages/computer-use/native/windows/bridge-rs/target/x86_64-pc-windows-msvc/release/examples/disposable_windows_fixture.exe 2>&1 | Tee-Object native-fixture.log
          $fixtureExit = $LASTEXITCODE
          $headlessReasons = @(
            'NATIVE_FIXTURE_UNSUPPORTED: session 0 is a noninteractive service session',
            'NATIVE_FIXTURE_UNSUPPORTED: OpenInputDesktop denied access to the interactive desktop'
          )
          $knownHeadless = Select-String -Quiet -SimpleMatch -Pattern $headlessReasons -Path native-fixture.log
          if ($fixtureExit -eq 3 -and $knownHeadless) {
            'NOT_RUN_HEADLESS' | Set-Content -Encoding ascii native-fixture-status.txt
            'Native GUI fixture: NOT RUN. Session 0 or input-desktop access denied; exact reason in native-fixture.log. Native link/unit evidence is separate.' >> $env:GITHUB_STEP_SUMMARY
          } elseif ($fixtureExit -ne 0) {
            'FAILED' | Set-Content -Encoding ascii native-fixture-status.txt
            exit $fixtureExit
          } else {
            'PASS' | Set-Content -Encoding ascii native-fixture-status.txt
            'Native GUI fixture: PASS against only its own disposable windows.' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Stage source-bound executable without publishing or installing
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-helper-artifact | Out-Null
          $exe = 'packages/computer-use/native/windows/bridge-rs/target/x86_64-pc-windows-msvc/release/windows-bridge.exe'
          $executableStatus = 'NOT_BUILT'
          if (Test-Path $exe) {
            Copy-Item $exe native-helper-artifact/windows-bridge.exe
            $hash = (Get-FileHash native-helper-artifact/windows-bridge.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  windows-bridge.exe" | Set-Content -Encoding ascii native-helper-artifact/SHA256SUMS
            $executableStatus = 'PRESENT'
          }
          $fixtureStatus = 'NOT_REACHED'
          if (Test-Path native-fixture-status.txt) {
            $fixtureStatus = (Get-Content -Raw native-fixture-status.txt).Trim()
          }
          "source=$env:HELPER_SOURCE_SHA`ntarget=x86_64-pc-windows-msvc`nrust_requested=1.97.1`nprotocol=4`ncapability=fail-closed-live-target-v1`nexecutable=$executableStatus`nfixture=$fixtureStatus" | Set-Content -Encoding ascii native-helper-artifact/build.txt
          foreach ($log in @('native-fixture.log', 'native-compiler.log', 'native-fixture-status.txt')) {
            if (Test-Path $log) { Copy-Item $log native-helper-artifact/ }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-helper-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-helper-artifact/*
          if-no-files-found: error
          retention-days: 7
