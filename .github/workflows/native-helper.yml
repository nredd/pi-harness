name: Windows verifier fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - name: Identify native verifier and Python
        run: |
          gh --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-project --python (Get-Content .python-version) python --version
      - name: Reproduce filtered verifier and isolate portable-cache hypothesis
        env:
          PYTHONPATH: integration
        run: |
          $env:SSL_CERT_FILE = Join-Path $env:RUNNER_TEMP 'cu-public-node-ca.pem'
          node -e 'require("node:fs").writeFileSync(process.argv[1], require("node:tls").rootCertificates.join("\n") + "\n")' "$env:SSL_CERT_FILE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-project --python (Get-Content .python-version) python scripts/diagnostics/windows_verifier_fixture.py
      - name: Preserve bounded public diagnostic receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-verifier-fixture
          path: |
            ${{ runner.temp }}/windows-verifier-fixture/*.log
            ${{ runner.temp }}/windows-verifier-fixture/*-command.json
            ${{ runner.temp }}/windows-verifier-fixture/outcomes.json
            ${{ runner.temp }}/windows-verifier-fixture/asset-sha256.txt
          if-no-files-found: error
