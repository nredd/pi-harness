name: Native helper build

on:
  pull_request:
    paths: &helper-inputs
      - '.github/workflows/native-helper.yml'
      - '.github/workflows/publish.yml'
      - 'scripts/ci_paths.py'
      - 'scripts/ci_native_helper.py'
      - 'scripts/runner_pools.py'
      - 'scripts/npm_release.py'
      - 'scripts/release_descriptors.py'
      - 'packages/computer-use/**'
  push:
    branches: [main]
    paths: *helper-inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    name: route native helper
    if: ${{ github.event_name != 'pull_request' && !vars.PI_POOLS_DISABLED }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.admit.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Admit a macOS pool slot
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          PI_MACOS_HEARTBEAT: ${{ vars.PI_MACOS_HEARTBEAT }}
        run: >-
          python3 scripts/ci_paths.py --native-helper --event "$GITHUB_EVENT_NAME"
          --github-output "$GITHUB_OUTPUT" --pool-heartbeat "pi-macos=$PI_MACOS_HEARTBEAT"
          --pool-run-id "$GITHUB_RUN_ID" --pool-repository "$GITHUB_REPOSITORY"
          --pool-attempt "$GITHUB_RUN_ATTEMPT"

  build:
    needs: route
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    # A rerun of failed jobs keeps `route`'s attempt-1 output, so only attempt 1 may use the pool.
    # CLT 27.2 compiled and ad hoc signed a trivial source with the required frameworks for both arches.
    # That probe did not run the real native-check workflow or compile its Swift sources on the pool.
    runs-on: ${{ needs.route.result == 'success' && github.run_attempt == 1 && needs.route.outputs.runner == 'pi-macos' && 'pi-macos' || 'xcode-27' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Compile both architectures and check packed compiler output
        run: >-
          uv run --locked --project tests/integration python scripts/npm_release.py native-check
          --artifact-dir "$RUNNER_TEMP/native-helper"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-helper-staging-${{ github.run_id }}
          path: ${{ runner.temp }}/native-helper/*.tgz
          if-no-files-found: error
          retention-days: 7

  windows-helper:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/packages/computer-use/native/windows/bridge-rs/target
      RUSTUP_TOOLCHAIN: '1.97.1'
      HELPER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out Windows helper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        id: setup_uv
        with:
          version: "0.13.1"
      # Resolve the same interpreter as staging before any build or fixture can run.
      - name: Bootstrap pinned staging interpreter
        id: bootstrap_python
        shell: pwsh
        run: uv run --no-project --python (Get-Content .python-version) python --version
      - name: Install pinned native toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup run 1.97.1 rustc --version --verbose | Tee-Object native-compiler.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Select-String -Quiet 'host: x86_64-pc-windows-msvc' native-compiler.log)) { throw 'Native Windows x64 MSVC compiler required' }
      - name: Link helper and execute real Windows crate tests
        shell: pwsh
        run: |
          $manifest = 'packages/computer-use/native/windows/bridge-rs/Cargo.toml'
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin windows-bridge --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --all-targets --target x86_64-pc-windows-msvc --manifest-path $manifest -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise only disposable native fixture windows
        shell: pwsh
        run: |
          'FAILED' | Set-Content -Encoding ascii native-fixture-status.txt
          cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path packages/computer-use/native/windows/bridge-rs/Cargo.toml --example disposable_windows_fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $PSNativeCommandUseErrorActionPreference = $false
          & packages/computer-use/native/windows/bridge-rs/target/x86_64-pc-windows-msvc/release/examples/disposable_windows_fixture.exe 2>&1 | Tee-Object native-fixture.log
          $fixtureExit = $LASTEXITCODE
          if ($fixtureExit -ne 0) {
            'FAILED' | Set-Content -Encoding ascii native-fixture-status.txt
            exit $fixtureExit
          } else {
            'PASS' | Set-Content -Encoding ascii native-fixture-status.txt
            'Native GUI fixture: PASS against only its own disposable windows.' >> $env:GITHUB_STEP_SUMMARY
          }
      # Stage and upload the full payload only on bootstrap_python success. Otherwise
      # (including skipped or cancelled bootstrap), write and upload only the receipt.
      - name: Stage source-bound executable without publishing or installing
        if: ${{ always() && steps.bootstrap_python.outcome == 'success' }}
        shell: pwsh
        run: >-
          uv run --no-project --python (Get-Content .python-version) python scripts/ci_native_helper.py --source-sha "$env:HELPER_SOURCE_SHA"
          --executable "packages/computer-use/native/windows/bridge-rs/target/x86_64-pc-windows-msvc/release/windows-bridge.exe"
          --artifact-dir native-helper-artifact
      - name: Record Windows helper bootstrap failure
        if: ${{ always() && steps.bootstrap_python.outcome != 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-helper-artifact | Out-Null
          # Keep this self-contained after checkout failure. Tests pin all shared fields against Python staging.
          $receipt = @(
            "source=$env:HELPER_SOURCE_SHA"
            'target=x86_64-pc-windows-msvc'
            "rust_requested=$env:RUSTUP_TOOLCHAIN"
            'protocol=4'
            'capability=fail-closed-live-target-v1'
            'executable=NOT_BUILT'
            'fixture=NOT_REACHED'
            'staging=BOOTSTRAP_FAILED'
          ) -join "`n"
          Set-Content -LiteralPath native-helper-artifact/build.txt -Encoding ascii -NoNewline -Value "$receipt`r`n"
      - name: Upload Windows helper evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-helper-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ steps.bootstrap_python.outcome == 'success' && 'native-helper-artifact/*' || 'native-helper-artifact/build.txt' }}
          if-no-files-found: error
          retention-days: 7
