name: Set up CI WSL guest
description: Prepare one Linux filesystem checkout for the ordinary CI steps
inputs:
  owned:
    description: Install Rust and nextest for owned gates
    default: 'false'
runs:
  using: composite
  steps:
    - name: Prepare LF checkout and early diagnostics
      shell: pwsh
      run: |
        git config --local core.autocrlf false
        git config --local core.eol lf
        # Reset alone can reuse clean CRLF index stat entries. Rebuild the disposable index.
        git read-tree --empty
        git reset --hard HEAD
        $diagnostics = Join-Path $env:RUNNER_TEMP 'wsl2-diagnostics'
        New-Item -ItemType Directory -Force $diagnostics | Out-Null
        Set-Content -Path (Join-Path $diagnostics 'capture-status.txt') -Value 'WSL guest has not started.'
    # Composite steps take no `timeout-minutes` and setup-wsl is third-party, so a watchdog bounds it (#626).
    # Hosted passes took 73-80s with apt inside setup-wsl; apt now runs in the bounded step below, and what is left
    # (cache restore plus `wsl --install`) took about 30s, so the deadline is 300s. `Start-Process` children did not
    # survive the step in run 42756515991 (the watchdog was gone, logs empty), so `Win32_Process.Create` starts it
    # outside the runner's process tree, and the step waits for its first heartbeat to prove the timer is armed.
    - name: Start WSL setup watchdog
      shell: pwsh
      run: |
        $diagnostics = Join-Path $env:RUNNER_TEMP 'wsl2-diagnostics'
        Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $diagnostics 'watchdog.*')
        $seconds = 300
        $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/wsl2_watchdog.ps1'
        $log = Join-Path $diagnostics 'watchdog.log'
        $command = "& '$script' -Label setup-wsl -Seconds $seconds -StateDirectory '$diagnostics' *> '$log'"
        $commandLine = '"{0}" -NoProfile -Command "{1}"' -f (Get-Process -Id $PID).Path, $command
        $created = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = $commandLine; CurrentDirectory = $env:GITHUB_WORKSPACE }
        if ($created.ReturnValue -ne 0) { throw "Win32_Process.Create failed with $($created.ReturnValue): $commandLine" }
        Set-Content -Path (Join-Path $diagnostics 'watchdog.pid') -Value $created.ProcessId
        # Line 1 is when the clock started, line 2 the deadline; the stop step enforces them if the watchdog is gone.
        Set-Content -Path (Join-Path $diagnostics 'watchdog.started') -Value @([DateTimeOffset]::UtcNow.ToUnixTimeSeconds(), $seconds)
        $alive = Join-Path $diagnostics 'watchdog.alive'
        for ($i = 0; $i -lt 40 -and -not (Test-Path $alive); $i++) { Start-Sleep -Milliseconds 500 }
        if (-not (Test-Path $alive)) { throw "The watchdog never armed (pid $($created.ProcessId)); log: $(Get-Content -Raw -ErrorAction SilentlyContinue $log)" }
        Write-Host "Watchdog armed: pid $($created.ProcessId), ${seconds}s"
    - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
      with:
        distribution: Ubuntu-24.04
        wsl-version: '2'
        update: 'false'
    - name: Stop WSL setup watchdog and report
      if: always()
      shell: pwsh
      run: |
        $diagnostics = Join-Path $env:RUNNER_TEMP 'wsl2-diagnostics'
        New-Item -ItemType File -Force (Join-Path $diagnostics 'watchdog.done') | Out-Null
        $watchdogPid = Get-Content -ErrorAction SilentlyContinue (Join-Path $diagnostics 'watchdog.pid')
        if ($watchdogPid) { Wait-Process -Id $watchdogPid -Timeout 90 -ErrorAction SilentlyContinue }
        $log = Join-Path $diagnostics 'watchdog.log'
        if ((Test-Path $log) -and (Get-Item $log).Length -gt 0) { Get-Content -ErrorAction SilentlyContinue $log | Write-Host }
        if (Test-Path (Join-Path $diagnostics 'watchdog.tripped')) {
          throw 'WSL setup was killed by its watchdog; see the report above'
        }
        # Backstop: a watchdog that died unseen must not let a slow step pass (run 42756515991 took 2646s).
        $started = Get-Content -ErrorAction SilentlyContinue (Join-Path $diagnostics 'watchdog.started')
        $alive = Get-Content -ErrorAction SilentlyContinue (Join-Path $diagnostics 'watchdog.alive')
        if ($started) {
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$started[0]
          Write-Host "setup-wsl step window: ${elapsed}s of $($started[1])s; watchdog last alive: $alive"
          if ($elapsed -gt [long]$started[1] + 30) {
            throw "WSL setup took ${elapsed}s, over its $($started[1])s deadline, and the watchdog did not trip (last alive: $alive)"
          }
        }
    # Hosted guest downloads of .debs crawl (50-300 kB/s) while the host's network is fast, so the .debs that
    # `scripts/wsl2_apt.sh` downloads are cached by the host's Actions cache, keyed by script and ISO week (#626).
    - name: Locate the WSL apt cache
      id: apt-cache
      shell: pwsh
      run: |
        $dir = Join-Path $env:RUNNER_TEMP 'wsl-apt-cache'
        New-Item -ItemType Directory -Force $dir | Out-Null
        "dir=$dir" >> $env:GITHUB_OUTPUT
        "week=$((Get-Date).ToUniversalTime().ToString('yyyy')+'-W'+[System.Globalization.ISOWeek]::GetWeekOfYear((Get-Date).ToUniversalTime()))" >> $env:GITHUB_OUTPUT
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.apt-cache.outputs.dir }}
        key: wsl-apt-${{ hashFiles('scripts/wsl2_apt.sh') }}-${{ steps.apt-cache.outputs.week }}
        restore-keys: wsl-apt-${{ hashFiles('scripts/wsl2_apt.sh') }}-
    - name: Assert WSL2 and prepare guest
      shell: pwsh
      env:
        WSL_OWNED: ${{ inputs.owned }}
        WSL_APT_CACHE: ${{ steps.apt-cache.outputs.dir }}
      run: |
        . (Join-Path $env:GITHUB_WORKSPACE 'scripts/wsl2_bounded.ps1')
        # Hosted passes took under 1s per host command (12s covered the first four host steps) and 22s to 67s for the guest
        # bootstrap; every bound is a few times that (#626). Each trip prints the stuck command and a process snapshot.
        $listing = Invoke-BoundedCapture 'list WSL distributions' 30 wsl --list --verbose
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $listing = ($listing -split "`r?`n") -join "`n"
        $listing
        if ($listing -notmatch '(?m)^\s*\*?\s*Ubuntu-24\.04\s+\S+\s+2\s*$') {
          throw 'Ubuntu-24.04 is not listed as WSL version 2'
        }
        $scripts = Invoke-BoundedCapture 'translate the scripts directory' 30 wsl -d Ubuntu-24.04 --exec wslpath -u "$env:GITHUB_WORKSPACE/scripts"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $scripts = $scripts.Trim()
        # apt runs here, not inside setup-wsl, so it is bounded and mirror-aware (#626).
        # Two attempts of 100s update plus 360s download, an offline 180s install and kill grace fit inside 1200s.
        $env:WSLENV = 'WSL_APT_CACHE/p'
        Invoke-Bounded 'apt prerequisites (scripts/wsl2_apt.sh)' 1200 wsl -d Ubuntu-24.04 --user root --exec bash -euo pipefail "$scripts/wsl2_apt.sh"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # Run every gate as an ordinary user.
        Invoke-Bounded 'create the pi-ci user' 30 wsl -d Ubuntu-24.04 --user root --exec /usr/sbin/useradd --create-home --shell /bin/bash pi-ci
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $env:WSL_HOST_WORKSPACE = $env:GITHUB_WORKSPACE
        $env:WSL_HOST_TEMP = $env:RUNNER_TEMP
        $env:WSLENV = 'WSL_HOST_WORKSPACE/p:WSL_HOST_TEMP/p:WSL_OWNED'
        # The script bounds its own commands (60s each, 90s for the owned tools, 180s per download); this covers the whole run.
        Invoke-Bounded 'guest bootstrap (scripts/wsl2_setup.sh)' 300 wsl -d Ubuntu-24.04 --user pi-ci --exec bash -euo pipefail "$scripts/wsl2_setup.sh"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
