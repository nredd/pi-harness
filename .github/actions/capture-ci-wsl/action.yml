name: Capture CI WSL reports
description: Export bounded reports to the host before ordinary artifact upload
inputs:
  cleanup:
    description: Remove the disposable guest checkout after capture
    default: ''
  job-status:
    description: >-
      The caller's `job.status`. On cleanup, anything but `success` (a failed, timed-out or cancelled
      step that never wrote `first-failure`) also collects guest state. It never changes the exit status.
    default: ''
# Policy: WSL failure capture and artifact policy
# A real WSL cell retains no docs-only or main-push bypass. Unavailable WSL, wrong distribution version/filesystem, bootstrap or gate failure fails the cell. Before ordinary artifact uploads, `capture-ci-wsl` exports only explicit synthetic artifact directories and contract JSON reports to the host. `scripts/wsl2_capture.sh` (a bootstrap for the measured `scripts/wsl2_capture.py`) still handles the former stack artifact directories; no CI job feeds them now. Native standalone artifacts are `standalone-<platform>-<stack>`, one per running stack cell, each holding only its own stack's reports. Native Node reports have the preceding `stack-*` upload. The startup diagnostic upload stays `standalone-startup-linux-x64`, personal cell only. The promotion consumer still reads `stack-ubuntu-24.04-personal` (`pi_release.promotion.PERSONAL_STACK_ARTIFACT`), unchanged; it does not consume standalone uploads. Final cleanup preserves the first guest-step failure status and bounded diagnostics. After a failed guest step, or when the caller's `job.status` (input `job-status`, forwarded as `WSL_JOB_STATUS`) is not `success`, final cleanup also writes `wsl2-diagnostics/guest-state.txt` for whole-guest stalls ([#445](https://github.com/nredd/pi-harness/issues/445)): `/proc` uptime, load, `meminfo`, swaps, PSI pressure, selected `/proc/vmstat` swap/reclaim/OOM counters, and the last 400 lines of unprivileged `dmesg`, else an explicit UNAVAILABLE line. No sudo: `pi-ci` gets no extra privilege for this, so `kernel.dmesg_restrict`, recorded in the report, decides whether the kernel log is readable. `python -m pi_release.credentials` scans the report first; a refusal or a scanner that cannot run exports only a withheld notice. Collection never changes the capture status, and green runs collect nothing. The job status covers a job timeout or cancel, which kills the guest step before `wsl2_run.sh` records `first-failure`. The `always()` capture steps do run after a cancel (e.g. run 41891045788, `owned shard (wsl2, ts)`: gate `cancelled`, both captures `success`). A `timeout-minutes` expiry is the same cancellation; the two #626 jobs ended at the 45 minute limit with their logs unavailable, so the cause is unconfirmed, and a guest that is still stalled can stall the capture too. Early host diagnostics survive setup failures. No arbitrary worktree files, command logs, environment or HOME are uploaded.

runs:
  using: composite
  steps:
    - name: Export synthetic artifacts
      shell: pwsh
      env:
        WSL_CAPTURE_MODE: ${{ inputs.cleanup }}
        WSL_JOB_STATUS: ${{ inputs.job-status }}
      run: |
        $env:WSL_HOST_WORKSPACE = $env:GITHUB_WORKSPACE
        $env:WSL_HOST_TEMP = $env:RUNNER_TEMP
        $env:WSLENV = 'WSL_HOST_WORKSPACE/p:WSL_HOST_TEMP/p:PI_BIN:WSL_JOB_STATUS'
        $capture = (wsl -d Ubuntu-24.04 --exec wslpath -u "$env:GITHUB_WORKSPACE/scripts/wsl2_capture.sh").Trim()
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        wsl -d Ubuntu-24.04 --user pi-ci --exec bash -euo pipefail "$capture" "$env:WSL_CAPTURE_MODE"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
