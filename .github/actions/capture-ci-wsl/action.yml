name: Capture CI WSL reports
description: Export bounded reports to the host before ordinary artifact upload
inputs:
  cleanup:
    description: Remove the disposable guest checkout after capture
    default: ''
runs:
  using: composite
  steps:
    - name: Export synthetic artifacts
      shell: pwsh
      env:
        WSL_CAPTURE_MODE: ${{ inputs.cleanup }}
      run: |
        $env:WSL_HOST_WORKSPACE = $env:GITHUB_WORKSPACE
        $env:WSL_HOST_TEMP = $env:RUNNER_TEMP
        $env:WSLENV = 'WSL_HOST_WORKSPACE/p:WSL_HOST_TEMP/p:PI_BIN'
        $capture = (wsl -d Ubuntu-24.04 --exec wslpath -u "$env:GITHUB_WORKSPACE/scripts/wsl2_capture.sh").Trim()
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        wsl -d Ubuntu-24.04 --exec bash -euo pipefail "$capture" "$env:WSL_CAPTURE_MODE"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
