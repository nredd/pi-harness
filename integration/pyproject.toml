[project]
name = "pi-harness-e2e"
version = "0.1.0"
description = "End-to-end verification for Redd's pi harness: core fork, extension forks, and chezmoi config."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
    "ty>=0.0.1a30",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "PT", "C4", "PTH", "RET", "TC"]
ignore = [
    # Scenario tables and assertion helpers legitimately take many parameters and branches.
    "PLR0913",
    "PLR0912",
    # Magic values are the point of assertion tables.
    "PLR2004",
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.pytest.ini_options]
testpaths = ["tests", "scenarios"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "static: config and pin checks, no pi process",
    "integration: headless pi with faux providers",
    "tui: interactive pi in a real tmux pane",
    "bench: timing benchmarks against stored baselines",
    "live: real providers, opt-in, costs money",
    "slow: real-time waits of minutes; still part of `make verify`",
]
