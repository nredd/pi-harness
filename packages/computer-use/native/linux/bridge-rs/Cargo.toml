[package]
name = "linux-bridge"
version = "0.1.0"
edition = "2021"
description = "AT-SPI native helper for pi-computer-use on Linux"

[dependencies]
base64 = "0.22"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
x11rb = { version = "0.13", features = ["composite", "xtest"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }

[features]
# Exposes the headless `testing::RecordingSink`; enabled only for this crate's own tests.
testing = []

[dev-dependencies]
linux-bridge = { path = ".", features = ["testing"] }
# `test-util` pauses the clock for deadline tests; it adds no crates.
tokio = { version = "1", features = ["test-util"] }
zbus = { version = "4", default-features = false, features = ["tokio", "p2p"] }

[lib]
name = "linux_bridge"
path = "src/lib.rs"
